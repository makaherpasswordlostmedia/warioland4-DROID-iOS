name: WL4 legacy build

# Branch: ioslegacy.  Target: iPad mini 1 (A5, 32-bit).  Linux runner, Theos + iPhoneOS 9.3 SDK (no Xcode needed).
# Needs YOUR OWN US ROM via secret WL4_ROM_ID (Google Drive file id).  The .ipa embeds ROM-derived data (make extract),
# so the job refuses to run in a public repo unless overridden.  Output: unsigned .ipa + .deb.

on:
  workflow_dispatch:
    inputs:
      allow_public_repo:
        description: "I understand the .ipa embeds ROM-derived data"
        type: boolean
        default: false
      opt_level:
        description: "Clang -O level for the wasm32 compile (0/1/2)"
        default: "2"
      version:
        description: "ROM version: us or jp"
        default: "us"

env:
  WASI_SDK_VERSION: "24"
  WABT_VERSION: "1.0.36"
  ROM_MD5_US: "5fe47355a33e3fabec2a1607af88a404"
  ROM_MD5_JP: "99c8ad779a16be513a9fdff502b6f5c2"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check runner glibc (toolchain needs >= 2.38)
        run: |
          cat /etc/os-release | head -2
          V=$(ldd --version | head -1 | grep -oE '[0-9]+\.[0-9]+$')
          echo "glibc $V"
          python3 -c "import sys; v=tuple(map(int,'$V'.split('.'))); sys.exit(0 if v>=(2,38) else 1)" || { echo "::error::Runner glibc $V is too old - this is not the ubuntu-24.04 runner"; exit 1; }

      - name: Refuse public repos unless overridden
        if: ${{ github.event.repository.private == false && inputs.allow_public_repo != true }}
        run: |
          echo "::error::Public repo: the .ipa embeds ROM-derived data. Rerun with allow_public_repo=true only if you accept that."
          exit 1

      - uses: actions/checkout@v4

      - name: Apply ioslegacy.patch (new files only)
        run: |
          test -f ioslegacy.patch || { echo "::error::ioslegacy.patch must be in the repo root"; exit 1; }
          git apply --whitespace=nowarn ioslegacy.patch

      - name: Add iOS 7 time shim (no host.c edits needed)
        run: |
          chmod +x ios-legacy/prepare.sh
          cat > ios-legacy/Sources/legacy_time.h <<'HEOF'
          /* iOS 7-9 SDK has no clock_gettime / clock_nanosleep / CLOCK_MONOTONIC (added in iOS 10).  Force-included via -include. */
          #ifndef WL4_LEGACY_TIME_H
          #define WL4_LEGACY_TIME_H
          #include <time.h>
          #include <errno.h>
          #include <stdint.h>
          #include <mach/mach_time.h>
          #ifndef CLOCK_MONOTONIC
          #define CLOCK_MONOTONIC 6
          #define TIMER_ABSTIME 1
          static inline int clock_gettime(int id, struct timespec *t) {
              static mach_timebase_info_data_t tb;
              (void)id;
              if (!tb.denom) mach_timebase_info(&tb);
              uint64_t v = mach_absolute_time();
              uint64_t ns = (tb.numer == tb.denom) ? v : v / tb.denom * tb.numer + v % tb.denom * tb.numer / tb.denom;
              t->tv_sec = (time_t)(ns / 1000000000ULL);
              t->tv_nsec = (long)(ns % 1000000000ULL);
              return 0;
          }
          static inline int clock_nanosleep(int id, int flags, const struct timespec *req, struct timespec *rem) {
              if (flags & TIMER_ABSTIME) {
                  struct timespec now; clock_gettime(id, &now);
                  long long ns = (long long)(req->tv_sec - now.tv_sec) * 1000000000LL + (req->tv_nsec - now.tv_nsec);
                  if (ns <= 0) return 0;
                  struct timespec d; d.tv_sec = (time_t)(ns / 1000000000LL); d.tv_nsec = (long)(ns % 1000000000LL);
                  return nanosleep(&d, NULL) ? errno : 0;
              }
              return nanosleep(req, rem) ? errno : 0;
          }
          #endif
          #endif
          HEOF
          grep -q 'legacy_time.h' ios-legacy/Makefile || sed -i 's|-DWL4_LEGACY=1|-DWL4_LEGACY=1 -include Sources/legacy_time.h|' ios-legacy/Makefile
          grep -n 'legacy_time' ios-legacy/Makefile

      - name: Make AppDelegate independent of audio.h version
        run: |
          python3 - <<'PYEOF'
          p = "ios-legacy/Sources/AppDelegate.m"
          t = open(p).read()
          shim = ('#include "audio.h"\n'
                  '/* some audio.h versions lack this: declare it and provide a weak no-op (a real definition in audio.c wins) */\n'
                  'void wl4_audio_request_restart(void);\n'
                  '__attribute__((weak)) void wl4_audio_request_restart(void) {}\n')
          assert '#include "audio.h"\n' in t
          t = t.replace('#include "audio.h"\n', shim, 1)
          open(p, "w").write(t)
          PYEOF
          grep -n "wl4_audio_request_restart" ios-legacy/Sources/AppDelegate.m | head -3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve settings
        run: |
          VER="${{ inputs.version }}"; VER="${VER:-us}"
          echo "VER=$VER" >> "$GITHUB_ENV"
          OPT="${{ inputs.opt_level }}"; echo "OPT_LEVEL=${OPT:-2}" >> "$GITHUB_ENV"
          if [ "$VER" = jp ]; then echo "ROM_MD5=$ROM_MD5_JP" >> "$GITHUB_ENV"; else echo "ROM_MD5=$ROM_MD5_US" >> "$GITHUB_ENV"; fi

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build python3-venv python3-pip \
            perl curl ca-certificates git unzip zip xz-utils bzip2 fakeroot

      - name: Get ROM
        env:
          ROM_ID: ${{ inputs.version == 'jp' && secrets.WL4_ROM_ID_JP || secrets.WL4_ROM_ID }}
        run: |
          if [ ! -f "baserom_${VER}.gba" ]; then
            [ -n "$ROM_ID" ] || { echo "::error::Secret WL4_ROM_ID (or WL4_ROM_ID_JP) not set"; exit 1; }
            pip install --quiet gdown
            gdown "$ROM_ID" -O "baserom_${VER}.gba"
          fi
          echo "${ROM_MD5}  baserom_${VER}.gba" | md5sum -c - || { echo "::error::ROM MD5 mismatch"; exit 1; }

      - name: Extract assets (make extract)
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --quiet pyyaml
          make extract VERSION=$VER

      - name: Cache wasi-sdk
        id: cache-wasi
        uses: actions/cache@v4
        with:
          path: ~/wasi-sdk
          key: wasi-sdk-${{ env.WASI_SDK_VERSION }}
      - name: Install wasi-sdk
        if: steps.cache-wasi.outputs.cache-hit != 'true'
        run: |
          V="$WASI_SDK_VERSION"; ARCH=$(uname -m); [ "$ARCH" = aarch64 ] && ARCH=arm64
          BASE="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${V}"
          curl -fsSL -o /tmp/wasi.tgz "${BASE}/wasi-sdk-${V}.0-${ARCH}-linux.tar.gz" \
            || curl -fsSL -o /tmp/wasi.tgz "${BASE}/wasi-sdk-${V}.0+m-${ARCH}-linux.tar.gz"
          mkdir -p ~/wasi-sdk && tar -xzf /tmp/wasi.tgz -C ~/wasi-sdk --strip-components=1

      - name: Cache wabt
        id: cache-wabt
        uses: actions/cache@v4
        with:
          path: |
            ~/wabt-install
            ~/wabt-src
          key: wabt-${{ env.WABT_VERSION }}
      - name: Build wabt (wasm2c)
        if: steps.cache-wabt.outputs.cache-hit != 'true'
        run: |
          V="$WABT_VERSION"
          git clone --recursive --depth 1 --branch "$V" https://github.com/WebAssembly/wabt ~/wabt-src 2>/dev/null \
            || git clone --recursive --depth 1 --branch "v$V" https://github.com/WebAssembly/wabt ~/wabt-src
          cmake -S ~/wabt-src -B ~/wabt-src/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$HOME/wabt-install"
          cmake --build ~/wabt-src/build -j"$(nproc)"
          cmake --install ~/wabt-src/build

      - name: portify -> wasm32 -> wasm2c
        env:
          WASI_SDK: /home/runner/wasi-sdk
          WABT: /home/runner/wabt-install
          WABT_SRC: /home/runner/wabt-src
        run: |
          set -o pipefail
          chmod +x port/build_wasm.sh
          ./port/build_wasm.sh "$VER" 2>&1 | tee port-build.log
          echo "--- failed C files (expected: none)"; cat port/build/FAILED.txt
          echo "--- unported asm sites (expected: none)"; cat port/build/ASM_SITES.txt
          test -s port/build/wasm2c/wl4.c

      - name: Prepare legacy sources (gen/)
        run: |
          chmod +x ios-legacy/prepare.sh
          ./ios-legacy/prepare.sh "$VER"

      - name: Use legacy audio (RemoteIO, self-starting)
        run: |
          cat > ios-legacy/Sources/audio_legacy.c <<'AEOF'
          /* Legacy iOS 7-9 audio: lock-free ring (game thread -> RemoteIO callback) + linear resampler with drift control.
           * Replaces port/host/audio.c in the legacy build.  Self-starting: the RemoteIO unit is opened on the first push, so it
           * works no matter whether host.c calls wl4_audio_start()/poll(). */
          #include <stdatomic.h>
          #include <stdint.h>
          #include <string.h>
          #include <stdio.h>
          #include <AudioToolbox/AudioToolbox.h>

          #define RING_FRAMES 16384u
          #define RING_MASK   (RING_FRAMES - 1)
          #define OUT_RATE    48000

          static int16_t g_ring[RING_FRAMES][2];
          static _Atomic uint32_t g_w, g_r;
          static _Atomic int g_rate = 13379, g_paused, g_flush, g_needRestart;
          static double g_pos; static int g_primed; static int16_t g_last[2];
          static AudioUnit g_au; static int g_retry, g_pushes;

          static void render(int16_t *out, int frames) {
              if (atomic_load_explicit(&g_paused, memory_order_relaxed)) { memset(out, 0, (size_t)frames * 4); g_primed = 0; return; }
              uint32_t w = atomic_load_explicit(&g_w, memory_order_acquire), r = atomic_load_explicit(&g_r, memory_order_relaxed);
              if (atomic_exchange_explicit(&g_flush, 0, memory_order_relaxed)) { r = w; g_pos = 0; g_primed = 0; }
              int srcRate = atomic_load_explicit(&g_rate, memory_order_relaxed);
              double base = (double)srcRate / (double)OUT_RATE, target = srcRate * 0.040;
              if (!g_primed) {
                  if ((double)(w - r) >= target) g_primed = 1;
                  else { memset(out, 0, (size_t)frames * 4); atomic_store_explicit(&g_r, r, memory_order_release); return; }
              }
              double err = ((double)(w - r) - target) / target;
              double adj = err * 0.02; if (adj > 0.01) adj = 0.01; if (adj < -0.01) adj = -0.01;
              double ratio = base * (1.0 + adj);
              for (int i = 0; i < frames; i++) {
                  if (w - r < 2) {
                      g_last[0] = (int16_t)(g_last[0] / 2); g_last[1] = (int16_t)(g_last[1] / 2);
                      out[2 * i] = g_last[0]; out[2 * i + 1] = g_last[1]; g_primed = 0; continue;
                  }
                  const int16_t *a = g_ring[r & RING_MASK], *b = g_ring[(r + 1) & RING_MASK];
                  float f = (float)g_pos;
                  g_last[0] = (int16_t)(a[0] + (b[0] - a[0]) * f); g_last[1] = (int16_t)(a[1] + (b[1] - a[1]) * f);
                  out[2 * i] = g_last[0]; out[2 * i + 1] = g_last[1];
                  g_pos += ratio;
                  while (g_pos >= 1.0) { g_pos -= 1.0; r++; if (w - r < 2) break; }
              }
              atomic_store_explicit(&g_r, r, memory_order_release);
          }

          static OSStatus au_render(void *ref, AudioUnitRenderActionFlags *flags, const AudioTimeStamp *ts, UInt32 bus, UInt32 frames, AudioBufferList *io) {
              (void)ref; (void)flags; (void)ts; (void)bus;
              if (io->mNumberBuffers < 1 || !io->mBuffers[0].mData) return noErr;
              render((int16_t *)io->mBuffers[0].mData, (int)frames);
              return noErr;
          }

          static void open_stream(void) {
              if (g_au) return;
              AudioComponentDescription d; memset(&d, 0, sizeof d);
              d.componentType = kAudioUnitType_Output; d.componentSubType = kAudioUnitSubType_RemoteIO; d.componentManufacturer = kAudioUnitManufacturer_Apple;
              AudioComponent c = AudioComponentFindNext(NULL, &d);
              if (!c || AudioComponentInstanceNew(c, &g_au) != noErr) { g_au = NULL; fprintf(stderr, "wl4: audio: RemoteIO unavailable\n"); return; }
              AudioStreamBasicDescription f; memset(&f, 0, sizeof f);
              f.mSampleRate = OUT_RATE; f.mFormatID = kAudioFormatLinearPCM;
              f.mFormatFlags = kAudioFormatFlagIsSignedInteger | kAudioFormatFlagIsPacked;
              f.mBitsPerChannel = 16; f.mChannelsPerFrame = 2; f.mFramesPerPacket = 1; f.mBytesPerFrame = 4; f.mBytesPerPacket = 4;
              AURenderCallbackStruct cb; cb.inputProc = au_render; cb.inputProcRefCon = NULL;
              OSStatus e1 = AudioUnitSetProperty(g_au, kAudioUnitProperty_StreamFormat, kAudioUnitScope_Input, 0, &f, sizeof f);
              OSStatus e2 = AudioUnitSetProperty(g_au, kAudioUnitProperty_SetRenderCallback, kAudioUnitScope_Input, 0, &cb, sizeof cb);
              OSStatus e3 = AudioUnitInitialize(g_au);
              OSStatus e4 = (e1 == noErr && e2 == noErr && e3 == noErr) ? AudioOutputUnitStart(g_au) : -1;
              atomic_store(&g_flush, 1);
              fprintf(stderr, "wl4: audio: RemoteIO %d Hz fmt=%d cb=%d init=%d start=%d\n", OUT_RATE, (int)e1, (int)e2, (int)e3, (int)e4);
              if (e4 != noErr) { AudioComponentInstanceDispose(g_au); g_au = NULL; }
          }
          static void close_stream(void) {
              if (!g_au) return;
              AudioOutputUnitStop(g_au); AudioUnitUninitialize(g_au); AudioComponentInstanceDispose(g_au); g_au = NULL;
          }

          void wl4_audio_request_restart(void) { atomic_store(&g_needRestart, 1); }
          void wl4_audio_start(void) { atomic_store(&g_w, 0); atomic_store(&g_r, 0); g_pos = 0; g_primed = 0; atomic_store(&g_paused, 0); atomic_store(&g_needRestart, 0); g_retry = 0; open_stream(); }
          void wl4_audio_stop(void) { close_stream(); }
          void wl4_audio_pause(int paused) {
              atomic_store_explicit(&g_paused, paused, memory_order_relaxed);
              if (!paused) atomic_store_explicit(&g_flush, 1, memory_order_relaxed);
          }
          void wl4_audio_poll(void) {
              if (atomic_exchange(&g_needRestart, 0)) { close_stream(); open_stream(); }
              else if (!g_au && ++g_retry % 120 == 0) open_stream();
          }

          void wl4_audio_push(const int8_t *right, const int8_t *left, int count, int rate) {
              if (++g_pushes == 1) fprintf(stderr, "wl4: audio: first push, %d samples @ %d Hz\n", count, rate);
              if (!g_au) wl4_audio_poll();                       /* self-start / retry even if host.c never calls start/poll */
              if (!g_au && g_pushes == 1) open_stream();
              atomic_store_explicit(&g_rate, rate > 4000 ? rate : 13379, memory_order_relaxed);
              if (atomic_load_explicit(&g_paused, memory_order_relaxed)) return;
              uint32_t w = atomic_load_explicit(&g_w, memory_order_relaxed), r = atomic_load_explicit(&g_r, memory_order_acquire);
              uint32_t used = w - r, cap = (uint32_t)atomic_load_explicit(&g_rate, memory_order_relaxed) / 8;
              if (cap > RING_FRAMES) cap = RING_FRAMES;
              uint32_t room = used < cap ? cap - used : 0;
              if ((uint32_t)count > room) count = (int)room;
              for (int i = 0; i < count; i++) {
                  uint32_t k = (w + (uint32_t)i) & RING_MASK;
                  g_ring[k][0] = (int16_t)(left[i] * 256);
                  g_ring[k][1] = (int16_t)(right[i] * 256);
              }
              atomic_store_explicit(&g_w, w + (uint32_t)count, memory_order_release);
          }
          AEOF
          rm -f ios-legacy/gen/core/host_audio.c
          grep -q audio_legacy.c ios-legacy/Makefile || sed -i 's|Sources/WL4Log.c|Sources/WL4Log.c Sources/audio_legacy.c|' ios-legacy/Makefile
          grep -n audio_legacy ios-legacy/Makefile
          ls ios-legacy/gen/core

      - name: Install Theos + iOS toolchain
        run: |
          set -euo pipefail
          export THEOS="$GITHUB_WORKSPACE/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain/linux/iphone"
          curl -fsSL "https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz" -o /tmp/ios-toolchain.tar.xz
          tar -xf /tmp/ios-toolchain.tar.xz -C "$THEOS/toolchain"
          mkdir -p "$THEOS/sdks"
          curl -fsSL -o /tmp/iphoneos9.3.sdk.tbz2 "https://raw.githubusercontent.com/Sn0wCooder/theos-sdks/master/iPhoneOS9.3.sdk.tbz2"
          tar -xjf /tmp/iphoneos9.3.sdk.tbz2 -C "$THEOS/sdks"
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          for fw in "$SDK"/System/Library/Frameworks/*.framework; do
            if [ -f "$fw/module.map" ]; then mkdir -p "$fw/Modules"; mv "$fw/module.map" "$fw/Modules/module.modulemap"; fi
          done
          find "$SDK/usr/include" -name module.map | while read -r m; do mv "$m" "$(dirname "$m")/module.modulemap"; done
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Build with Theos
        working-directory: ios-legacy
        env:
          FINALPACKAGE: "1"
        run: |
          set -euo pipefail
          make clean || true
          make package FINALPACKAGE=1 V=1 2>&1 | tee ../build-theos.log | tail -80
          ls -la packages

      - name: Verify Mach-O (armv7, min iOS 7.0)
        working-directory: ios-legacy
        run: |
          BIN="$(find .theos -type f -name WL4Legacy | head -n1)"
          file "$BIN" || true
          OTOOL="$(ls "$THEOS"/toolchain/linux/iphone/bin/*otool* 2>/dev/null | head -n1)"
          [ -n "$OTOOL" ] && "$OTOOL" -hv -l "$BIN" | grep -E "cputype|ARM|LC_VERSION_MIN|version|minos" | head -10 || true

      - name: Pack .ipa
        working-directory: ios-legacy
        run: |
          set -euo pipefail
          APP="$(find .theos -type d -name WL4Legacy.app | head -n1)"
          [ -n "$APP" ] || { echo "::error::WL4Legacy.app not found"; exit 1; }
          rm -rf ipa && mkdir -p ipa/Payload
          cp -a "$APP" ipa/Payload/
          (cd ipa && zip -qr "../packages/WL4-${VER}-armv7-ios7.ipa" Payload)
          ls -la packages

      - uses: actions/upload-artifact@v4
        with:
          name: WL4-${{ env.VER }}-ios-legacy-armv7
          path: |
            ios-legacy/packages/*.ipa
            ios-legacy/packages/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-ios-legacy
          path: |
            port-build.log
            build-theos.log
            port/build/errors.log
          if-no-files-found: ignore
