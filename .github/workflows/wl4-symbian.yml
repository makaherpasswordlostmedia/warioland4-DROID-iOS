          void CWl4Audio::Fill(TInt aSlot)
              {
              iSlot[aSlot].SetLength(KFrames * 2);
              wl4_audio_render((short*)iSlot[aSlot].Ptr(), KFrames);
              TRAP_IGNORE(iStream->WriteL(iSlot[aSlot]));
              }

          void CWl4Audio::MaoscOpenComplete(TInt aError)
              {
              if (aError != KErrNone) { return; }
              iStream->SetAudioPropertiesL(TMdaAudioDataSettings::ESampleRate22050Hz, TMdaAudioDataSettings::EChannelsMono);
              iStream->SetVolume(iStream->MaxVolume() * 3 / 4);
              iReady = ETrue;
              if (!iSuspended) { for (TInt i = 0; i < KSlots; i++) { Fill(i); } }
              }

          void CWl4Audio::MaoscBufferCopied(TInt aError, const TDesC8& aBuffer)
              {
              if (aError != KErrNone || iSuspended || !iReady) { return; }
              for (TInt i = 0; i < KSlots; i++)
                  {
                  if (iSlot[i].Ptr() == aBuffer.Ptr()) { Fill(i); return; }
                  }
              }

          void CWl4Audio::MaoscPlayComplete(TInt aError)
              {
              if (aError != KErrNone && aError != KErrCancel && !iSuspended) { OpenStream(); }
              }

          void CWl4Audio::Suspend()
              {
              iSuspended = ETrue;
              if (iStream) { iStream->Stop(); }
              iReady = EFalse;
              }

          void CWl4Audio::Resume()
              {
              if (!iSuspended) { return; }
              iSuspended = EFalse;
              OpenStream();
              }
