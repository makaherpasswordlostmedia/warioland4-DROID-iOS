          /* audio_sym.c - game thread pushes s8 stereo frames; the UI thread pulls 22050 Hz mono s16 (integer resampler). */
          #include "host_api.h"
          #include <stdint.h>
          #include <string.h>
          #define RING 16384u
          #define MASK (RING - 1)
          #define OUTRATE 22050
          static short g_ring[RING];
          static volatile unsigned g_w, g_r;
          static volatile int g_rate = 13379, g_en = 1, g_paused, g_flush, g_primed;
          static unsigned g_pos; static short g_last;
          #define BARRIER() __asm__ volatile("" ::: "memory")
          void wl4_audio_start(void) { g_w = g_r = 0; g_pos = 0; g_primed = 0; g_paused = 0; g_flush = 1; }
          void wl4_audio_stop(void) { g_paused = 1; }
          void wl4_audio_pause(int p) { g_paused = p; if (!p) g_flush = 1; }
          void wl4_audio_poll(void) {}
          void wl4_audio_set_enabled(int on) { g_en = on; if (on) g_flush = 1; }
          void wl4_audio_push(const int8_t *right, const int8_t *left, int count, int rate) {
              if (g_paused || !g_en) return;
              g_rate = rate > 4000 ? rate : 13379;
              unsigned w = g_w, r = g_r, used = w - r, cap = (unsigned)g_rate / 8;
              if (cap > RING) cap = RING;
              unsigned room = used < cap ? cap - used : 0;
              if ((unsigned)count > room) count = (int)room;
              for (int i = 0; i < count; i++) g_ring[(w + (unsigned)i) & MASK] = (short)((left[i] + right[i]) * 128);
              BARRIER(); g_w = w + (unsigned)count;
          }
          void wl4_audio_render(short *out, int frames) {
              if (g_paused || !g_en) { memset(out, 0, (size_t)frames * 2); g_primed = 0; return; }
              unsigned w = g_w, r = g_r; BARRIER();
              if (g_flush) { r = w; g_pos = 0; g_primed = 0; g_flush = 0; }
              int rate = g_rate; unsigned target = (unsigned)rate * 40u / 1000u;
              if (!g_primed) {
                  if (w - r >= target) g_primed = 1;
                  else { memset(out, 0, (size_t)frames * 2); g_r = r; return; }
              }
              int step = (int)(((unsigned)rate << 16) / OUTRATE);
              int err = (int)(w - r) - (int)target;
              int adj = err * (step / 50) / (int)target, lim = step / 100;
              if (adj > lim) adj = lim; if (adj < -lim) adj = -lim;
              step += adj;
              for (int i = 0; i < frames; i++) {
                  if (w - r < 2) { g_last = (short)(g_last / 2); out[i] = g_last; g_primed = 0; continue; }
                  int a = g_ring[r & MASK], b = g_ring[(r + 1) & MASK];
                  g_last = (short)(a + (((b - a) * (int)(g_pos & 0xFFFF)) >> 16));
                  out[i] = g_last;
                  g_pos += (unsigned)step; r += g_pos >> 16; g_pos &= 0xFFFF;
              }
              BARRIER(); g_r = r;
          }
