          int  wl4_running(void) { return g_running; }
          int  wl4_frame_counter(void) { return g_presented; }
          int  wl4_copy_frame(unsigned *out) { memcpy(out, g_buf[g_idx], sizeof g_buf[0]); return g_presented; }
          int  wl4_trap_code(void) { return g_trap; }
