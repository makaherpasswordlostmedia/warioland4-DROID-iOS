              while (g_paused && !g_stop) { plat_sleep_us(16000); init = 0; }
              if (g_stop) { g_running = 0; plat_exit_thread(); }
              unsigned now = plat_now_ms();
              if (!init || (int)(now - next) > 100 || (int)(next - now) > 100) { next = now; acc = 0; init = 1; }
              next += 16; acc += 743; if (acc >= 1000) { acc -= 1000; next++; }          /* 59.7275 Hz */
              int ahead = (int)(next - now);
              if (ahead > 1) plat_sleep_us((unsigned)(ahead - 1) * 1000u);
              int behind = (int)(plat_now_ms() - next);
              if (g_fs < 0) { if (behind > 12 && run < 3) { g_skipNow = 1; run++; } else { g_skipNow = 0; run = 0; } }
              else g_skipNow = (fsc++ % (g_fs + 1)) != 0;
          }

          int wl4_thread_main(void *arg) {
              (void)arg;
              wl4_logf("game thread start, rom=%u bytes", g_romSize);
              wasm_rt_init();
              g_env.inst = &g_inst;
              wasm2c_wl4_instantiate(&g_inst, &g_env);
              hal_init(g_inst.w2c_memory.data, g_inst.w2c_memory.size);
              HalCallbacks cb = { cb_vblank, cb_hblank, cb_vcount, cb_frame }; hal_set_callbacks(&cb);
              if (g_haveSave) memcpy(hal_sram(), g_save, GBA_SRAM_SIZE);
              if (hal_load_rom(g_rom, g_romSize, g_inst.w2c_rom_image) != 0) { wl4_logf("ROM does not fit"); g_trap = 1000; g_running = 0; return 0; }
              g_ready = 1;
              wl4_logf("entering AgbMain");
              w2c_wl4_AgbMain(&g_inst);
              wl4_logf("AgbMain returned");
              g_running = 0; return 0;
          }
          int  wl4_prepare(const unsigned char *rom, unsigned size) {
