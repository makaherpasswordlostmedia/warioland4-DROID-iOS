                  fmt++; int zero = 0, width = 0;
                  if (*fmt == 0x30) { zero = 1; fmt++; }
                  while (*fmt >= 0x30 && *fmt <= 0x39) { width = width * 10 + (*fmt - 0x30); fmt++; }
                  while (*fmt == 0x6C || *fmt == 0x7A || *fmt == 0x68) fmt++;
