          /* host_sym.c - Symbian host for the wasm2c-converted game (replaces port/host/host.c: no pthreads/signals/libc). */
          #include "wl4.h"
          #include "hal.h"
          #include "host_api.h"
          #include <stdarg.h>
          #include <stdio.h>
          #include <string.h>

          struct w2c_env { w2c_wl4 *inst; };
          void wl4_audio_start(void); void wl4_audio_stop(void); void wl4_audio_pause(int);
          void wl4_audio_poll(void); void wl4_audio_push(const int8_t *, const int8_t *, int, int);

          static w2c_wl4 g_inst; static struct w2c_env g_env;
          static uint32_t g_buf[2][GBA_W * GBA_H];
          static volatile int g_idx, g_presented, g_frames, g_stop, g_running, g_paused, g_trap, g_skipNow, g_fs = -1, g_ready;
          static const unsigned char *g_rom; static unsigned g_romSize;
          static uint8_t g_save[GBA_SRAM_SIZE]; static int g_haveSave;

          /* ---- tiny log ring (dumped to a file by the UI on stop/trap) ---- */
          static char g_log[24][100]; static unsigned g_logN;
          static void wl4_logf(const char *fmt, ...) {
              va_list ap; va_start(ap, fmt); vsnprintf(g_log[g_logN % 24], 100, fmt, ap); va_end(ap); g_logN++;
          }
          int wl4_dump_log(char *out, int max) {
              int o = 0; unsigned n = g_logN, first = n > 24 ? n - 24 : 0;
              for (unsigned i = first; i < n; i++) { const char *l = g_log[i % 24]; while (*l && o < max - 2) out[o++] = *l++; out[o++] = 10; }
              if (o < max) out[o] = 0;
              return o;
          }
          unsigned wl4_rom_commit_size(void) { return g_romSize ? ((g_romSize + 0xFFFu) & ~0xFFFu) : 0x800000u; }

          /* ---- frame skipping: hal.c is built with -Dppu_render_scanline=wl4_ppu_line ---- */
          void ppu_render_scanline(int y, uint32_t *dst240);
          void wl4_ppu_line(int y, uint32_t *dst) { if (!g_skipNow) ppu_render_scanline(y, dst); }

          void wl4_trap(wasm_rt_trap_t code) {
