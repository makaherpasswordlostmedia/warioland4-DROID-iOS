          // wl4_plat.cpp - platform hooks used by the C game core (allocation, sparse chunk, timing, thread exit).
          #include <e32std.h>
          #include <e32base.h>
          #include "host_api.h"

          static RChunk gChunk;
          static TBool gChunkOpen = EFalse;

          extern "C" {

          void* plat_malloc(unsigned n) { return User::Alloc(n ? n : 1); }
          void plat_free(void* p) { User::Free(p); }
          void* plat_realloc(void* p, unsigned n) { return User::ReAlloc(p, n ? n : 1); }

          // Reserve the whole GBA-shaped address range, commit only the regions the game touches.
          void* plat_mem_reserve(unsigned bytes)
              {
              if (gChunkOpen) { return gChunk.Base(); }
              if (gChunk.CreateDisconnectedLocal(0, 0, (TInt)bytes) != KErrNone) { return 0; }
              gChunkOpen = ETrue;
              return gChunk.Base();
              }

          int plat_mem_commit(unsigned off, unsigned len)
              {
              if (!gChunkOpen) { return -1; }
              return gChunk.Commit((TInt)off, (TInt)len);
              }

          void plat_mem_release(void)
              {
              if (gChunkOpen) { gChunk.Close(); gChunkOpen = EFalse; }
              }

          void plat_exit_thread(void)
              {
              RThread().Kill(KErrNone);
              for (;;) {}
              }

          unsigned plat_now_ms(void) { return (unsigned)User::NTickCount(); }

          void plat_sleep_us(unsigned us)
              {
              if (us >= 500) { User::After(TTimeIntervalMicroSeconds32((TInt)us)); }
              }

          }  // extern "C"
