              wl4_audio_start(); return 0;
          }
          void wl4_request_stop(void) { g_stop = 1; wl4_audio_stop(); }
          void wl4_pause(int p) { g_paused = p; wl4_audio_pause(p); }
          void wl4_set_keys(unsigned short k) { hal_set_keys(k); }
          void wl4_set_frameskip(int n) { g_fs = n; }
          void wl4_load_save(const unsigned char *d, unsigned n) { memset(g_save, 0xFF, sizeof g_save); memcpy(g_save, d, n > sizeof g_save ? sizeof g_save : n); g_haveSave = 1; }
