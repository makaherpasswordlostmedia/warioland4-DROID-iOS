name: Build Wario Land 4 Symbian^3 SIS

# SELF-CONTAINED: this single file carries the whole Symbian port (shim, host, audio, Avkon app, mmp/pkg)
# and writes it at build time. Drop it into .github/workflows/ of the decomp repo that already has port/.
#
# Pipeline
#   job 1 (ubuntu):  ROM -> make extract -> portify -> wasm32 -> wasm2c  (same as wl4-android.yml)
#   job 2 (macOS):   symbian3-toolchain (GCC 14.2 arm-none-symbianelf + Symbian^3 SDK, cached)
#                    -> cross-compile the C core into wl4core.lib -> abld (Avkon app) -> signed .sisx
#
# ROM: needs YOUR OWN US ROM (md5 5fe47355a33e3fabec2a1607af88a404), secret WL4_ROM_ID (gdown) or a committed
# baserom_us.gba in a PRIVATE repo. The .sisx embeds ROM-derived data, so public repos are refused by default.
# On the phone the app also needs the ROM file itself: copy the same .gba to E:\wl4\ (any *.gba of 4-16 MB there).
#
# Memory model: the game addresses GBA memory at its real addresses (up to 0x0E010000). On Symbian that range is
# reserved as a sparse RChunk and only the used regions are committed (EWRAM/IWRAM/VRAM/IO/ROM/data/SRAM).

on:
  workflow_dispatch:
    inputs:
      allow_public_repo:
        description: "I understand the SIS embeds ROM-derived data and is downloadable from a public repo"
        type: boolean
        default: false
      wabt_version:
        description: "Override wabt version (blank = default)"
        default: ""
      wasm_opt:
        description: "Clang -O level for the wasm32 compile (0/1/2)"
        default: "2"
      core_opt:
        description: "GCC -O level for the ARM compile of the game core (1 = faster build, 2 = faster game)"
        default: "1"
      commit_mb:
        description: "MB of wasm data/bss/stack committed at 0x0A000000 (raise if the game crashes on start)"
        default: "48"

env:
  WASI_SDK_VERSION: "24"
  WABT_VERSION: "1.0.36"
  ROM_MD5_US: "5fe47355a33e3fabec2a1607af88a404"
  TOOLCHAIN_REPO: fieldops-dev/symbian3-toolchain
  TOOLCHAIN_REF: a96f917e6c8f02fe4f7c2186f8df760d3d9d832a
  SYMBIAN_VOL: /Volumes/Symbian
  GNUPOC_COMMIT: d3ddaf58c734ad3ab34dc60a012f9d4768a9ed3e
  GCC4SYMBIAN_COMMIT: fe1b15a1c25716d5c515f12593080d58f14d4c3f

jobs:
  w2c:
    name: ROM -> wasm -> wasm2c C
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Refuse public repos unless overridden
        if: ${{ github.event.repository.private == false && inputs.allow_public_repo != true }}
        run: |
          echo "::error::Public repo: the SIS embeds data extracted from your ROM. Rerun with allow_public_repo=true only if you accept that."
          exit 1

      - uses: actions/checkout@v4

      - name: Resolve tool versions
        run: |
          WABT_EFF="${{ inputs.wabt_version }}"
          echo "WABT_EFF=${WABT_EFF:-${{ env.WABT_VERSION }}}" >> "$GITHUB_ENV"
          OPT="${{ inputs.wasm_opt }}"
          echo "OPT_LEVEL=${OPT:-2}" >> "$GITHUB_ENV"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build python3 python3-venv python3-pip curl ca-certificates git unzip

      - name: Get ROM
        env:
          ROM_ID: ${{ secrets.WL4_ROM_ID }}
        run: |
          if [ ! -f baserom_us.gba ]; then
            if [ -z "$ROM_ID" ]; then
              echo "::error::Secret WL4_ROM_ID not set. Add your Google Drive file ID as a repo secret."
              exit 1
            fi
            pip install --quiet gdown
            gdown "$ROM_ID" -O baserom_us.gba
          fi
          ls -l baserom_us.gba
          echo "${ROM_MD5_US}  baserom_us.gba" | md5sum -c - || { echo "::error::baserom_us.gba MD5 mismatch"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract assets from ROM (make extract)
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --quiet pyyaml
          make extract VERSION=us

      - name: Cache wasi-sdk
        id: cache-wasi
        uses: actions/cache@v4
        with:
          path: ~/wasi-sdk
          key: wasi-sdk-${{ env.WASI_SDK_VERSION }}

      - name: Install wasi-sdk
        if: steps.cache-wasi.outputs.cache-hit != 'true'
        run: |
          ARCH=$(uname -m)
          VER="${{ env.WASI_SDK_VERSION }}"
          BASE="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${VER}"
          if ! curl -fsSL -o /tmp/wasi.tgz "${BASE}/wasi-sdk-${VER}.0-${ARCH}-linux.tar.gz"; then
            curl -fsSL -o /tmp/wasi.tgz "${BASE}/wasi-sdk-${VER}.0+m-${ARCH}-linux.tar.gz"
          fi
          mkdir -p ~/wasi-sdk
          tar -xzf /tmp/wasi.tgz -C ~/wasi-sdk --strip-components=1
          ~/wasi-sdk/bin/clang --version

      - name: Cache wabt
        id: cache-wabt
        uses: actions/cache@v4
        with:
          path: |
            ~/wabt-install
            ~/wabt-src
          key: wabt-${{ env.WABT_EFF }}

      - name: Build wabt (wasm2c) from source
        if: steps.cache-wabt.outputs.cache-hit != 'true'
        run: |
          VER="${{ env.WABT_EFF }}"
          if ! git clone --recursive --depth 1 --branch "${VER}" https://github.com/WebAssembly/wabt ~/wabt-src 2>/dev/null; then
            git clone --recursive --depth 1 --branch "v${VER}" https://github.com/WebAssembly/wabt ~/wabt-src
          fi
          cmake -S ~/wabt-src -B ~/wabt-src/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$HOME/wabt-install"
          cmake --build ~/wabt-src/build -j"$(nproc)"
          cmake --install ~/wabt-src/build
          ~/wabt-install/bin/wasm2c --version

      - name: portify -> wasm32 -> wasm2c
        env:
          WASI_SDK: /home/runner/wasi-sdk
          WABT: /home/runner/wabt-install
          WABT_SRC: /home/runner/wabt-src
          OPT_LEVEL: ${{ env.OPT_LEVEL }}
        run: |
          set -o pipefail
          chmod +x port/build_wasm.sh
          ./port/build_wasm.sh us 2>&1 | tee port-build.log
          echo "--- failed C files (expected: none)";   cat port/build/FAILED.txt
          echo "--- unported asm sites (expected: none)"; cat port/build/ASM_SITES.txt
          echo "--- audit (expected: empty)";            cat port/build/p/AUDIT.txt
          test -s port/build/wasm2c/wl4.c
          ls -l port/build/wl4.wasm port/build/wasm2c/

      - name: Stage inputs for the Symbian job
        run: |
          set -e
          W=port/build/wasm2c
          mkdir -p w2c-out/wasm2c w2c-out/hal
          cp "$W"/* w2c-out/wasm2c/
          cp port/hal/*.c port/hal/*.h w2c-out/hal/
          python3 port/tools/gen_stubs.py "$W/wl4.h" w2c-out/wasm2c/wl4_stubs.c
          python3 - <<'PY'
          import re
          src = open("port/build/wasm2c/wl4.c", errors="replace").read()
          end = 0
          for m in re.finditer(r"LOAD_DATA\([^,]+,\s*(\d+)u?,[^,]+,\s*(\d+)\)", src):
              end = max(end, int(m.group(1)) + int(m.group(2)))
          print("data segments end at 0x%X (%.1f MB above 0x0A000000)" % (end, (end - 0x0A000000) / 1048576.0 if end else 0))
          open("w2c-out/data_end.txt", "w").write(str(end))
          PY
          du -sh w2c-out

      - name: Externalize wasm data segments (exe size limit)
        run: |
          set -e
          cat > externalize_data.py <<'WL4_EOF'
          #!/usr/bin/env python3
          """Move wasm data-segment arrays out of wl4.c (Symbian exe: text+rodata must stay below the 0x400000 data address).
          Runs on the Linux job: dumps all segments natively into wl4.dat, rewrites wl4.c to use runtime pointers,
          and emits wl4_segs.c (wl4_segptr[] + wl4_bind_segments()).
          usage: externalize_data.py <wasm2c dir> <out wl4.dat>"""
          import re, subprocess, struct, sys, os, glob

          W, DAT = sys.argv[1], sys.argv[2]
          src = open(W + "/wl4.c", errors="replace").read()
          pat = re.compile(r"static\s+const\s+u8\s+(data_segment_data_\w+)\s*\[\s*\]\s*=\s*")
          res, names, i = [], [], 0
          while True:
              m = pat.search(src, i)
              if not m:
                  res.append(src[i:]); break
              res.append(src[i:m.start()])
              j, in_s = m.end(), False
              while True:
                  ch = src[j]
                  if in_s:
                      if ch == "\\": j += 2; continue
                      if ch == '"': in_s = False
                  else:
                      if ch == '"': in_s = True
                      elif ch == ";": break
                  j += 1
              res.append("#define %s (wl4_segptr[%d])" % (m.group(1), len(names)))
              names.append(m.group(1)); i = j + 1
          print("data segments found:", len(names), "| sizeof() uses:", len(re.findall(r"sizeof\s*\(\s*data_segment", src)))
          if not names:
              print("no segments to externalize"); open(W + "/wl4_segs.c", "w").write(
                  "const unsigned char *wl4_segptr[1];\nint wl4_bind_segments(const unsigned char *b, unsigned n) { (void)b; (void)n; return 0; }\n")
              open(DAT, "wb").write(struct.pack("<I", 0)); sys.exit(0)

          # --- native dump of the original arrays (format independent) ---
          dump = ['#include "wl4.c"', "#include <stdio.h>",
                  "static const struct { const unsigned char *p; unsigned n; } S[] = {"]
          dump += ["  { (const unsigned char *)%s, (unsigned)sizeof(%s) }," % (n, n) for n in names]
          dump += ["};", "int main(int c, char **v) { FILE *f = fopen(v[1], \"wb\"); unsigned n = %d, i, off, z = 0;" % len(names),
                   "  off = 4 + 8 * n; fwrite(&n, 4, 1, f);",
                   "  for (i = 0; i < n; i++) { fwrite(&off, 4, 1, f); fwrite(&S[i].n, 4, 1, f); off += (S[i].n + 3u) & ~3u; }",
                   "  for (i = 0; i < n; i++) { fwrite(S[i].p, 1, S[i].n, f); while (ftell(f) & 3) fwrite(&z, 1, 1, f); }",
                   "  fclose(f); return 0; }"]
          open("/tmp/wl4_dump.c", "w").write("\n".join(dump))
          rt = []
          for f in sorted(glob.glob(W + "/wasm-rt-*.c")):
              b = os.path.basename(f)
              if b.endswith("-win.c") or "os-win" in b: continue
              if re.search(r'#\s*include\s+"%s"' % re.escape(b), src): continue
              rt.append(f)
          cmd = ["gcc", "-O0", "-w", "-I", W, "/tmp/wl4_dump.c", W + "/wl4_stubs.c"] + rt + ["-lm", "-Wl,--gc-sections", "-Wl,--unresolved-symbols=ignore-all", "-o", "/tmp/wl4_dump"]
          print(" ".join(cmd[:8]), "...")
          subprocess.check_call(cmd)
          subprocess.check_call(["/tmp/wl4_dump", DAT])
          print("wl4.dat: %d bytes" % os.path.getsize(DAT))

          open(W + "/wl4.c", "w").write("extern const unsigned char *wl4_segptr[];\n" + "".join(res))
          open(W + "/wl4_segs.c", "w").write(
              "const unsigned char *wl4_segptr[%d];\n"
              "int wl4_bind_segments(const unsigned char *b, unsigned n) {\n"
              "  const unsigned *h = (const unsigned *)b; unsigned i;\n"
              "  if (n < 4 || h[0] != %du) return -2;\n"
              "  for (i = 0; i < %du; i++) { if (h[1 + 2 * i] + h[2 + 2 * i] > n) return -3; wl4_segptr[i] = b + h[1 + 2 * i]; }\n"
              "  return 0;\n}\n" % (len(names), len(names), len(names)))
          print("wl4.c rewritten")
          WL4_EOF
          python3 externalize_data.py w2c-out/wasm2c w2c-out/wl4.dat
          ls -l w2c-out/wl4.dat

      - uses: actions/upload-artifact@v4
        with:
          name: wl4-w2c
          path: w2c-out
          retention-days: 1

  sis:
    name: Build wl4.sisx
    needs: w2c
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 360
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wl4-w2c
          path: w2c

      - name: Check out symbian3-toolchain
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TOOLCHAIN_REPO }}
          ref: ${{ env.TOOLCHAIN_REF }}
          path: toolchain

      - name: Create case-sensitive APFS volume
        run: |
          hdiutil create -size 24g -fs "Case-sensitive APFS" -volname Symbian -type SPARSE "$RUNNER_TEMP/symbian"
          hdiutil attach "$RUNNER_TEMP/symbian.sparseimage" -mountpoint "$SYMBIAN_VOL"
          sudo chown "$(id -u):$(id -g)" "$SYMBIAN_VOL"

      - name: Install Homebrew dependencies and Rosetta
        run: |
          brew install perl openssl@3 unshield make gmp mpfr libmpc isl gnu-sed
          brew unlink perl
          sudo softwareupdate --install-rosetta --agree-to-license || true

      - name: Restore toolchain cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /Volumes/Symbian/toolchain
            /Volumes/Symbian/sdks
            /Volumes/Symbian/gnupoc
          key: symbian3-toolchain-${{ env.TOOLCHAIN_REF }}-${{ env.GNUPOC_COMMIT }}-${{ env.GCC4SYMBIAN_COMMIT }}

      - name: Build toolchain and install SDK (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          JOBS: 4
        run: |
          set -eo pipefail
          cd toolchain
          source Scripts/env.sh
          mkdir -p "$N8_SRC"
          git clone https://github.com/mstorsjo/gnupoc-package "$N8_SRC/gnupoc-package"
          git -C "$N8_SRC/gnupoc-package" checkout "$GNUPOC_COMMIT"
          git clone https://github.com/fedor4ever/GCC4Symbian "$N8_SRC/GCC4Symbian"
          git -C "$N8_SRC/GCC4Symbian" checkout "$GCC4SYMBIAN_COMMIT"
          Scripts/fetch-sdk.sh
          Scripts/build-host-tools.sh
          Scripts/build-gcc.sh
          Scripts/install-sdk.sh

      - name: Save toolchain cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /Volumes/Symbian/toolchain
            /Volumes/Symbian/sdks
            /Volumes/Symbian/gnupoc
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Write port sources (symbian/)
        run: |
          set -e
          mkdir -p symbian/app/data
          cat > symbian/app/data/wl4.rss <<'WL4_EOF'
          NAME WL4A

          #include <eikon.rh>
          #include <avkon.rh>
          #include <avkon.rsg>
          #include <appinfo.rh>

          RESOURCE RSS_SIGNATURE { }

          RESOURCE TBUF r_default_document_name { buf = ""; }

          RESOURCE EIK_APP_INFO
              {
              }

          RESOURCE LOCALISABLE_APP_INFO r_localisable_app_info
              {
              short_caption = "WL4";
              caption_and_icon = CAPTION_AND_ICON_INFO
                  {
                  caption = "Wario Land 4";
                  number_of_icons = 0;
                  };
              }
          WL4_EOF
          mkdir -p symbian/app/data
          cat > symbian/app/data/wl4_reg.rss <<'WL4_EOF'
          #include <appinfo.rh>
          #include <wl4.rsg>

          UID2 KUidAppRegistrationResourceFile
          UID3 0xE1A5B0CE

          RESOURCE APP_REGISTRATION_INFO
              {
              app_file = "wl4";
              localisable_resource_file = "\\resource\\apps\\wl4";
              localisable_resource_id = R_LOCALISABLE_APP_INFO;
              embeddability = KAppNotEmbeddable;
              newfile = KAppDoesNotSupportNewFile;
              }
          WL4_EOF
          mkdir -p symbian/app/group
          cat > symbian/app/group/bld.inf <<'WL4_EOF'
          PRJ_PLATFORMS
          DEFAULT

          PRJ_MMPFILES
          wl4.mmp
          WL4_EOF
          mkdir -p symbian/app/group
          cat > symbian/app/group/wl4.mmp <<'WL4_EOF'
          // Wario Land 4 for Symbian^3 (wasm2c core + Avkon front end).
          #include <platform_paths.hrh>

          TARGET          wl4.exe
          TARGETTYPE      exe
          UID             0x100039CE 0xE1A5B0CE
          SECUREID        0xE1A5B0CE
          VENDORID        0
          CAPABILITY      NONE

          EPOCSTACKSIZE   0x14000
          EPOCHEAPSIZE    0x100000 0x4000000

          SOURCEPATH      ../src
          SOURCE          wl4_app.cpp
          SOURCE          wl4_container.cpp
          SOURCE          wl4_audio.cpp
          SOURCE          wl4_plat.cpp

          USERINCLUDE     ../inc
          USERINCLUDE     ../../core
          APP_LAYER_SYSTEMINCLUDE

          SOURCEPATH      ../data
          START RESOURCE  wl4.rss
          HEADER
          TARGETPATH      /resource/apps
          END

          START RESOURCE  wl4_reg.rss
          TARGETPATH      /private/10003a3f/import/apps
          END

          LIBRARY         euser.lib apparc.lib cone.lib eikcore.lib avkon.lib eikcoctl.lib
          LIBRARY         fbscli.lib bitgdi.lib gdi.lib ws32.lib efsrv.lib
          LIBRARY         mediaclientaudiostream.lib bafl.lib

          // the C game core is cross-compiled separately into wl4core.lib (see workflow)
          STATICLIBRARY   wl4core.lib

          OPTION          GCCE -O2
          WL4_EOF
          mkdir -p symbian/app/inc
          cat > symbian/app/inc/wl4_app.h <<'WL4_EOF'
          // wl4_app.h - Symbian^3 front end for the wasm2c Wario Land 4 port.
          #ifndef WL4_APP_H
          #define WL4_APP_H
          #include <aknapp.h>
          #include <akndoc.h>
          #include <aknappui.h>
          #include <coecntrl.h>
          #include <e32base.h>
          #include <f32file.h>
          #include <fbs.h>
          #include <w32std.h>
          #include <mdaaudiooutputstream.h>
          #include "host_api.h"

          const TUid KUidWl4 = { (TInt32)0xE1A5B0CE };

          // Callback-driven MMF output: pulls 22.05 kHz mono PCM16 from wl4_audio_render().
          class CWl4Audio : public CBase, public MMdaAudioOutputStreamCallback
              {
          public:
              static CWl4Audio* NewL();
              ~CWl4Audio();
              void Suspend();
              void Resume();
              void MaoscOpenComplete(TInt aError);
              void MaoscBufferCopied(TInt aError, const TDesC8& aBuffer);
              void MaoscPlayComplete(TInt aError);
          private:
              CWl4Audio();
              void ConstructL();
              void OpenStream();
              void Fill(TInt aSlot);
              enum { KSlots = 3, KFrames = 441 };
              CMdaAudioOutputStream* iStream;
              TBool iReady;
              TBool iSuspended;
              TBuf8<KFrames * 2> iSlot[KSlots];
              };

          class CWl4Container : public CCoeControl
              {
          public:
              static CWl4Container* NewL(const TRect& aRect);
              ~CWl4Container();
              void SetForeground(TBool aForeground);
              void Shutdown();
              void Draw(const TRect& aRect) const;
              void SizeChanged();
              void HandlePointerEventL(const TPointerEvent& aEvent);
              TKeyResponse OfferKeyEventL(const TKeyEvent& aKeyEvent, TEventCode aType);
          private:
              enum TMode { EPlay, EMenu, EMsg };
              enum { KMaxPtr = 4, KMenuItems = 4 };
              CWl4Container();
              void ConstructL(const TRect& aRect);
              TBool FindRom();
              TBool LoadRom();
              TBool LoadData();
              void StartGame();
              void StopGame();
              void SaveBattery();
              void WriteLog();
              static TInt TickCb(TAny* aPtr);
              void Tick();
              void Msg(const TDesC& aLine1, const TDesC& aLine2);
              TRect GameRect() const;
              void ComputeLayout();
              TUint PadMask() const;
              void PushKeys();
              void MenuAction(TInt aIndex);
              TRect MenuRow(TInt aIndex) const;
              void DrawPad(CWindowGc& aGc) const;
              void DrawMenu(CWindowGc& aGc) const;
              void DrawMsg(CWindowGc& aGc) const;
              void Ring(CWindowGc& aGc, const TRect& aRect, const TDesC& aLabel, TBool aDown) const;

              RFs iFs;
              CFbsBitmap* iBitmap;
              CPeriodic* iTimer;
              CWl4Audio* iAudio;
              RThread iThread;
              TBool iThreadOpen;
              TBool iStarted;
              TMode iMode;
              TUint8* iRom;
              TUint8* iData;
              TInt iRomSize;
              TFileName iRomPath;
              TFileName iSavePath;
              TUint8 iSave[65536];
              TUint8 iLastSave[65536];
              TBuf<96> iMsg1;
              TBuf<96> iMsg2;
              TInt iLastFrame;
              TInt iTicks;
              TInt iFrameskip;   // -1 auto
              TBool iSound;
              TUint iKeyMask;
              TBool iPtrDown[KMaxPtr];
              TPoint iPtrPos[KMaxPtr];
              TPoint iDpad;
              TInt iDpadR;
              TRect iBtnA, iBtnB, iBtnL, iBtnR, iBtnSel, iBtnStart, iBtnMenu;
              };

          class CWl4AppUi : public CAknAppUi
              {
          public:
              void ConstructL();
              ~CWl4AppUi();
              void HandleCommandL(TInt aCommand);
              void HandleForegroundEventL(TBool aForeground);
              void HandleResourceChangeL(TInt aType);
          private:
              CWl4Container* iContainer;
              };

          class CWl4Document : public CAknDocument
              {
          public:
              CWl4Document(CEikApplication& aApp) : CAknDocument(aApp) {}
          private:
              CEikAppUi* CreateAppUiL();
              };

          class CWl4Application : public CAknApplication
              {
          private:
              CApaDocument* CreateDocumentL();
              TUid AppDllUid() const;
              };
          #endif
          WL4_EOF
          mkdir -p symbian/app/sis
          cat > symbian/app/sis/wl4.pkg <<'WL4_EOF'
          ; Wario Land 4 for Symbian^3 - install package (paths are expanded by package-sis.sh)
          &EN
          #{"Wario Land 4"},(0xE1A5B0CE),1,0,0
          %{"wasm2c Symbian port"}
          :"Symbian port"
          [0x20022E6D], 0, 0, 0, {"S60ProductID"}
          [0x1028315F], 0, 0, 0, {"S60ProductID"}
          [0x102752AE], 0, 0, 0, {"S60ProductID"}
          [0x102032BE], 0, 0, 0, {"S60ProductID"}
          [0x101F7961], 0, 0, 0, {"S60ProductID"}
          "$(epocroot)epoc32/release/$(platform)/$(target)/wl4.exe"-"!:\sys\bin\wl4.exe"
          "$(epocroot)epoc32/data/z/resource/apps/wl4.rsc"-"!:\resource\apps\wl4.rsc"
          "$(epocroot)epoc32/data/z/private/10003a3f/import/apps/wl4_reg.rsc"-"!:\private\10003a3f\import\apps\wl4_reg.rsc"
          "$(epocroot)epoc32/data/z/private/e1a5b0ce/wl4.dat"-"!:\private\e1a5b0ce\wl4.dat"
          WL4_EOF
          mkdir -p symbian/app/src
          cat > symbian/app/src/wl4_app.cpp <<'WL4_EOF'
          // wl4_app.cpp - application / document / AppUi / entry point.
          #include <eikstart.h>
          #include <avkon.hrh>
