          // wl4_container.cpp - ROM lookup, game thread control, scaled blit, multi-touch pad, overlay menu.
          #include <e32std.h>
          #include <e32keys.h>
          #include <eikenv.h>
          #include <coemain.h>
          #include <gdi.h>
          #include <bitdev.h>
          #include "wl4_app.h"

          #define GBA_W 240
          #define GBA_H 160
          enum { KA = 1, KB = 2, KSel = 4, KStart = 8, KRight = 16, KLeft = 32, KUp = 64, KDown = 128, KR = 256, KL = 512 };

          static TInt GameThreadEntry(TAny*)
              {
              wl4_thread_main(0);
              return 0;
              }

          CWl4Container::CWl4Container() : iFrameskip(-1), iSound(ETrue) {}

          CWl4Container* CWl4Container::NewL(const TRect& aRect)
              {
              CWl4Container* c = new (ELeave) CWl4Container;
              CleanupStack::PushL(c);
              c->ConstructL(aRect);
              CleanupStack::Pop(c);
              return c;
              }

          void CWl4Container::ConstructL(const TRect& aRect)
              {
              CreateWindowL();
              SetExtentToWholeScreen();
              EnableDragEvents();
              Window().EnableAdvancedPointers();
              User::LeaveIfError(iFs.Connect());
              iBitmap = new (ELeave) CFbsBitmap;
              User::LeaveIfError(iBitmap->Create(TSize(GBA_W, GBA_H), EColor16MU));
              iTimer = CPeriodic::NewL(CActive::EPriorityStandard);
              ComputeLayout();
              ActivateL();
              iMode = EMsg;
              Msg(_L("Loading ROM..."), _L(""));
              if (!FindRom())
                  {
                  Msg(_L("ROM not found. Put the US ROM (.gba)"), _L("into E:\\wl4\\ and restart."));
                  }
              else if (LoadRom() && LoadData())
                  {
                  StartGame();
                  }
              DrawNow();
              }

          CWl4Container::~CWl4Container()
              {
              Shutdown();
              delete iTimer;
              delete iBitmap;
              iFs.Close();
              }

          void CWl4Container::Msg(const TDesC& a, const TDesC& b)
              {
              iMode = EMsg;
              iMsg1.Copy(a.Left(iMsg1.MaxLength()));
              iMsg2.Copy(b.Left(iMsg2.MaxLength()));
              }

          // ---- ROM lookup -----------------------------------------------------------
          TBool CWl4Container::FindRom()
              {
              TDriveList dl;
              iFs.DriveList(dl);
              _LIT(KD1, "\\wl4\\");
              _LIT(KD2, "\\roms\\");
              _LIT(KD3, "\\gba\\");
              _LIT(KD4, "\\");
              const TDesC* dirs[] = { &KD1, &KD2, &KD3, &KD4 };
              const TInt order[] = { EDriveE, EDriveF, EDriveD, EDriveC, EDriveG, EDriveH };
              for (TInt di = 0; di < 6; di++)
                  {
                  if (dl[order[di]] == 0) { continue; }
                  for (TInt k = 0; k < 4; k++)
                      {
                      TFileName path;
                      path.Append(TChar('A' + order[di]));
                      path.Append(TChar(':'));
                      path.Append(*dirs[k]);
                      CDir* list = NULL;
                      if (iFs.GetDir(path, KEntryAttNormal, ESortByName, list) != KErrNone || !list) { continue; }
                      for (TInt i = 0; i < list->Count(); i++)
                          {
                          const TEntry& e = (*list)[i];
                          if (e.iName.Length() > 4 && e.iName.Right(4).CompareF(_L(".gba")) == 0 &&
                              e.iSize >= 0x400000 && e.iSize <= 0x1000000 && path.Length() + e.iName.Length() <= KMaxFileName)
                              {
                              iRomPath = path;
                              iRomPath.Append(e.iName);
                              delete list;
                              return ETrue;
                              }
                          }
                      delete list;
                      }
                  }
              return EFalse;
              }

          TBool CWl4Container::LoadRom()
              {
              RFile f;
              if (f.Open(iFs, iRomPath, EFileRead | EFileShareReadersOnly) != KErrNone)
                  {
                  Msg(_L("Cannot open ROM"), iRomPath);
                  return EFalse;
                  }
              TInt size = 0;
              f.Size(size);
              iRom = (TUint8*)User::Alloc(size);
              if (!iRom)
                  {
                  f.Close();
                  Msg(_L("Out of memory loading ROM"), _L(""));
                  return EFalse;
                  }
              TPtr8 p(iRom, 0, size);
              TInt err = f.Read(p);
              f.Close();
              if (err != KErrNone || p.Length() != size)
                  {
                  Msg(_L("ROM read error"), _L(""));
                  return EFalse;
                  }
              iRomSize = size;
              if (size < 0xB0 || iRom[0xAC] != 'A' || iRom[0xAD] != 'W' || iRom[0xAE] != 'A' || iRom[0xAF] != 'E')
                  {
                  Msg(_L("Wrong ROM: need Wario Land 4 (US,"), _L("game code AWAE)."));
                  return EFalse;
                  }
              iSavePath = iRomPath;
              iSavePath.SetLength(iSavePath.Length() - 4);
              iSavePath.Append(_L(".sav"));
              Mem::Fill(iSave, sizeof(iSave), 0xFF);
              RFile s;
              if (s.Open(iFs, iSavePath, EFileRead) == KErrNone)
                  {
                  TPtr8 sp(iSave, 0, sizeof(iSave));
                  s.Read(sp);
                  s.Close();
                  }
              Mem::Copy(iLastSave, iSave, sizeof(iSave));
              wl4_load_save(iSave, sizeof(iSave));
              return ETrue;
              }

          // wl4.dat holds the wasm data segments (extracted assets) that do not fit into the exe
          TBool CWl4Container::LoadData()
              {
              TFileName p;
              p.Copy(RProcess().FileName().Left(2));
              p.Append(_L("\\private\\e1a5b0ce\\wl4.dat"));
              RFile f;
              if (f.Open(iFs, p, EFileRead | EFileShareReadersOnly) != KErrNone)
                  {
                  Msg(_L("wl4.dat missing (reinstall the SIS)"), p);
                  return EFalse;
                  }
              TInt size = 0;
              f.Size(size);
              iData = (TUint8*)User::Alloc(size);
              TInt err = iData ? KErrNone : KErrNoMemory;
              if (err == KErrNone)
                  {
                  TPtr8 d(iData, 0, size);
                  err = f.Read(d);
                  if (err == KErrNone && d.Length() != size) { err = KErrCorrupt; }
                  }
              f.Close();
              if (err != KErrNone || wl4_bind_segments(iData, (unsigned)size) != 0)
                  {
                  Msg(_L("wl4.dat read/bind error"), _L(""));
                  return EFalse;
                  }
              return ETrue;
              }

          // ---- game thread ----------------------------------------------------------
          void CWl4Container::StartGame()
              {
              if (wl4_prepare(iRom, (unsigned)iRomSize) != 0) { Msg(_L("Game already running"), _L("")); return; }
              wl4_set_frameskip(iFrameskip);
              TInt err = iThread.Create(_L("wl4game"), GameThreadEntry, 0x200000, (RAllocator*)NULL, NULL, EOwnerThread);
              if (err != KErrNone)
                  {
                  TBuf<40> m;
                  m.Format(_L("Thread create error %d"), err);
                  Msg(m, _L(""));
                  return;
                  }
              iThreadOpen = ETrue;
              iThread.SetPriority(EPriorityNormal);
              iThread.Resume();
              iStarted = ETrue;
              TRAPD(aerr, iAudio = CWl4Audio::NewL());
              (void)aerr;
              iMode = EPlay;
              iLastFrame = -1;
              iTimer->Start(0, 16000, TCallBack(TickCb, this));
              }

          void CWl4Container::StopGame()
              {
              if (!iStarted) { return; }
              iTimer->Cancel();
              SaveBattery();
              wl4_request_stop();
              for (TInt i = 0; i < 300 && wl4_running(); i++) { User::After(10000); }
              if (iThreadOpen)
                  {
                  if (iThread.ExitType() == EExitPending) { iThread.Kill(KErrNone); }
                  iThread.Close();
                  iThreadOpen = EFalse;
                  }
              delete iAudio;
              iAudio = NULL;
              WriteLog();
              plat_mem_release();
              iStarted = EFalse;
              }

          void CWl4Container::Shutdown()
              {
              StopGame();
              User::Free(iRom);
              iRom = NULL;
              User::Free(iData);
              iData = NULL;
              }

          void CWl4Container::SaveBattery()
              {
              if (!iStarted || !iSavePath.Length()) { return; }
              wl4_read_save(iSave);
              if (Mem::Compare(iSave, sizeof(iSave), iLastSave, sizeof(iLastSave)) == 0) { return; }
              RFile f;
              if (f.Replace(iFs, iSavePath, EFileWrite) == KErrNone)
                  {
                  f.Write(TPtrC8(iSave, sizeof(iSave)));
                  f.Close();
                  Mem::Copy(iLastSave, iSave, sizeof(iSave));
                  }
              }

          void CWl4Container::WriteLog()
              {
              if (!iRomPath.Length()) { return; }
              TBuf8<2600> buf;
              buf.SetLength(wl4_dump_log((char*)buf.Ptr(), 2500));
              TFileName p = iRomPath;
              p.SetLength(p.Length() - 4);
              p.Append(_L(".log"));
              RFile f;
              if (f.Replace(iFs, p, EFileWrite) == KErrNone) { f.Write(buf); f.Close(); }
              }

          void CWl4Container::SetForeground(TBool aFg)
              {
              if (!iStarted) { return; }
              if (aFg)
                  {
                  if (iMode == EPlay) { wl4_pause(0); iTimer->Start(0, 16000, TCallBack(TickCb, this)); }
                  if (iAudio) { iAudio->Resume(); }
                  }
              else
                  {
                  iTimer->Cancel();
                  wl4_pause(1);
                  if (iAudio) { iAudio->Suspend(); }
                  SaveBattery();
                  }
              }

          // ---- tick -----------------------------------------------------------------
          TInt CWl4Container::TickCb(TAny* p)
              {
              ((CWl4Container*)p)->Tick();
              return 0;
              }

          void CWl4Container::Tick()
              {
              if ((++iTicks & 127) == 0) { User::ResetInactivityTime(); }
              if ((iTicks % 1800) == 0) { SaveBattery(); }
              if (!wl4_running())
                  {
                  iTimer->Cancel();
                  WriteLog();
                  TBuf<64> m;
                  m.Format(_L("Game stopped (trap %d). See .log"), wl4_trap_code());
                  Msg(m, _L("Tap to exit."));
                  DrawNow();
                  return;
                  }
              TInt f = wl4_frame_counter();
              if (f == iLastFrame || iMode == EMsg) { return; }
              iLastFrame = f;
              iBitmap->LockHeap();
              wl4_copy_frame((unsigned*)iBitmap->DataAddress());
              iBitmap->UnlockHeap();
              DrawNow();
              }

          // ---- layout / drawing -----------------------------------------------------
          TRect CWl4Container::GameRect() const
              {
              TRect r = Rect();
              TInt h = r.Height(), w = h * 3 / 2;
              if (w > r.Width()) { w = r.Width(); h = w * 2 / 3; }
              TInt x = r.iTl.iX + (r.Width() - w) / 2, y = r.iTl.iY + (r.Height() - h) / 2;
              return TRect(x, y, x + w, y + h);
              }

          void CWl4Container::SizeChanged() { ComputeLayout(); }

          void CWl4Container::ComputeLayout()
              {
              TRect r = Rect();
              TInt W = r.Width(), H = r.Height();
              TInt u = H / 8;
              iDpadR = u * 2;
              iDpad = TPoint(iDpadR + u / 2, H - iDpadR - u / 2);
              iBtnA = TRect(W - u * 2 - u / 2, H - u * 4, W - u / 2, H - u * 2);
              iBtnB = TRect(W - u * 5, H - u * 3, W - u * 3, H - u);
              iBtnL = TRect(0, 0, u * 3, u * 2);
              iBtnR = TRect(W - u * 3, 0, W, u * 2);
              iBtnSel = TRect(W / 2 - u * 3, H - u, W / 2 - u / 4, H);
              iBtnStart = TRect(W / 2 + u / 4, H - u, W / 2 + u * 3, H);
              iBtnMenu = TRect(W / 2 - u * 2, 0, W / 2 + u * 2, u);
              }

          TUint CWl4Container::PadMask() const
              {
              TUint m = 0;
              for (TInt i = 0; i < KMaxPtr; i++)
                  {
                  if (!iPtrDown[i]) { continue; }
                  const TPoint& p = iPtrPos[i];
                  TInt dx = p.iX - iDpad.iX, dy = p.iY - iDpad.iY;
                  TInt lim = iDpadR * 3 / 2;
                  if (dx * dx + dy * dy < lim * lim * 2 && p.iX < Rect().Width() / 2)
                      {
                      TInt t = iDpadR / 3;
                      if (dx > t) { m |= KRight; }
                      if (dx < -t) { m |= KLeft; }
                      if (dy > t) { m |= KDown; }
                      if (dy < -t) { m |= KUp; }
                      }
                  if (iBtnA.Contains(p)) { m |= KA; }
                  if (iBtnB.Contains(p)) { m |= KB; }
                  if (iBtnL.Contains(p)) { m |= KL; }
                  if (iBtnR.Contains(p)) { m |= KR; }
                  if (iBtnSel.Contains(p)) { m |= KSel; }
                  if (iBtnStart.Contains(p)) { m |= KStart; }
                  }
              return m;
              }

          void CWl4Container::PushKeys() { wl4_set_keys((unsigned short)(iKeyMask | PadMask())); }

          void CWl4Container::Ring(CWindowGc& gc, const TRect& r, const TDesC& label, TBool down) const
              {
              gc.SetPenSize(TSize(down ? 4 : 2, down ? 4 : 2));
              gc.DrawEllipse(r);
              const CFont* font = CEikonEnv::Static()->NormalFont();
              gc.UseFont(font);
              gc.DrawText(label, r, r.Height() / 2 + font->AscentInPixels() / 2, CGraphicsContext::ECenter, 0);
              gc.DiscardFont();
              }

          void CWl4Container::DrawPad(CWindowGc& gc) const
              {
              TUint m = PadMask() | iKeyMask;
              gc.SetBrushStyle(CGraphicsContext::ENullBrush);
              gc.SetPenStyle(CGraphicsContext::ESolidPen);
              gc.SetPenColor(KRgbWhite);
              TRect d(iDpad.iX - iDpadR, iDpad.iY - iDpadR, iDpad.iX + iDpadR, iDpad.iY + iDpadR);
              gc.SetPenSize(TSize(2, 2));
              gc.DrawEllipse(d);
              gc.DrawLine(TPoint(d.iTl.iX, iDpad.iY), TPoint(d.iBr.iX, iDpad.iY));
              gc.DrawLine(TPoint(iDpad.iX, d.iTl.iY), TPoint(iDpad.iX, d.iBr.iY));
              Ring(gc, iBtnA, _L("A"), m & KA);
              Ring(gc, iBtnB, _L("B"), m & KB);
              Ring(gc, iBtnL, _L("L"), m & KL);
              Ring(gc, iBtnR, _L("R"), m & KR);
              Ring(gc, iBtnSel, _L("Select"), m & KSel);
              Ring(gc, iBtnStart, _L("Start"), m & KStart);
              Ring(gc, iBtnMenu, _L("Menu"), EFalse);
              }

          TRect CWl4Container::MenuRow(TInt i) const
              {
              TRect r = Rect();
              TInt w = Min(r.Width() - 40, 360), rh = Min(r.Height() / 6, 56);
              TInt x = (r.Width() - w) / 2, y = (r.Height() - rh * KMenuItems) / 2;
              return TRect(x, y + i * rh, x + w, y + (i + 1) * rh);
              }

          void CWl4Container::DrawMenu(CWindowGc& gc) const
              {
              TBuf<32> fs, snd;
              if (iFrameskip < 0) { fs.Copy(_L("Frameskip: auto")); } else { fs.Format(_L("Frameskip: %d"), iFrameskip); }
              snd.Copy(iSound ? _L("Sound: on") : _L("Sound: off"));
              TPtrC items[KMenuItems] = { _L("Resume"), fs, snd, _L("Exit") };
              const CFont* font = CEikonEnv::Static()->NormalFont();
              gc.UseFont(font);
              gc.SetPenStyle(CGraphicsContext::ESolidPen);
              gc.SetPenColor(KRgbWhite);
              gc.SetBrushStyle(CGraphicsContext::ESolidBrush);
              gc.SetBrushColor(TRgb(0x202020));
              for (TInt i = 0; i < KMenuItems; i++)
                  {
                  TRect r = MenuRow(i);
                  gc.DrawRect(r);
                  gc.DrawText(items[i], r, r.Height() / 2 + font->AscentInPixels() / 2, CGraphicsContext::ECenter, 0);
                  }
              gc.DiscardFont();
              }

          void CWl4Container::DrawMsg(CWindowGc& gc) const
              {
              const CFont* font = CEikonEnv::Static()->NormalFont();
              gc.UseFont(font);
              gc.SetPenColor(KRgbWhite);
              TRect r = Rect();
              TInt h = font->HeightInPixels() * 2;
              TRect a(r.iTl.iX, r.Height() / 2 - h, r.iBr.iX, r.Height() / 2);
              TRect b(r.iTl.iX, r.Height() / 2, r.iBr.iX, r.Height() / 2 + h);
              gc.DrawText(iMsg1, a, h / 2 + font->AscentInPixels() / 2, CGraphicsContext::ECenter, 0);
              gc.DrawText(iMsg2, b, h / 2 + font->AscentInPixels() / 2, CGraphicsContext::ECenter, 0);
              gc.DiscardFont();
              }

          void CWl4Container::Draw(const TRect& aRect) const
              {
              CWindowGc& gc = SystemGc();
              gc.SetBrushStyle(CGraphicsContext::ESolidBrush);
              gc.SetBrushColor(KRgbBlack);
              gc.Clear(aRect);
              if (iMode == EMsg) { DrawMsg(gc); return; }
              gc.DrawBitmap(GameRect(), iBitmap);
              DrawPad(gc);
              if (iMode == EMenu) { DrawMenu(gc); }
              }

          // ---- input ----------------------------------------------------------------
          void CWl4Container::MenuAction(TInt i)
              {
              switch (i)
                  {
                  case 0:
                      iMode = EPlay;
                      wl4_pause(0);
                      iLastFrame = -1;
                      break;
                  case 1:
                      iFrameskip = (iFrameskip >= 3) ? -1 : iFrameskip + 1;
                      wl4_set_frameskip(iFrameskip);
                      break;
                  case 2:
                      iSound = !iSound;
                      wl4_audio_set_enabled(iSound);
                      break;
                  case 3:
                      CEikonEnv::Static()->EikAppUi()->HandleCommandL(EEikCmdExit);
                      return;
                  }
              DrawNow();
              }

          void CWl4Container::HandlePointerEventL(const TPointerEvent& e)
              {
              if (iMode == EMsg)
                  {
                  if (e.iType == TPointerEvent::EButton1Down && !wl4_running()) { CEikonEnv::Static()->EikAppUi()->HandleCommandL(EEikCmdExit); }
                  return;
                  }
              TInt n = 0;
              const TAdvancedPointerEvent* ae = e.AdvancedPointerEvent();
              if (ae) { n = ae->PointerNumber(); }
              if (n < 0 || n >= KMaxPtr) { n = 0; }
              switch (e.iType)
                  {
                  case TPointerEvent::EButton1Down:
                      iPtrDown[n] = ETrue;
                      iPtrPos[n] = e.iPosition;
                      if (iMode == EMenu)
                          {
                          iPtrDown[n] = EFalse;
                          for (TInt i = 0; i < KMenuItems; i++) { if (MenuRow(i).Contains(e.iPosition)) { MenuAction(i); break; } }
                          }
                      else if (iBtnMenu.Contains(e.iPosition))
                          {
                          iPtrDown[n] = EFalse;
                          iMode = EMenu;
                          wl4_pause(1);
                          wl4_set_keys(0);
                          DrawNow();
                          }
                      break;
                  case TPointerEvent::EDrag:
                  case TPointerEvent::EMove:
                      iPtrPos[n] = e.iPosition;
                      break;
                  case TPointerEvent::EButton1Up:
                      iPtrDown[n] = EFalse;
                      break;
                  default:
                      break;
                  }
              if (iMode == EPlay) { PushKeys(); }
              }

          TKeyResponse CWl4Container::OfferKeyEventL(const TKeyEvent& k, TEventCode type)
              {
              if (type != EEventKeyDown && type != EEventKeyUp) { return EKeyWasConsumed; }
              TUint bit = 0;
              switch (k.iScanCode)
                  {
                  case EStdKeyRightArrow: bit = KRight; break;
                  case EStdKeyLeftArrow: bit = KLeft; break;
                  case EStdKeyUpArrow: bit = KUp; break;
                  case EStdKeyDownArrow: bit = KDown; break;
                  case 'X': bit = KA; break;
                  case 'Z': bit = KB; break;
                  case 'A': bit = KL; break;
                  case 'S': bit = KR; break;
                  case EStdKeyEnter: case EStdKeyDevice3: bit = KStart; break;
                  case EStdKeySpace: case EStdKeyBackspace: bit = KSel; break;
                  case EStdKeyDevice0:
                      if (type == EEventKeyDown && iMode == EPlay)
                          {
                          iMode = EMenu;
                          wl4_pause(1);
                          DrawNow();
                          }
                      return EKeyWasConsumed;
                  default: break;
                  }
              if (bit)
                  {
                  if (type == EEventKeyDown) { iKeyMask |= bit; } else { iKeyMask &= ~bit; }
                  if (iMode == EPlay) { PushKeys(); }
                  }
              return EKeyWasConsumed;
              }
