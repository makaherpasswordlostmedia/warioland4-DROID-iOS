          #define fabsf(x) __builtin_fabsf(x)
          #define ceil(x) __builtin_ceil(x)
          #define ceilf(x) __builtin_ceilf(x)
          #define floor(x) __builtin_floor(x)
          #define floorf(x) __builtin_floorf(x)
          #define trunc(x) __builtin_trunc(x)
          #define truncf(x) __builtin_truncf(x)
          #define nearbyint(x) __builtin_nearbyint(x)
          #define nearbyintf(x) __builtin_nearbyintf(x)
          #define sqrt(x) __builtin_sqrt(x)
          #define sqrtf(x) __builtin_sqrtf(x)
          #define copysign(a,b) __builtin_copysign(a,b)
          #define copysignf(a,b) __builtin_copysignf(a,b)
          #define fmin(a,b) __builtin_fmin(a,b)
          #define fminf(a,b) __builtin_fminf(a,b)
          #define fmax(a,b) __builtin_fmax(a,b)
          #define fmaxf(a,b) __builtin_fmaxf(a,b)
          #define isnan(x) __builtin_isnan(x)
          #define isinf(x) __builtin_isinf(x)
          #define signbit(x) __builtin_signbit(x)
          #define NAN __builtin_nanf("")
          #define INFINITY __builtin_inff()
          #define HUGE_VAL __builtin_huge_val()
          #endif
          WL4_EOF
          mkdir -p symbian/shim
          cat > symbian/shim/setjmp.h <<'WL4_EOF'
          #ifndef WL4_SHIM_SETJMP_H
          #define WL4_SHIM_SETJMP_H
          /* traps never unwind in this port: the trap handler ends the game thread */
          typedef int jmp_buf[1];
          typedef int sigjmp_buf[1];
          #define setjmp(b) (0)
          #define _setjmp(b) (0)
          #define sigsetjmp(b, m) (0)
          static inline void longjmp(jmp_buf b, int v) { (void)b; (void)v; for (;;) {} }
          static inline void siglongjmp(sigjmp_buf b, int v) { (void)b; (void)v; for (;;) {} }
          #endif
          WL4_EOF
          mkdir -p symbian/shim
          cat > symbian/shim/signal.h <<'WL4_EOF'
          #ifndef WL4_SHIM_SIGNAL_H
          #define WL4_SHIM_SIGNAL_H
          typedef int sig_atomic_t;
          #endif
          WL4_EOF
          mkdir -p symbian/shim
          cat > symbian/shim/stdio.h <<'WL4_EOF'
          #ifndef WL4_SHIM_STDIO_H
          #define WL4_SHIM_STDIO_H
          #include <stddef.h>
          #include <stdarg.h>
          #define EOF (-1)
          typedef struct wl4_file FILE;
          extern FILE *stdout, *stderr;
          int fprintf(FILE *, const char *, ...);
          int printf(const char *, ...);
          int snprintf(char *, size_t, const char *, ...);
          int vsnprintf(char *, size_t, const char *, va_list);
          int fputs(const char *, FILE *);
          int puts(const char *);
          int fflush(FILE *);
          #endif
          WL4_EOF
          mkdir -p symbian/shim
          cat > symbian/shim/stdlib.h <<'WL4_EOF'
          #ifndef WL4_SHIM_STDLIB_H
          #define WL4_SHIM_STDLIB_H
          #include <stddef.h>
          void *malloc(size_t);
          void *calloc(size_t, size_t);
          void *realloc(void *, size_t);
          void  free(void *);
          void  abort(void) __attribute__((noreturn));
          void  exit(int) __attribute__((noreturn));
          int   abs(int);
          #endif
          WL4_EOF
          mkdir -p symbian/shim
          cat > symbian/shim/stdint.h <<'WL4_EOF'
          #ifndef WL4_SHIM_STDINT_H
          #define WL4_SHIM_STDINT_H
          /* the cross GCC is built without libc and ships no stdint.h: derive everything from compiler macros */
          typedef __INT8_TYPE__ int8_t;
          typedef __INT16_TYPE__ int16_t;
          typedef __INT32_TYPE__ int32_t;
          typedef __INT64_TYPE__ int64_t;
          typedef __UINT8_TYPE__ uint8_t;
          typedef __UINT16_TYPE__ uint16_t;
          typedef __UINT32_TYPE__ uint32_t;
          typedef __UINT64_TYPE__ uint64_t;
          typedef __INTPTR_TYPE__ intptr_t;
          typedef __UINTPTR_TYPE__ uintptr_t;
          typedef __INTMAX_TYPE__ intmax_t;
          typedef __UINTMAX_TYPE__ uintmax_t;
          #define INT8_MIN (-128)
          #define INT16_MIN (-32767-1)
          #define INT32_MIN (-2147483647-1)
          #define INT64_MIN (-9223372036854775807LL-1)
          #define INT8_MAX 127
          #define INT16_MAX 32767
          #define INT32_MAX 2147483647
          #define INT64_MAX 9223372036854775807LL
          #define UINT8_MAX 255
          #define UINT16_MAX 65535
          #define UINT32_MAX 4294967295U
          #define UINT64_MAX 18446744073709551615ULL
          #define INTPTR_MIN INT32_MIN
          #define INTPTR_MAX INT32_MAX
          #define UINTPTR_MAX UINT32_MAX
          #define SIZE_MAX UINT32_MAX
          #define INTMAX_MAX INT64_MAX
          #define INTMAX_MIN INT64_MIN
          #define UINTMAX_MAX UINT64_MAX
          #define INT8_C(x) x
          #define INT16_C(x) x
          #define INT32_C(x) x
          #define INT64_C(x) x##LL
          #define UINT8_C(x) x
          #define UINT16_C(x) x
          #define UINT32_C(x) x##U
          #define UINT64_C(x) x##ULL
          #endif
          WL4_EOF
          cat > symbian/shim/limits.h <<'WL4_EOF'
          #ifndef WL4_SHIM_LIMITS_H
          #define WL4_SHIM_LIMITS_H
          #define CHAR_BIT 8
          #define SCHAR_MIN (-128)
          #define SCHAR_MAX 127
          #define UCHAR_MAX 255
          #define CHAR_MIN 0
          #define CHAR_MAX 255
          #define SHRT_MIN (-32768)
          #define SHRT_MAX 32767
          #define USHRT_MAX 65535
          #define INT_MIN (-2147483647-1)
          #define INT_MAX 2147483647
          #define UINT_MAX 4294967295U
          #define LONG_MIN (-2147483647L-1)
          #define LONG_MAX 2147483647L
          #define ULONG_MAX 4294967295UL
          #define LLONG_MIN (-9223372036854775807LL-1)
          #define LLONG_MAX 9223372036854775807LL
          #define ULLONG_MAX 18446744073709551615ULL
          #endif
          WL4_EOF
          cat > symbian/shim/threads.h <<'WL4_EOF'
          #ifndef WL4_SHIM_THREADS_H
          #define WL4_SHIM_THREADS_H
          /* single-threaded runtime on this target: no TLS, mutexes are no-ops */
          #define thread_local
          typedef int mtx_t;
          enum { thrd_success = 0, thrd_error = 2 };
          enum { mtx_plain = 0, mtx_recursive = 1 };
          static inline int mtx_init(mtx_t *m, int t) { (void)t; *m = 0; return thrd_success; }
          static inline int mtx_lock(mtx_t *m) { (void)m; return thrd_success; }
          static inline int mtx_unlock(mtx_t *m) { (void)m; return thrd_success; }
          static inline void mtx_destroy(mtx_t *m) { (void)m; }
          #endif
          WL4_EOF
          cat > symbian/shim/alloca.h <<'WL4_EOF'
          #ifndef WL4_SHIM_ALLOCA_H
          #define WL4_SHIM_ALLOCA_H
          #define alloca(n) __builtin_alloca(n)
          #endif
          WL4_EOF
          cat > symbian/shim/string.h <<'WL4_EOF'
          #ifndef WL4_SHIM_STRING_H
          #define WL4_SHIM_STRING_H
          #include <stddef.h>
          void *memcpy(void *, const void *, size_t);
          void *memmove(void *, const void *, size_t);
          void *memset(void *, int, size_t);
          int   memcmp(const void *, const void *, size_t);
          size_t strlen(const char *);
          int   strcmp(const char *, const char *);
          #endif
          WL4_EOF
          mkdir -p symbian/shim
          cat > symbian/shim/unistd.h <<'WL4_EOF'
          #ifndef WL4_SHIM_UNISTD_H
          #define WL4_SHIM_UNISTD_H
          #endif
          WL4_EOF
          mkdir -p symbian/shim/sys
          cat > symbian/shim/sys/mman.h <<'WL4_EOF'
          #ifndef WL4_SHIM_UNISTD_H
          #define WL4_SHIM_UNISTD_H
          #endif
          WL4_EOF
          mkdir -p symbian/tools
          cat > symbian/tools/gen_mem.py <<'WL4_EOF'
          #!/usr/bin/env python3
          """Generate wl4_mem.c: wasm_rt_allocate/grow/free_memory backed by a sparse Symbian chunk.
          Prototypes are read from the staged wasm-rt.h so the file matches the wabt version that produced it.
          usage: gen_mem.py wasm-rt.h out.c"""
          import re, sys

          hdr = open(sys.argv[1]).read()


          def proto(name):
              # skip doc-comment usage examples: the real declaration has a wasm_rt_memory_t* first parameter
              for m in re.finditer(r"([^\n;{}]*?)\b%s\s*\(([^)]*)\)\s*;" % name, hdr):
                  if "wasm_rt_memory_t" not in m.group(2).split(",")[0]:
                      continue
                  words = [t for t in m.group(1).replace("*", " * ").split() if t not in ("extern", "static", "inline", "*")]
                  ret = " ".join(w for w in words if re.match(r"\w+$", w)) or "void"
                  ret = ret.split()[-1] if ret.split()[-1] != "t" else ret
                  params = []
                  for q in m.group(2).split(","):
                      q = q.strip()
                      toks = re.findall(r"\w+|\*", q)
                      if len(toks) >= 2 and re.match(r"\w+$", toks[-1]) and toks[-2] != "const":
                          q = q[: q.rfind(toks[-1])].rstrip()
                      params.append(q)
                  return ret, params
              sys.exit("declaration of %s not found in wasm-rt.h" % name)


          rA, pA = proto("wasm_rt_allocate_memory")
          rG, pG = proto("wasm_rt_grow_memory")
          rF, pF = proto("wasm_rt_free_memory")

          o = []
          o += ['#include "wasm-rt.h"', '#include "host_api.h"',
                'unsigned wl4_rom_commit_size(void);', 'int wl4_mem_error;',
                '#ifndef WL4_DATA_COMMIT', '#define WL4_DATA_COMMIT 0x3000000u', '#endif',
                'static void wl4_mem_alloc(wasm_rt_memory_t *m, unsigned long long ip, unsigned long long mp, int is64) {',
                '  static const unsigned R[][2] = {{0x02000000u,0x40000u},{0x03000000u,0x8000u},{0x04000000u,0x1000u},',
                '    {0x05000000u,0x1000u},{0x06000000u,0x20000u},{0x07000000u,0x1000u},{0x0E000000u,0x10000u}};',
                '  unsigned bytes = (unsigned)(ip * 65536ull); unsigned i;',
                '  unsigned char *base = (unsigned char *)plat_mem_reserve(bytes);',
                '  if (!base) { wl4_mem_error = 1; m->data = 0; m->size = 0; wasm_rt_trap(WASM_RT_TRAP_OOB); return; }',
                '  for (i = 0; i < sizeof R / sizeof R[0]; i++)',
                '    if (plat_mem_commit(R[i][0], R[i][1])) { wl4_mem_error = 2; wasm_rt_trap(WASM_RT_TRAP_OOB); return; }',
                '  if (plat_mem_commit(0x08000000u, wl4_rom_commit_size())) { wl4_mem_error = 3; wasm_rt_trap(WASM_RT_TRAP_OOB); return; }',
                '  if (plat_mem_commit(0x0A000000u, WL4_DATA_COMMIT)) { wl4_mem_error = 4; wasm_rt_trap(WASM_RT_TRAP_OOB); return; }',
                '  m->data = base; m->size = bytes; m->pages = ip; m->max_pages = mp;']
          o.append('  m->is64 = is64;' if len(pA) >= 4 else '  (void)is64;')
          o.append('}')
          args = ", ".join("%s p%d" % (t, i) for i, t in enumerate(pA))
          call = "p0, (unsigned long long)p1, (unsigned long long)p2, %s" % ("p3" if len(pA) >= 4 else "0")
          o.append("%s wasm_rt_allocate_memory(%s) { wl4_mem_alloc(%s); }" % (rA, args, call))
          o.append("%s wasm_rt_grow_memory(%s) { return (%s)-1; }" % (rG, ", ".join("%s p%d" % (t, i) for i, t in enumerate(pG)), rG))
          o.append("%s wasm_rt_free_memory(%s) { plat_mem_release(); p0->data = 0; }" % (rF, ", ".join("%s p%d" % (t, i) for i, t in enumerate(pF))))
          open(sys.argv[2], "w").write("\n".join(o) + "\n")
          print("gen_mem: allocate=%s grow=%s" % (pA, pG))
          WL4_EOF
          mkdir -p symbian/tools
          cat > symbian/tools/patch_bios.py <<'WL4_EOF'
          #!/usr/bin/env python3
          """Replace the libm-based sin16() in hal/bios.c with a 256-entry integer table (no libm on Symbian).
          usage: patch_bios.py bios.c"""
          import re, sys, math

          p = sys.argv[1]
          s = open(p).read()
          tab = ",".join(str(int(round(math.sin(i * 2 * math.pi / 256) * 16384.0))) for i in range(256))
          new = ("static const int16_t wl4_sintab[256] = {%s};\n"
                 "static int32_t sin16(uint16_t a) { return wl4_sintab[a >> 8]; }" % tab)
          s2, n = re.subn(r"static int32_t sin16\(uint16_t a\) \{[^\n]*\}", new, s)
          if n != 1:
              print("patch_bios: sin16 not found, showing math users:")
              for i, l in enumerate(s.splitlines(), 1):
                  if "sin" in l or "cos" in l or "math" in l or "lround" in l:
                      print(i, l)
              sys.exit(1)
          s2 = s2.replace("#include <math.h>", "")
          open(p, "w").write(s2)
          print("patch_bios: ok")
          WL4_EOF

      - name: Cross-compile the C game core into wl4core.lib
        env:
          CORE_OPT: ${{ inputs.core_opt }}
          COMMIT_MB: ${{ inputs.commit_mb }}
        run: |
          set -eo pipefail
          source toolchain/Scripts/env.sh
          env | grep -i -E 'N8_|EPOC|SYMBIAN|GCCE' | sort || true
          CC="$(command -v arm-none-symbianelf-gcc || find "$SYMBIAN_VOL" -type f -name arm-none-symbianelf-gcc | head -1)"
          test -x "$CC" || { echo "::error::arm-none-symbianelf-gcc not found"; exit 1; }
          AR="${CC%gcc}ar"; NM="${CC%gcc}nm"
          echo "CC=$CC"; "$CC" --version | head -1
          EPOC="${EPOCROOT:-}"
          if [ -z "$EPOC" ] || [ ! -d "$EPOC/epoc32" ]; then
            EPOC="$(dirname "$(dirname "$(find "$SYMBIAN_VOL" -type d -path '*epoc32/release' | head -1)")")/"
          fi
          echo "EPOCROOT=$EPOC"; test -d "$EPOC/epoc32" || { echo "::error::epoc32 not found"; exit 1; }

          ROOT="$PWD"; W="$ROOT/w2c/wasm2c"; H="$ROOT/w2c/hal"; S="$ROOT/symbian"; B="$ROOT/build-core"
          mkdir -p "$B"

          # ---- prepare generated sources ----
          python3 - "$W" <<'PY'
          import re, sys, glob
          w = sys.argv[1]
          # no TLS on this target; drop runtime .c files that wl4.c pulls in by #include (they are built separately below)
          for f in glob.glob(w + "/*.c") + glob.glob(w + "/*.h") + glob.glob(w + "/*.inc"):
              s = open(f, errors="replace").read()
              s2 = re.sub(r"\b_Thread_local\b|\b__thread\b", "", s)
              if f.endswith("/wl4.c"):
                  s2 = re.sub(r'^\s*#\s*include\s+"wasm-rt-[\w\-]+\.c"\s*$', "", s2, flags=re.M)
              if s2 != s:
                  open(f, "w").write(s2)
          PY
          python3 "$S/tools/patch_bios.py" "$H/bios.c"
          python3 "$S/tools/gen_mem.py" "$W/wasm-rt.h" "$B/wl4_mem.c"

          # ---- commit size: max(input, data end + 8 MB) ----
          DATA_END=$(cat w2c/data_end.txt 2>/dev/null || echo 0)
          NEED_MB=$(( ( (DATA_END > 167772160 ? DATA_END - 167772160 : 0) / 1048576 ) + 10 ))
          MB="${COMMIT_MB:-48}"; [ "$NEED_MB" -gt "$MB" ] && MB="$NEED_MB"
          echo "commit at 0x0A000000: ${MB} MB (data segments need ~${NEED_MB} MB)"

          GCCINC="$("$CC" -print-file-name=include)"
          FLAGS="-march=armv5t -marm -mthumb-interwork -mfloat-abi=soft -ffreestanding -nostdinc -fno-strict-aliasing -fwrapv -fno-exceptions -w -D__SYMBIAN32__ -D__GCCE__ -D__EPOC32__ -D__MARM__ -D__EABI__"
          INC="-I $S/shim -isystem $GCCINC -isystem $GCCINC-fixed -I $W -I $S/core -I $H"
          RTDEF="-DWASM_RT_USE_MMAP=0 -DWASM_RT_TRAP_HANDLER=wl4_trap"
          O="${CORE_OPT:-1}"

          cc1() { out="$1"; shift; echo "CC $out"; "$CC" $FLAGS $INC "$@" -c -o "$B/$out.o" ; }
          PIDS=()
          bg() { "$@" & PIDS+=($!); }
          bg cc1 shim        -O2 -fno-tree-loop-distribute-patterns "$S/core/shim.c"
          bg cc1 audio_sym   -O2 "$S/core/audio_sym.c"
          bg cc1 host_sym    -O2 $RTDEF "$S/core/host_sym.c"
          for f in "$H"/*.c; do
            n="hal_$(basename "$f" .c)"
            if [ "$(basename "$f")" = "ppu.c" ]; then bg cc1 "$n" -O2 "$f"; else bg cc1 "$n" -O2 -Dppu_render_scanline=wl4_ppu_line "$f"; fi
          done
          bg cc1 wl4_segs -O1 "$W/wl4_segs.c"
          bg cc1 wl4_stubs   -O1 $RTDEF "$W/wl4_stubs.c"
          bg cc1 wl4_mem     -O2 $RTDEF -DWL4_DATA_COMMIT=$((MB*1024*1024))u "$B/wl4_mem.c"
          for f in "$W"/wasm-rt-*.c; do
            case "$f" in *-win.c|*os-unix.c|*os-win.c) continue;; esac
            bg cc1 "rt_$(basename "$f" .c)" -O2 $RTDEF \
              -Dwasm_rt_allocate_memory=wl4_orig_allocate_memory -Dwasm_rt_grow_memory=wl4_orig_grow_memory \
              -Dwasm_rt_free_memory=wl4_orig_free_memory "$f"
          done
          for p in "${PIDS[@]}"; do wait "$p" || { echo "::error::a compile job failed"; FAIL=1; }; done
          [ -z "$FAIL" ] || exit 1
          # the big one (several minutes)
          time cc1 wl4 -O"$O" $RTDEF "$W/wl4.c"

          rm -f "$B/wl4core.a"
          "$AR" rcs "$B/wl4core.a" "$B"/*.o
          ls -l "$B/wl4core.a"
          echo "--- undefined symbols still to resolve at link (expect only plat_* / wl4_* / compiler helpers):"
          "$NM" -u "$B/wl4core.a" 2>/dev/null | grep -v '^$' | grep ' U ' | sort -u | head -60 || true
          mkdir -p "$EPOC/epoc32/data/z/private/e1a5b0ce"; cp "$ROOT/w2c/wl4.dat" "$EPOC/epoc32/data/z/private/e1a5b0ce/wl4.dat"; ls -l "$EPOC/epoc32/data/z/private/e1a5b0ce/wl4.dat"
          for d in release/gcce/urel release/armv5/urel release/gcce/lib release/armv5/lib; do
            mkdir -p "$EPOC/epoc32/$d"; cp "$B/wl4core.a" "$EPOC/epoc32/$d/wl4core.lib"
          done

      - name: Build wl4.exe (abld)
        run: |
          set -eo pipefail
          source toolchain/Scripts/env.sh
          cd symbian/app/group
          bldmake bldfiles
          abld build -keepgoing gcce urel 2>&1 | tee "$GITHUB_WORKSPACE/abld.log"

      - name: Package signed SIS
        run: |
          set -eo pipefail
          source toolchain/Scripts/env.sh
          mkdir -p "$GITHUB_WORKSPACE/dist"
          "$N8_REPO/Scripts/package-sis.sh" symbian/app/sis/wl4.pkg "$GITHUB_WORKSPACE/dist"
          ls -l "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: wl4-symbian3
          path: dist/wl4.sisx

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wl4-build-logs
          path: |
            abld.log
            build-core/*.o
          if-no-files-found: ignore
          retention-days: 3
