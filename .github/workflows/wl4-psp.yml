          static void sprite_quads(const Sp *s, int oneD) {
              const int tw = s->w >> 3, th = s->h >> 3, step = s->bpp8 ? 2 : 1;
              for (int ty = 0; ty < th; ty++) for (int tx = 0; tx < tw; tx++) {
                  const int x0 = s->ox + tx * 8, y0 = s->oy + ty * 8;
                  if (x0 >= GBA_W || x0 + 8 <= 0 || y0 >= GBA_H || y0 + 8 <= 0) continue;
                  const int sr = s->vf ? th - 1 - ty : ty, sc = s->hf ? tw - 1 - tx : tx;
                  const uint32_t tn = (oneD ? (uint32_t)s->tile + (uint32_t)(sr * tw + sc) * step : (uint32_t)s->tile + (uint32_t)sr * 32 + (uint32_t)sc * step) & 0x3FF;
                  tile(x0, y0, s->bpp8 ? get_slot(2, (int)tn, 0) : get_slot(0, 2048 + (int)tn, s->pb4), s->hf, s->vf);
              }
          }

          static int build_pass(uint16_t disp, int layers, const Sp *sp, int nsp, int oneD) {
              P = &g_gpuPlan; P->nq = 0; overflow = 0; cacheFull = 0;
              for (int p = 3; p >= 0; p--) {
                  for (int n = 3; n >= 0; n--) if (((layers >> n) & 1) && ((disp >> (8 + n)) & 1) && (rd16(IO_BG0CNT + n * 2) & 3) == p) bg_layer(n);
                  for (int k = nsp - 1; k >= 0; k--) if (sp[k].p == p) sprite_quads(&sp[k], oneD);   /* lower OAM index ends up on top */
                  if (overflow || cacheFull) return 0;
              }
              return 1;
          }

          /* does window n cover the whole 240x160 screen (same clamping rules as ppu.c)? */
          static int win_full(unsigned regH, unsigned regV) {
              const unsigned h = rd16(regH), v = rd16(regV);
              int l = h >> 8, r = h & 0xFF, t = v >> 8, b = v & 0xFF;
              if (r > 240 || r < l) r = 240;
              if (b > 160 || b < t) b = 160;
              return l == 0 && r == 240 && t == 0 && b == 160;
          }

          int gpu_plan_build(void) {
              const uint16_t disp = rd16(IO_DISPCNT);
              if ((disp & 7) != 0 || (disp & 0x80)) { g_gpuStat[1]++; return 0; }
              /* The game keeps a window and BLDCNT set in every room.  Both are harmless when the window covers the whole screen and
               * no blend/fade can touch a visible layer, so only those frames are accepted. */
              int en = 0x3F;                                                       /* layer enables of the (only) window that matters */
              if (disp & 0xE000) {
                  const int w0 = (disp >> 13) & 1, w1 = (disp >> 14) & 1;
                  const uint16_t winin = rd16(IO_WININ);
                  if (w0 && win_full(IO_WIN0H, IO_WIN0V)) en = winin & 0x3F;
                  else if (!w0 && w1 && win_full(IO_WIN1H, IO_WIN1V)) en = (winin >> 8) & 0x3F;
