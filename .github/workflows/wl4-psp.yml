          /* ---- plan ---- */
          static GpuPlan *P;
          static int overflow;
          /* one 8x8 tile at screen (x0,y0) from cache slot s */
          static void tile(int x0, int y0, int s, int hf, int vf) {
              if (s < 0) return;
              int cx0 = x0 < 0 ? 0 : x0, cy0 = y0 < 0 ? 0 : y0, cx1 = x0 + 8 > GBA_W ? GBA_W : x0 + 8, cy1 = y0 + 8 > GBA_H ? GBA_H : y0 + 8;
              if (cx0 >= cx1 || cy0 >= cy1) return;
