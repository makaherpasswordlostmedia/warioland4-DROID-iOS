name: Build Wario Land 4 PSP port (EBOOT.PBP) v5

# Repo layout expected: the pret-style decomp at the root (src/, include/, asm/, asset_database.yaml, ...)
# with port/ and android/ from this port copied on top.
#
# ROM: the build needs YOUR OWN US ROM (md5 5fe47355a33e3fabec2a1607af88a404).  Either
#   - commit baserom_us.gba to a PRIVATE repo, or
#   - add the repo secret WL4_ROM_URL (a direct download link only you can reach).
# `make extract` turns ROM data into C includes that get compiled into the EBOOT, so the artifact is
# ROM-derived: this workflow refuses to run in a public repo unless you explicitly override that.

on:
  workflow_dispatch:
    inputs:
      psp_opt:
        description: "gcc -O level for the PSP build of the giant wl4.c (-O1 compiles faster / uses less RAM)"
        default: "-O2"
      allow_public_repo:
        description: "I understand the EBOOT embeds ROM-derived data and the artifact is downloadable from a public repo"
        type: boolean
        default: false
      run_host_smoke_test:
        description: "Run the game natively on the runner through the PSP memory map before building the EBOOT"
        type: boolean
        default: true
      wabt_version:
        description: "Override wabt version (leave blank to use the default below)"
        default: ""
      opt_level:
        description: "Clang -O level for the wasm32 compile (0/1/2). Lower values use less RAM but produce larger .wasm."
        default: "2"

env:
  WASI_SDK_VERSION: "24"
  WABT_VERSION: "1.0.36"
  ROM_MD5_US: "5fe47355a33e3fabec2a1607af88a404"
  NDK_VERSION: "26.3.11579264"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Refuse public repos unless overridden
        if: ${{ github.event.repository.private == false && inputs.allow_public_repo != true }}
        run: |
          echo "::error::This repo is public. The EBOOT embeds data extracted from your ROM; rerun with allow_public_repo=true only if you accept that."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSP port files (embedded in this workflow)
        run: |
          echo "WORKFLOW VERSION v5 (threads + sigjmp fixes)"
          mkdir -p port/psp port/hal port/tools
          cat > port/hal/hal.h <<'WL4EOF'
          /* GBA hardware abstraction layer for the Wario Land 4 native port.
           *
           * The decomp is compiled to wasm32 (so pointers/struct layouts match the GBA),
           * converted to C with wasm2c, and run against one linear memory.  The GBA
           * address space (EWRAM/IWRAM/IO/PAL/VRAM/OAM/ROM) lives at its *real* addresses
           * inside that memory, so the game's hardware pokes (*(vu16*)0x4000000 ...)
           * are ordinary loads/stores.  This HAL reads those regions to produce video
           * and audio, and implements the BIOS calls. */
          #ifndef WL4_HAL_H
          #define WL4_HAL_H
          #include <stdint.h>
          #include <stddef.h>

          #define GBA_W 240
          #define GBA_H 160
          #define GBA_ROM_BASE 0x08000000u
          #define GBA_SRAM_BASE 0x0E000000u
          #define GBA_SRAM_SIZE 0x10000u
          #define GBA_MEM_MIN  0x0E010000u   /* linear memory must cover SRAM */

          /* ---- core ---- */
          void hal_init(uint8_t *mem, size_t memSize);          /* mem = wasm linear memory */
          int  hal_load_rom(const uint8_t *rom, size_t size, uint32_t rom_image_addr);   /* ROM -> 0x08000000 and rom_image */
          void hal_set_keys(uint16_t pressed);                  /* active-high: bit0=A ... bit9=L (KEYINPUT order) */
          void hal_run_frame(void);                             /* finish the current frame */
          void hal_step_line(void);                             /* advance one scanline */
          uint16_t hal_poll_vcount(void);                       /* game busy-waits on REG_VCOUNT */                             /* 228 scanlines, fires IRQ callbacks */
          uint8_t *hal_sram(void);                              /* 64KB battery save at 0x0E000000 */
          const uint32_t *hal_framebuffer(void);                /* 240x160 XRGB8888 */

          /* callbacks into the game (wired to the wasm2c exports by the glue) */
          typedef struct {
              void (*vblank)(void);
              void (*hblank)(void);
              void (*vcount)(void);
              void (*frame_done)(void);                         /* host: present + pace + audio */
          } HalCallbacks;
          void hal_set_callbacks(const HalCallbacks *cb);

          /* ---- memory helpers (little endian, bounds are the caller's job) ---- */
          extern uint8_t *g_mem;
          #ifdef WL4_MEMMAP
          /* PSP / low-memory build: no flat 226 MB linear memory.  The GBA address space is a table of 16 MB "regions"
           * (see memmap.c); every access is base[region] + (addr & mask).  The same translation is compiled into the
           * wasm2c output (tools/patch_w2c_psp.py), so the game and the HAL see one consistent memory. */
          #include "wl4_psp_mem.h"
          extern uint8_t *g_io, *g_pal, *g_vram, *g_oam;          /* direct pointers for the PPU */
          static inline uint8_t  rd8 (uint32_t a){ return *wl4_ptr(a); }
          static inline uint16_t rd16(uint32_t a){ return *(const uint16_t *)wl4_ptr(a & ~1u); }
          static inline uint32_t rd32(uint32_t a){ return *(const uint32_t *)wl4_ptr(a & ~3u); }
          static inline void wr8 (uint32_t a, uint8_t v){ *wl4_ptr(a) = v; }
          static inline void wr16(uint32_t a, uint16_t v){ *(uint16_t *)wl4_ptr(a & ~1u) = v; }
          static inline void wr32(uint32_t a, uint32_t v){ *(uint32_t *)wl4_ptr(a & ~3u) = v; }
          int  wl4_memmap_init(uint32_t data_size, uint32_t rom_image_off);   /* 0 = ok; see memmap.c */
          extern volatile int g_hal_skip_render;                  /* host: skip PPU work for the next frame (frame skip) */
          #else
          static inline uint8_t  rd8 (uint32_t a){ return g_mem[a]; }
          static inline uint16_t rd16(uint32_t a){ return (uint16_t)(g_mem[a] | g_mem[a+1] << 8); }
          static inline uint32_t rd32(uint32_t a){ return rd16(a) | (uint32_t)rd16(a+2) << 16; }
          static inline void wr8 (uint32_t a, uint8_t v){ g_mem[a]=v; }
          static inline void wr16(uint32_t a, uint16_t v){ g_mem[a]=(uint8_t)v; g_mem[a+1]=(uint8_t)(v>>8); }
          static inline void wr32(uint32_t a, uint32_t v){ wr16(a,(uint16_t)v); wr16(a+2,(uint16_t)(v>>16)); }
          #endif

          /* ---- IO register addresses ---- */
          enum {
              IO_DISPCNT=0x04000000, IO_DISPSTAT=0x04000004, IO_VCOUNT=0x04000006,
              IO_BG0CNT=0x04000008, IO_BG0HOFS=0x04000010, IO_BG2PA=0x04000020, IO_BG2X=0x04000028,
              IO_BG3PA=0x04000030, IO_BG3X=0x04000038,
              IO_WIN0H=0x04000040, IO_WIN1H=0x04000042, IO_WIN0V=0x04000044, IO_WIN1V=0x04000046,
              IO_WININ=0x04000048, IO_WINOUT=0x0400004A, IO_MOSAIC=0x0400004C,
              IO_BLDCNT=0x04000050, IO_BLDALPHA=0x04000052, IO_BLDY=0x04000054,
              IO_KEYINPUT=0x04000130, IO_IE=0x04000200, IO_IF=0x04000202, IO_IME=0x04000208,
              PAL_BASE=0x05000000, VRAM_BASE=0x06000000, OAM_BASE=0x07000000
          };

          void hal_io_write(unsigned addr, unsigned size);      /* store hook for the IO page */

          /* ---- PPU ---- */
          void ppu_render_scanline(int y, uint32_t *dst240);

          /* ---- DMA (called through the macro overrides in port/include/gba/macro.h) ---- */
          void hal_dma_set(int ch, uint32_t src, uint32_t dst, uint32_t cnt_ctrl);   /* cnt | ctl<<16 */

          /* ---- BIOS HLE (also exported to the wasm module as imports) ---- */
          void     bios_CpuSet(uint32_t src, uint32_t dst, uint32_t ctl);
          void     bios_CpuFastSet(uint32_t src, uint32_t dst, uint32_t ctl);
          void     bios_LZ77UnComp(uint32_t src, uint32_t dst);
          void     bios_RLUnComp(uint32_t src, uint32_t dst);
          int32_t  bios_Div(int32_t num, int32_t den, int32_t *mod, uint32_t *absResult);
          uint16_t bios_Sqrt(uint32_t v);
          uint16_t bios_ArcTan(int16_t t);
          uint16_t bios_ArcTan2(int16_t x, int16_t y);
          void     bios_ObjAffineSet(uint32_t src, uint32_t dst, int32_t count, int32_t stride);
          void     bios_BgAffineSet(uint32_t src, uint32_t dst, int32_t count);
          #endif
          WL4EOF
          cat > port/hal/hal.c <<'WL4EOF'
          #include "hal.h"
          #include <string.h>

          uint8_t *g_mem;
          static size_t g_memSize;
          static uint16_t g_keys;
          static uint32_t g_fb[GBA_W * GBA_H];
          static HalCallbacks g_cb;
          volatile int g_hal_stage, g_hal_line;      /* watchdog breadcrumbs: where the host thread is inside hal_step_line */
          volatile unsigned g_hal_irq_calls[3];     /* vblank / hblank / vcount callbacks entered */
          void ppu_frame_start(void);
          void hal_step_line(void);
          static void dma_timed(int timing);

          #ifdef WL4_MEMMAP
          volatile int g_hal_skip_render;
          void hal_init(uint8_t *mem, size_t size) { (void)mem; (void)size; g_keys = 0; memset(g_fb, 0, sizeof g_fb); memset(g_rg[0xE].base, 0xFF, GBA_SRAM_SIZE); wr16(IO_KEYINPUT, 0x03FF); }
          int hal_load_rom(const uint8_t *rom, size_t size, uint32_t rom_image_addr) {
              (void)rom_image_addr; if (size > 0x800000) return -1; memcpy(g_rg[8].base, rom, size); return 0;
          }
          #else
          void hal_init(uint8_t *mem, size_t size) { g_mem = mem; g_memSize = size; g_keys = 0; memset(g_fb, 0, sizeof g_fb); if (size >= GBA_MEM_MIN) memset(mem + GBA_SRAM_BASE, 0xFF, GBA_SRAM_SIZE); wr16(IO_KEYINPUT, 0x03FF); }
          int hal_load_rom(const uint8_t *rom, size_t size, uint32_t rom_image_addr) {
              if (size > 0x02000000 || GBA_ROM_BASE + size > g_memSize || rom_image_addr + size > g_memSize) return -1;
              memcpy(g_mem + GBA_ROM_BASE, rom, size);
              memcpy(g_mem + rom_image_addr, rom, size);
              return 0;
          }
          #endif
          void hal_set_keys(uint16_t pressed) { g_keys = pressed & 0x03FF; }
          void hal_set_callbacks(const HalCallbacks *cb) { g_cb = *cb; }
          const uint32_t *hal_framebuffer(void) { return g_fb; }

          static void raise_irq(uint16_t flag, void (*cb)(void)) {
              uint16_t ie = rd16(IO_IE);
              if (!(ie & flag) || !(rd16(IO_IME) & 1)) return;
              wr16(IO_IF, rd16(IO_IF) | flag);                      /* game's handler clears it in crt0's irq_handler path */
              g_hal_irq_calls[flag == 1 ? 0 : flag == 2 ? 1 : 2]++; g_hal_stage = 10 + (int)flag;
              if (cb) cb();
              g_hal_stage = 20 + (int)flag;
              wr16(IO_IF, rd16(IO_IF) & ~flag);
          }

          /* Time advances one scanline at a time: either because the game halts (hal_run_frame
           * finishes the frame) or because it busy-waits on VCOUNT (hal_poll_vcount). */
          static int g_line;
          void hal_step_line(void) {
              int line = g_line;
              g_hal_line = line; g_hal_stage = 1;
              if (line == 0) { ppu_frame_start(); wr16(IO_KEYINPUT, (uint16_t)(~g_keys & 0x03FF)); }
              uint16_t st = rd16(IO_DISPSTAT);
              wr16(IO_VCOUNT, (uint16_t)line);
              int vcmatch = ((st >> 8) == line);
              wr16(IO_DISPSTAT, (uint16_t)((st & ~7) | (line >= 160 && line < 227 ? 1 : 0) | (vcmatch ? 4 : 0)));
              if (vcmatch && (st & 0x20)) raise_irq(0x0004, g_cb.vcount);
              if (line < GBA_H) {
                  g_hal_stage = 2;
          #ifdef WL4_MEMMAP
                  if (!g_hal_skip_render)
          #endif
                  ppu_render_scanline(line, g_fb + line * GBA_W);
                  g_hal_stage = 3; dma_timed(2);
                  wr16(IO_DISPSTAT, rd16(IO_DISPSTAT) | 2);
                  if (st & 0x10) raise_irq(0x0002, g_cb.hblank);
                  wr16(IO_DISPSTAT, rd16(IO_DISPSTAT) & ~2);
              } else if (line == GBA_H) { g_hal_stage = 4; dma_timed(1); g_hal_stage = 5; if (st & 0x08) raise_irq(0x0001, g_cb.vblank); }
              g_hal_stage = 6;
              g_line = line + 1;
              if (g_line == 228) { g_line = 0; g_hal_stage = 7; if (g_cb.frame_done) g_cb.frame_done(); }
              g_hal_stage = 8;
          }
          void hal_run_frame(void) { do hal_step_line(); while (g_line != 0); }
          uint16_t hal_poll_vcount(void) { hal_step_line(); return (uint16_t)g_line; }

          /* ---- DMA ------------------------------------------------------------------
           * The decomp funnels DMA through DmaSet(); port/include/gba/macro.h turns that
           * into a call to hal_dma_set().  Immediate transfers run now; VBlank/HBlank
           * timed ones are latched and replayed from hal_run_frame(). */
          typedef struct { uint32_t src, dst, cnt; uint16_t ctl; int active; } DmaCh;
          static DmaCh dma[4];

          static void dma_xfer(DmaCh *c, uint32_t units) {
              int w32 = (c->ctl >> 10) & 1, dc = (c->ctl >> 5) & 3, sc = (c->ctl >> 7) & 3, step = w32 ? 4 : 2;
              for (uint32_t i = 0; i < units; i++) {
                  if (w32) wr32(c->dst, rd32(c->src)); else wr16(c->dst, rd16(c->src));
                  c->src += sc == 0 ? step : sc == 1 ? -step : 0;
                  c->dst += (dc == 0 || dc == 3) ? step : dc == 1 ? -step : 0;
              }
          }
          static uint32_t dma_units(int ch, uint32_t cnt) { cnt &= (ch == 3) ? 0xFFFF : 0x3FFF; return cnt ? cnt : (ch == 3 ? 0x10000 : 0x4000); }

          void hal_dma_set(int ch, uint32_t src, uint32_t dst, uint32_t cntctl) {
              DmaCh *c = &dma[ch]; c->src = src; c->dst = dst; c->cnt = cntctl & 0xFFFF; c->ctl = (uint16_t)(cntctl >> 16);
              if (!(c->ctl & 0x8000)) { c->active = 0; return; }
              int timing = (c->ctl >> 12) & 3;
              if (timing == 0) {
                  dma_xfer(c, dma_units(ch, c->cnt)); c->ctl &= ~0x8000; c->active = 0;
                  wr16(0x040000B0 + 12 * ch + 10, c->ctl);          /* busy-wait loops see the enable bit drop */
              }
              else if (timing == 3) c->active = 0;                 /* sound FIFO DMA: handled by the audio core */
              else c->active = timing;                             /* 1 = VBlank, 2 = HBlank */
          }
          static void dma_timed(int timing) {
              for (int i = 0; i < 4; i++) {
                  DmaCh *c = &dma[i]; if (c->active != timing) continue;
                  uint32_t savedDst = c->dst;
                  dma_xfer(c, timing == 2 ? (c->cnt ? c->cnt : 1) : dma_units(i, c->cnt));
                  if (timing == 2 && ((c->ctl >> 5) & 3) == 3) c->dst = savedDst;
                  if (!((c->ctl >> 9) & 1)) { c->active = 0; c->ctl &= ~0x8000; }
                  else if (((c->ctl >> 5) & 3) == 3 && timing == 1) c->dst = savedDst;
              }
          }

          #ifdef WL4_MEMMAP
          uint8_t *hal_sram(void) { return g_rg[0xE].base; }
          #else
          uint8_t *hal_sram(void) { return g_mem + GBA_SRAM_BASE; }
          #endif

          /* Called by the wasm2c store helper for every store into 0x04000000..0x040003FF. */
          void hal_io_write(unsigned addr, unsigned size) {
              if (addr >= 0x040000B0 && addr < 0x040000E0) {
                  unsigned off = (addr - 0x040000B0) % 12, ch = (addr - 0x040000B0) / 12, base = 0x040000B0 + ch * 12;
                  if (off + size > 10) hal_dma_set((int)ch, rd32(base), rd32(base + 4), rd32(base + 8));
              }
          }
          WL4EOF
          cat > port/hal/ppu.c <<'WL4EOF'
          /* Scanline software PPU: modes 0-5, text/affine BG, regular+affine OBJ,
           * WIN0/WIN1/OBJWIN, alpha + brightness blending.  (Mosaic: TODO.) */
          #include "hal.h"
          #include <string.h>

          #define TRANSP 0xFFFFFFFFu
          static uint32_t affRefX[2], affRefY[2];          /* BG2/BG3 internal reference points */

          void ppu_frame_start(void) {
              affRefX[0] = rd32(IO_BG2X) & 0x0FFFFFFF;  affRefY[0] = rd32(IO_BG2X + 4) & 0x0FFFFFFF;
              affRefX[1] = rd32(IO_BG3X) & 0x0FFFFFFF;  affRefY[1] = rd32(IO_BG3X + 4) & 0x0FFFFFFF;
              for (int i = 0; i < 2; i++) { if (affRefX[i] & 0x08000000) affRefX[i] |= 0xF0000000; if (affRefY[i] & 0x08000000) affRefY[i] |= 0xF0000000; }
          }
          #ifdef WL4_MEMMAP
          static inline uint32_t pal(uint32_t idx) { return ((const uint16_t *)g_pal)[idx] & 0x7FFF; }
          #define OAM16(a)  (*(const uint16_t *)(g_oam + ((a) - OAM_BASE)))
          #define VRAM8(a)  (g_vram[(a) - VRAM_BASE])
          #else
          static uint32_t pal(uint32_t idx) { return rd16(PAL_BASE + idx * 2) & 0x7FFF; }
          #define OAM16(a)  rd16(a)
          #define VRAM8(a)  rd8(a)
          #endif

          #ifdef WL4_MEMMAP
          /* tile-at-a-time version of bg_text (same output) */
          static void bg_text(int n, int y, uint32_t *out) {
              const uint16_t cnt = rd16(IO_BG0CNT + n * 2);
              const uint32_t cbase = ((cnt >> 2) & 3) * 0x4000, sbase = ((cnt >> 8) & 0x1F) * 0x800;
              const int bpp8 = (cnt >> 7) & 1, size = cnt >> 14;
              const int hofs = rd16(IO_BG0HOFS + n * 4) & 0x1FF, vofs = rd16(IO_BG0HOFS + n * 4 + 2) & 0x1FF;
              const int wmask = (size & 1) ? 511 : 255, hmask = (size & 2) ? 511 : 255;
              const int py = (y + vofs) & hmask, ty = py >> 3, iyb = py & 7;
              const uint16_t *palp = (const uint16_t *)g_pal;
              int x = 0, px = hofs & wmask;
              while (x < GBA_W) {
                  const int tx = px >> 3, ix0 = px & 7;
                  const int sb = (size == 1) ? (tx >> 5) : (size == 2) ? (ty >> 5) : (size == 3) ? ((tx >> 5) + ((ty >> 5) << 1)) : 0;
                  const uint16_t e = *(const uint16_t *)(g_vram + sbase + sb * 0x800 + (((ty & 31) << 5) + (tx & 31)) * 2);
                  const int iy = (e & 0x800) ? 7 - iyb : iyb, hflip = e & 0x400;
                  const uint32_t tile = e & 0x3FF;
                  int run = 8 - ix0; if (x + run > GBA_W) run = GBA_W - x;
                  if (bpp8) {
                      const uint32_t a = cbase + tile * 64 + iy * 8;
                      if (a >= 0x10000) { for (int k = 0; k < run; k++) out[x + k] = TRANSP; }
                      else for (int k = 0; k < run; k++) { int ix = ix0 + k; if (hflip) ix = 7 - ix; uint32_t c = g_vram[a + ix]; out[x + k] = c ? (palp[c] & 0x7FFF) : TRANSP; }
                  } else {
                      const uint32_t a = cbase + tile * 32 + iy * 4;
                      if (a >= 0x10000) { for (int k = 0; k < run; k++) out[x + k] = TRANSP; }
                      else {
                          const uint32_t w = *(const uint32_t *)(g_vram + a), pb = (uint32_t)(e >> 12) * 16;
                          for (int k = 0; k < run; k++) { int ix = ix0 + k; if (hflip) ix = 7 - ix; uint32_t c = (w >> (ix * 4)) & 15; out[x + k] = c ? (palp[pb + c] & 0x7FFF) : TRANSP; }
                      }
                  }
                  x += run; px = (px + run) & wmask;
              }
          }
          #else
          static void bg_text(int n, int y, uint32_t *out) {
              uint16_t cnt = rd16(IO_BG0CNT + n * 2);
              uint32_t cbase = VRAM_BASE + ((cnt >> 2) & 3) * 0x4000, sbase = VRAM_BASE + ((cnt >> 8) & 0x1F) * 0x800;
              int bpp8 = (cnt >> 7) & 1, size = cnt >> 14;
              int hofs = rd16(IO_BG0HOFS + n * 4) & 0x1FF, vofs = rd16(IO_BG0HOFS + n * 4 + 2) & 0x1FF;
              int wmask = (size & 1) ? 511 : 255, hmask = (size & 2) ? 511 : 255;
              int py = (y + vofs) & hmask;
              for (int x = 0; x < GBA_W; x++) {
                  int px = (x + hofs) & wmask, tx = px >> 3, ty = py >> 3;
                  int sb = (size == 1) ? (tx >> 5) : (size == 2) ? (ty >> 5) : (size == 3) ? ((tx >> 5) + ((ty >> 5) << 1)) : 0;
                  uint16_t e = rd16(sbase + sb * 0x800 + (((ty & 31) << 5) + (tx & 31)) * 2);
                  int ix = px & 7, iy = py & 7; if (e & 0x400) ix = 7 - ix; if (e & 0x800) iy = 7 - iy;
                  uint32_t tile = e & 0x3FF, c;
                  if (bpp8) { uint32_t a = cbase + tile * 64 + iy * 8 + ix; if (a >= VRAM_BASE + 0x10000) { out[x] = TRANSP; continue; } c = rd8(a); out[x] = c ? pal(c) : TRANSP; }
                  else { uint32_t a = cbase + tile * 32 + iy * 4 + (ix >> 1); if (a >= VRAM_BASE + 0x10000) { out[x] = TRANSP; continue; } c = (rd8(a) >> ((ix & 1) * 4)) & 15; out[x] = c ? pal((e >> 12) * 16 + c) : TRANSP; }
              }
          }
          #endif
          static void bg_affine(int n, int mode_slot, uint32_t *out) {      /* n = 2 or 3; mode_slot 0/1 */
              uint16_t cnt = rd16(IO_BG0CNT + n * 2);
              uint32_t cbase = VRAM_BASE + ((cnt >> 2) & 3) * 0x4000, sbase = VRAM_BASE + ((cnt >> 8) & 0x1F) * 0x800;
              int dim = 128 << (cnt >> 14), wrap = (cnt >> 13) & 1;
              uint32_t reg = n == 2 ? IO_BG2PA : IO_BG3PA;
              int32_t pa = (int16_t)rd16(reg), pb = (int16_t)rd16(reg + 2), pc = (int16_t)rd16(reg + 4), pd = (int16_t)rd16(reg + 6);
              int32_t X = (int32_t)affRefX[mode_slot], Y = (int32_t)affRefY[mode_slot];
              for (int x = 0; x < GBA_W; x++, X += pa, Y += pc) {
                  int32_t u = X >> 8, v = Y >> 8;
                  if (wrap) { u &= dim - 1; v &= dim - 1; } else if (u < 0 || v < 0 || u >= dim || v >= dim) { out[x] = TRANSP; continue; }
                  uint8_t t = rd8(sbase + (v >> 3) * (dim >> 3) + (u >> 3));
                  uint8_t c = rd8(cbase + t * 64 + (v & 7) * 8 + (u & 7));
                  out[x] = c ? pal(c) : TRANSP;
              }
              affRefX[mode_slot] += pb; affRefY[mode_slot] += pd;
          }
          static void bg_bitmap(int mode, int disp, int y, uint32_t *out) {
              uint32_t page = (disp & 0x10) ? 0xA000 : 0;
              int32_t pa = (int16_t)rd16(IO_BG2PA), pb = (int16_t)rd16(IO_BG2PA + 2), pc = (int16_t)rd16(IO_BG2PA + 4), pd = (int16_t)rd16(IO_BG2PA + 6);
              int32_t X = (int32_t)affRefX[0], Y = (int32_t)affRefY[0];
              int w = mode == 5 ? 160 : 240, h = mode == 5 ? 128 : 160;
              for (int x = 0; x < GBA_W; x++, X += pa, Y += pc) {
                  int32_t u = X >> 8, v = Y >> 8;
                  if (u < 0 || v < 0 || u >= w || v >= h) { out[x] = TRANSP; continue; }
                  if (mode == 4) { uint8_t c = rd8(VRAM_BASE + page + v * 240 + u); out[x] = c ? pal(c) : TRANSP; }
                  else out[x] = rd16(VRAM_BASE + (mode == 5 ? page : 0) + (v * w + u) * 2) & 0x7FFF;
              }
              affRefX[0] += pb; affRefY[0] += pd; (void)y;
          }

          static const uint8_t OBJW[3][4] = {{8,16,32,64},{16,32,32,64},{8,8,16,32}};
          static const uint8_t OBJH[3][4] = {{8,16,32,64},{8,8,16,32},{16,32,32,64}};

          /* obj line: color | prio<<16 | flags (bit24 semi-transparent) ; objwin mask separately */
          static int g_anySemi;
          static void obj_line(int y, int disp, uint32_t *col, uint8_t *prio, uint8_t *semi, uint8_t *objwin) {
              for (int x = 0; x < GBA_W; x++) { col[x] = TRANSP; prio[x] = 4; semi[x] = 0; objwin[x] = 0; }
              int oneD = (disp >> 6) & 1; uint32_t tbase = VRAM_BASE + 0x10000; int bitmapMode = (disp & 7) >= 3;
              for (int i = 0; i < 128; i++) {
                  uint32_t o = OAM_BASE + i * 8; uint16_t a0 = OAM16(o), a1 = OAM16(o + 2), a2 = OAM16(o + 4);
                  int affine = (a0 >> 8) & 1, dbl = affine && ((a0 >> 9) & 1);
                  if (!affine && ((a0 >> 9) & 1)) continue;
                  int mode = (a0 >> 10) & 3; if (mode == 3) continue;
                  int shape = a0 >> 14, sz = a1 >> 14; if (shape == 3) continue;
                  int w = OBJW[shape][sz], h = OBJH[shape][sz], bw = dbl ? w * 2 : w, bh = dbl ? h * 2 : h;
                  int oy = a0 & 0xFF, ox = a1 & 0x1FF; if (ox >= 256) ox -= 512;
                  int ly = (y - oy) & 0xFF; if (ly >= bh) continue;
                  int bpp8 = (a0 >> 13) & 1, tile = a2 & 0x3FF, p = (a2 >> 10) & 3, pb4 = a2 >> 12;
                  if (bitmapMode && tile < 512) continue;
                  int32_t pa = 0x100, pbb = 0, pc = 0, pd = 0x100;
                  if (affine) { uint32_t g = OAM_BASE + ((a1 >> 9) & 31) * 32; pa = (int16_t)OAM16(g + 6); pbb = (int16_t)OAM16(g + 14); pc = (int16_t)OAM16(g + 22); pd = (int16_t)OAM16(g + 30); }
                  for (int sx = 0; sx < bw; sx++) {
                      int x = ox + sx; if (x < 0 || x >= GBA_W) continue;
                      int tx, ty;
                      if (affine) { int dx = sx - bw / 2, dy = ly - bh / 2; tx = ((pa * dx + pbb * dy) >> 8) + w / 2; ty = ((pc * dx + pd * dy) >> 8) + h / 2; if (tx < 0 || ty < 0 || tx >= w || ty >= h) continue; }
                      else { tx = (a1 & 0x1000) ? w - 1 - sx : sx; ty = (a1 & 0x2000) ? h - 1 - ly : ly; }
                      int tw = w >> 3, step = bpp8 ? 2 : 1;
                      uint32_t tn = oneD ? tile + ((ty >> 3) * tw + (tx >> 3)) * step : tile + (ty >> 3) * 32 + (tx >> 3) * step;
                      uint32_t addr = tbase + (tn & 0x3FF) * 32, c;
                      if (bpp8) c = VRAM8(addr + (ty & 7) * 8 + (tx & 7));
                      else c = (VRAM8(addr + (ty & 7) * 4 + ((tx & 7) >> 1)) >> (((tx & 7) & 1) * 4)) & 15;
                      if (!c) continue;
                      if (mode == 2) { objwin[x] = 1; continue; }
                      if (p >= prio[x]) continue;               /* earlier OAM entry wins ties */
                      col[x] = pal(256 + (bpp8 ? c : pb4 * 16 + c)); prio[x] = (uint8_t)p; semi[x] = (mode == 1); if (mode == 1) g_anySemi = 1;
                  }
              }
          }

          static inline uint32_t blend(uint32_t a, uint32_t b, int eva, int evb) {
              int r = ((a & 31) * eva + (b & 31) * evb) >> 4, g = (((a >> 5) & 31) * eva + ((b >> 5) & 31) * evb) >> 4, bl = (((a >> 10) & 31) * eva + ((b >> 10) & 31) * evb) >> 4;
              if (r > 31) r = 31; if (g > 31) g = 31; if (bl > 31) bl = 31; return r | g << 5 | bl << 10;
          }
          static inline uint32_t bright(uint32_t c, int evy, int up) {
              int r = c & 31, g = (c >> 5) & 31, b = (c >> 10) & 31;
              if (up) { r += ((31 - r) * evy) >> 4; g += ((31 - g) * evy) >> 4; b += ((31 - b) * evy) >> 4; }
              else    { r -= (r * evy) >> 4; g -= (g * evy) >> 4; b -= (b * evy) >> 4; }
              return r | g << 5 | b << 10;
          }
          static inline uint32_t to_xrgb(uint32_t c) {
              uint32_t r = c & 31, g = (c >> 5) & 31, b = (c >> 10) & 31;
              return 0xFF000000u | ((r << 3 | r >> 2) << 16) | ((g << 3 | g >> 2) << 8) | (b << 3 | b >> 2);
          }

          void ppu_render_scanline(int y, uint32_t *dst) {
              uint16_t disp = rd16(IO_DISPCNT); int mode = disp & 7;
              if (disp & 0x80) { for (int x = 0; x < GBA_W; x++) dst[x] = 0xFFFFFFFFu; return; }
              static uint32_t bg[4][GBA_W], oc[GBA_W]; static uint8_t op[GBA_W], os[GBA_W], ow[GBA_W];
              int bgOn[4] = {0,0,0,0};
              for (int n = 0; n < 4; n++) bgOn[n] = (disp >> (8 + n)) & 1;
              switch (mode) {
              case 0: for (int n = 0; n < 4; n++) if (bgOn[n]) bg_text(n, y, bg[n]); break;
              case 1: if (bgOn[0]) bg_text(0, y, bg[0]); if (bgOn[1]) bg_text(1, y, bg[1]); if (bgOn[2]) bg_affine(2, 0, bg[2]); bgOn[3] = 0; break;
              case 2: if (bgOn[2]) bg_affine(2, 0, bg[2]); if (bgOn[3]) bg_affine(3, 1, bg[3]); bgOn[0] = bgOn[1] = 0; break;
              case 3: case 4: case 5: bgOn[0] = bgOn[1] = bgOn[3] = 0; if (bgOn[2]) bg_bitmap(mode, disp, y, bg[2]); break;
              default: bgOn[0]=bgOn[1]=bgOn[2]=bgOn[3]=0; }
              int objOn = (disp >> 12) & 1; g_anySemi = 0;
              if (objOn) obj_line(y, disp, oc, op, os, ow); else for (int x = 0; x < GBA_W; x++) { oc[x] = TRANSP; op[x] = 4; os[x] = 0; ow[x] = 0; }

              int w0 = (disp >> 13) & 1, w1 = (disp >> 14) & 1, wo = (disp >> 15) & 1, anyWin = w0 | w1 | wo;
              uint16_t winin = rd16(IO_WININ), winout = rd16(IO_WINOUT);
              int x0a = rd16(IO_WIN0H) >> 8, x0b = rd16(IO_WIN0H) & 0xFF, y0a = rd16(IO_WIN0V) >> 8, y0b = rd16(IO_WIN0V) & 0xFF;
              int x1a = rd16(IO_WIN1H) >> 8, x1b = rd16(IO_WIN1H) & 0xFF, y1a = rd16(IO_WIN1V) >> 8, y1b = rd16(IO_WIN1V) & 0xFF;
              if (x0b > 240 || x0b < x0a) x0b = 240; if (x1b > 240 || x1b < x1a) x1b = 240;
              int in0 = w0 && y >= y0a && y < (y0b > 160 || y0b < y0a ? 160 : y0b), in1 = w1 && y >= y1a && y < (y1b > 160 || y1b < y1a ? 160 : y1b);

              uint16_t bld = rd16(IO_BLDCNT), alpha = rd16(IO_BLDALPHA); int bmode = (bld >> 6) & 3;
              int eva = alpha & 0x1F, evb = (alpha >> 8) & 0x1F, evy = rd16(IO_BLDY) & 0x1F; if (eva > 16) eva = 16; if (evb > 16) evb = 16; if (evy > 16) evy = 16;
              uint16_t bgcnt[4]; for (int n = 0; n < 4; n++) bgcnt[n] = rd16(IO_BG0CNT + n * 2);
              uint32_t backdrop = pal(0);

          #ifdef WL4_MEMMAP
              if (!anyWin && bmode == 0 && !g_anySemi) {              /* common case: plain priority composite */
                  int blk[4], blp[4], nbl = 0;
                  for (int p = 0; p < 4; p++) for (int n = 0; n < 4; n++) if (bgOn[n] && (bgcnt[n] & 3) == p) { blk[nbl] = n; blp[nbl] = p; nbl++; }
                  for (int x = 0; x < GBA_W; x++) {
                      uint32_t o = oc[x], c = backdrop; int po = (o != TRANSP) ? op[x] : 9, hit = 0;
                      for (int i = 0; i < nbl; i++) {
                          if (po <= blp[i]) { c = o; hit = 1; break; }
                          uint32_t v = bg[blk[i]][x]; if (v != TRANSP) { c = v; hit = 1; break; }
                      }
                      if (!hit && po != 9) c = o;
                      dst[x] = to_xrgb(c);
                  }
                  return;
              }
          #endif
              for (int x = 0; x < GBA_W; x++) {
                  int en = 0x3F;                                        /* bits0-3 BG, 4 OBJ, 5 effects */
                  if (anyWin) {
                      if (in0 && x >= x0a && x < x0b) en = winin & 0x3F;
                      else if (in1 && x >= x1a && x < x1b) en = (winin >> 8) & 0x3F;
                      else if (wo && ow[x]) en = (winout >> 8) & 0x3F;
                      else en = winout & 0x3F;
