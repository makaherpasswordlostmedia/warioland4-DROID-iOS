          }
          #endif
          WL4EOF
          cat > port/psp/gpu_psp.c <<'WL4EOF'
          /* PSP side of the GPU PPU: draws the quad plan from gpu_plan.c with the GE (one 5551 tile-cache texture, alpha test, single draw call). */
          #include <pspkernel.h>
          #include <pspdisplay.h>
          #include <pspgu.h>
          #include <stdio.h>
          #include <string.h>
          #include "hal.h"
          #include "gpu_plan.h"

          typedef struct { int16_t u, v, x, y, z; } V16;
          typedef struct { uint32_t c; float x, y, z; } VC;
          static unsigned int __attribute__((aligned(16))) gl[49152];

          /* GBA 240x160 -> 408x272 centred on the 480x272 screen */
          #define SX(x) (36 + ((x) * 17) / 10)
          #define SY(y) (((y) * 17) / 10)

          static int gpu_begin(void) { return gpu_plan_build(); }
          static void gpu_submit(void) {
              const GpuPlan *P = &g_gpuPlan;
              if (g_gpuDirtyY1 > g_gpuDirtyY0) {                       /* only the atlas rows that changed */
                  sceKernelDcacheWritebackRange(g_gpuAtlas + g_gpuDirtyY0 * 512, (unsigned)(g_gpuDirtyY1 - g_gpuDirtyY0) * 512 * 2);
                  g_gpuDirtyY0 = 512; g_gpuDirtyY1 = 0;
              }
              sceGuStart(GU_DIRECT, gl);
              sceGuClearColor(0xFF000000); sceGuClear(GU_COLOR_BUFFER_BIT);
              { /* backdrop colour inside the game rectangle */
                  const uint32_t b = P->backdrop, r = b & 31, g = (b >> 5) & 31, bl = (b >> 10) & 31;
                  const uint32_t abgr = 0xFF000000u | ((bl << 3 | bl >> 2) << 16) | ((g << 3 | g >> 2) << 8) | (r << 3 | r >> 2);
                  VC *c = (VC *)sceGuGetMemory(2 * sizeof(VC));
                  c[0].c = abgr; c[0].x = 36; c[0].y = 0; c[0].z = 0; c[1].c = abgr; c[1].x = 444; c[1].y = 272; c[1].z = 0;
                  sceGuDisable(GU_TEXTURE_2D); sceGuDisable(GU_ALPHA_TEST);
                  sceGuDrawArray(GU_SPRITES, GU_COLOR_8888 | GU_VERTEX_32BITF | GU_TRANSFORM_2D, 2, 0, c);
              }
              if (P->nq) {                                              /* every tile of the frame in ONE draw call, one texture, no CLUT */
                  V16 *v = (V16 *)sceGuGetMemory((unsigned)(P->nq * 2) * sizeof(V16));
                  for (int i = 0; i < P->nq; i++) {
                      const GpuQuad *q = &P->q[i];
                      v[2 * i].u = q->u0; v[2 * i].v = q->v0; v[2 * i].x = (int16_t)SX(q->x0); v[2 * i].y = (int16_t)SY(q->y0); v[2 * i].z = 0;
                      v[2 * i + 1].u = q->u1; v[2 * i + 1].v = q->v1; v[2 * i + 1].x = (int16_t)SX(q->x1); v[2 * i + 1].y = (int16_t)SY(q->y1); v[2 * i + 1].z = 0;
                  }
                  sceGuEnable(GU_TEXTURE_2D); sceGuTexMode(GU_PSM_5551, 0, 0, 0); sceGuTexImage(0, 512, 512, 512, g_gpuAtlas);
                  sceGuTexFunc(GU_TFX_REPLACE, GU_TCC_RGBA); sceGuTexFilter(GU_NEAREST, GU_NEAREST); sceGuTexWrap(GU_CLAMP, GU_CLAMP);
                  sceGuEnable(GU_ALPHA_TEST); sceGuAlphaFunc(GU_GREATER, 0, 0xFF);
                  sceGuDrawArray(GU_SPRITES, GU_TEXTURE_16BIT | GU_VERTEX_16BIT | GU_TRANSFORM_2D, 2 * P->nq, 0, v);
                  sceGuDisable(GU_ALPHA_TEST);
              }
              sceGuFinish(); sceGuSync(0, 0);
          }
          static const HalGpu g_ops = { gpu_begin, gpu_submit };
          void gpu_psp_install(void) { hal_set_gpu(&g_ops); }
          void gpu_psp_log_stats(void (*lg)(const char *)) {
              char m[160]; snprintf(m, sizeof m, "gpu: frames=%u fallback: mode/blank=%u window=%u blend=%u stat-irq=%u hblank-dma=%u sprite=%u quads=%u flushes=%u",
