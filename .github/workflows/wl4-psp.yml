                      const uint16_t e = *(const uint16_t *)(g_vram + sbase + sb * 0x800 + (((ty & 31) << 5) + (tx & 31)) * 2);
                      const uint32_t g = bpp8 ? (cbase >> 6) + (e & 0x3FF) : (cbase >> 5) + (e & 0x3FF);
                      if (g * (bpp8 ? 64u : 32u) >= 0x10000) continue;                 /* BG tiles cannot reach the OBJ area */
