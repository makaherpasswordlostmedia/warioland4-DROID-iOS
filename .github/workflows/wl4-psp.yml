                  sceKernelDcacheWritebackRange(g_tex, 256 * 161 * 4);
                  sceGuStart(GU_DIRECT, g_list);
                  sceGuClearColor(0xFF000000); sceGuClear(GU_COLOR_BUFFER_BIT);
                  sceGuTexMode(GU_PSM_8888, 0, 0, 0); sceGuTexImage(0, 256, 256, 256, g_tex);
                  sceGuTexFunc(GU_TFX_REPLACE, GU_TCC_RGB); sceGuTexFilter(GU_LINEAR, GU_LINEAR); sceGuTexWrap(GU_CLAMP, GU_CLAMP); sceGuEnable(GU_TEXTURE_2D);
                  Vtx *v = (Vtx *)sceGuGetMemory(2 * sizeof(Vtx));
                  v[0].u = 0; v[0].v = 0; v[0].x = 36; v[0].y = 0; v[0].z = 0;               /* 240x160 -> 408x272 (x1.7); GU_TRANSFORM_2D UVs are in TEXELS, not 0..1 */
                  v[1].u = 240.0f; v[1].v = 160.0f; v[1].x = 444; v[1].y = 272; v[1].z = 0;
                  sceGuDrawArray(GU_SPRITES, GU_TEXTURE_32BITF | GU_VERTEX_32BITF | GU_TRANSFORM_2D, 2, 0, v);
                  sceGuFinish(); sceGuSync(0, 0);
