          }
          WL4EOF
          cat > port/hal/memmap.c <<'WL4EOF'
          /* Region-table memory for the low-RAM (PSP) build.  See hal.h / wl4_psp_mem.h. */
          #ifdef WL4_MEMMAP
          #include "hal.h"
          #include <stdlib.h>
          #include <string.h>

          Wl4Region g_rg[16];
          uint8_t *g_io, *g_pal, *g_vram, *g_oam;

          static uint8_t *alloc_z(size_t n) {                       /* zeroed, 64-byte aligned */
              uint8_t *p = (uint8_t *)calloc(1, n + 64);
              return p ? (uint8_t *)(((uintptr_t)p + 63) & ~(uintptr_t)63) : NULL;
          }
          static void set(int i, uint8_t *b, uint32_t m) { g_rg[i].base = b; g_rg[i].mask = m; }

          /* data_size: bytes of wasm static memory starting at 0x0A000000 (data + bss + stack)
           * rom_image_off: offset of `rom_image` inside it.  The ROM region 0x08000000 is an alias of rom_image, so the ROM
           * is stored exactly once (8 MB) instead of twice. */
          int wl4_memmap_init(uint32_t data_size, uint32_t rom_image_off) {
              uint8_t *dummy = alloc_z(0x10000), *ew = alloc_z(0x40000), *iw = alloc_z(0x8000), *io = alloc_z(0x1000),
                      *pal = alloc_z(0x1000), *vram = alloc_z(0x20000), *oam = alloc_z(0x1000), *sram = alloc_z(0x10000),
                      *d = alloc_z(data_size);
              if (!dummy || !ew || !iw || !io || !pal || !vram || !oam || !sram || !d) return -1;
              for (int i = 0; i < 16; i++) set(i, dummy, 0xFFFF);   /* BIOS, unmapped: reads 0, writes harmless */
              set(0x2, ew, 0x3FFFF); set(0x3, iw, 0x7FFF); set(0x4, io, 0x3FF); set(0x5, pal, 0x3FF);
              set(0x6, vram, 0x1FFFF); set(0x7, oam, 0x3FF);
              set(0x8, d + rom_image_off, 0x7FFFFF); set(0x9, d + rom_image_off, 0x7FFFFF);
              set(0xA, d, 0xFFFFFF);
              set(0xE, sram, 0xFFFF);
              g_io = io; g_pal = pal; g_vram = vram; g_oam = oam;
              return 0;
          }
          #endif
          WL4EOF
          cat > port/hal/wl4_psp_mem.h <<'WL4EOF'
          /* Region table shared by the HAL and the (patched) wasm2c output.  Keep this header dependency-free:
           * it is #included from the huge generated wl4.c. */
          #ifndef WL4_PSP_MEM_H
          #define WL4_PSP_MEM_H
          #include <stdint.h>
          typedef struct { uint8_t *base; uint32_t mask; } Wl4Region;
          extern Wl4Region g_rg[16];                                /* indexed by addr >> 24 */
          static inline uint8_t *wl4_ptr(uint32_t a) { const Wl4Region *r = &g_rg[(a >> 24) & 15]; return r->base + (a & r->mask); }
          #endif
          WL4EOF
          cat > port/tools/patch_w2c_psp.py <<'WL4EOF'
          #!/usr/bin/env python3
          """Retarget the wasm2c output (wl4.c) from one flat 226 MB linear memory to the region table (hal/wl4_psp_mem.h).

           - MEM_ADDR / MEMCHECK / RANGE_CHECK are redefined: every load/store/data-segment write goes through wl4_ptr().
           - the (huge) memory allocation is shrunk to 1 page; the size fields keep their original values.
          Run AFTER patch_w2c_io/trace/div.   usage: patch_w2c_psp.py wl4.c"""
          import re, sys
          path = sys.argv[1]; src = open(path).read()
          if 'WL4_PSP_MEMMAP' in src: print('patch_w2c_psp: already patched'); sys.exit(0)
          lines = src.splitlines(keepends=True)
          NAMES = ('MEM_ADDR', 'MEM_ADDR_MEMOP', 'MEMCHECK', 'RANGE_CHECK', 'MEMCHECK_DEFAULT32', 'MEMCHECK_DEFAULT64')
          depth = 0; last_end = -1; i = 0; depth_at = []
          while i < len(lines):
              depth_at.append(depth); ln = lines[i]; st = ln.lstrip()
              if st.startswith('#'):
                  d = st[1:].lstrip()
                  if d.startswith(('if', 'ifdef', 'ifndef')): depth += 1
                  elif d.startswith('endif'): depth -= 1
                  m = re.match(r'define\s+(\w+)', d)
                  if m and m.group(1) in NAMES:
                      j = i
                      while lines[j].rstrip().endswith('\\'): j += 1; depth_at.append(depth)
                      last_end = j; i = j
              i += 1
          if last_end < 0: sys.exit('patch_w2c_psp: no MEM_ADDR/MEMCHECK macro definitions found (unsupported wabt version)')
          k = last_end + 1
          while k < len(lines) and (depth_at[k] != 0 or lines[k].lstrip().startswith('#') and not lines[k].lstrip().startswith(('#define', '#include', '#undef'))): k += 1
          block = '''/* ---- WL4_PSP_MEMMAP: addresses go through the region table instead of one flat memory ---- */
          #include "wl4_psp_mem.h"
          #undef MEM_ADDR
          #define MEM_ADDR(mem, addr, n) wl4_ptr((uint32_t)(addr))
          ''' + ('#undef MEM_ADDR_MEMOP\n#define MEM_ADDR_MEMOP(mem, addr, n) wl4_ptr((uint32_t)(addr))\n' if 'MEM_ADDR_MEMOP' in src else '') + '''#undef MEMCHECK
          #define MEMCHECK(mem, a, t) ((void)0)
          #undef RANGE_CHECK
          #define RANGE_CHECK(mem, offset, len) ((void)0)
          '''
          lines.insert(k, block); out = ''.join(lines)
          pat = re.compile(r'wasm_rt_allocate_memory\(\s*([^,]+?)\s*,\s*(\d+)u?\s*,\s*(\d+)u?\s*,\s*(\w+)\s*\)\s*;')
          def rep(m):
              mem, pg, mx, is64 = m.groups()
              return ('wasm_rt_allocate_memory(%s, 1, 1, %s); (%s)->pages = %s; (%s)->max_pages = %s; (%s)->size = %su * 65536u;'
                      % (mem, is64, mem, pg, mem, mx, mem, pg))
          out, n = pat.subn(rep, out)
          if n != 1: sys.exit('patch_w2c_psp: expected exactly one wasm_rt_allocate_memory call, found %d' % n)
          left = [l.strip() for l in out.splitlines() if re.search(r'(->|\.)data\b', l) and 'MEM_ADDR' not in l and not l.lstrip().startswith(('#', '//', '*', '/*'))]
          print('patch_w2c_psp: ok (insert at line %d); remaining direct ->data uses: %d' % (k, len(left)))
          for l in left[:10]: print('   WARNING:', l[:160])
          open(path, 'w').write(out)
          WL4EOF
          cat > port/tools/gen_psp_layout.py <<'WL4EOF'
          #!/usr/bin/env python3
          """Read the static layout out of wl4.wasm (needs wasm-objdump from wabt) and write layout.h for the PSP build.
          usage: gen_psp_layout.py wl4.wasm layout.h rom_size [wasm-objdump]"""
          import re, subprocess, sys
          wasm, out, romsize = sys.argv[1], sys.argv[2], int(sys.argv[3], 0)
          tool = sys.argv[4] if len(sys.argv) > 4 else 'wasm-objdump'
          txt = subprocess.run([tool, '-x', wasm], capture_output=True, text=True, check=True).stdout
          glob = {}
          for m in re.finditer(r'global\[(\d+)\]\s+i32\s+mutable=(\d)\s*(?:<[^>]*>\s*)?-\s*init\s+i32=(-?\w+)', txt):
              glob[int(m.group(1))] = (int(m.group(2)), int(m.group(3), 0) & 0xFFFFFFFF)
          m = re.search(r'global\[(\d+)\]\s*->\s*"rom_image"', txt)
          if not m or int(m.group(1)) not in glob: sys.exit('gen_psp_layout: rom_image export not found')
          rom = glob[int(m.group(1))][1]
          mut = [v for k, (mu, v) in sorted(glob.items()) if mu]
          if not mut: sys.exit('gen_psp_layout: no mutable global (stack pointer) found')
          sp = mut[0]
          if not (0x0A000000 <= rom < sp < 0x0E000000): sys.exit('gen_psp_layout: implausible layout rom=%x sp=%x' % (rom, sp))
          open(out, 'w').write('/* generated by gen_psp_layout.py */\n#define WL4_ROM_IMAGE_ADDR 0x%08Xu\n#define WL4_STATIC_END 0x%08Xu\n#define WL4_ROM_SIZE %du\n' % (rom, sp, romsize))
          print('layout: rom_image=0x%08X static_end=0x%08X (%.1f MB static)' % (rom, sp, (sp - 0x0A000000) / 1048576))
          WL4EOF
          cat > port/psp/prepare.sh <<'WL4EOF'
          #!/usr/bin/env bash
          # After port/build_wasm.sh: assemble everything the PSP Makefile needs in port/build/psp/w2c.
          #   WABT=/path/to/wabt  ./port/psp/prepare.sh [rom_path]
          set -euo pipefail
          PORT=$(cd "$(dirname "$0")/.." && pwd); B=$PORT/build; O=$B/psp/w2c
          ROM=${1:-$PORT/../baserom_us.gba}
          : "${WABT:?set WABT}"
          rm -rf "$B/psp"; mkdir -p "$O"
          cp "$B/wasm2c/"* "$O/"
          python3 "$PORT/tools/patch_w2c_psp.py" "$O/wl4.c"
          # PSP newlib has no TLS: wasm-rt's thread-local call-depth counter becomes a plain global
          sed -i -E 's/\b(_Thread_local|__thread|thread_local)\b//g' "$O"/wasm-rt*.[ch]
          # ...and no C11 <threads.h> either (missing machine/_threads.h in the PSP newlib)
          sed -i -E '/#\s*include\s*<threads\.h>/d' "$O"/wasm-rt*.[ch] "$O"/wl4.[ch]
          grep -n 'threads.h\|thread_local\|_Thread_local' "$O"/wasm-rt*.[ch] "$O"/wl4.h || true
          # PSP newlib has setjmp/longjmp but no sigsetjmp/siglongjmp/sigjmp_buf (we install no signal handlers anyway)
          sed -i -E 's/\bsigsetjmp\(([^,()]+),[^)]*\)/setjmp(\1)/g; s/\bsiglongjmp\b/longjmp/g; s/\bsigjmp_buf\b/jmp_buf/g' "$O"/wasm-rt*.[ch]
          grep -n 'setjmp\|longjmp\|jmp_buf' "$O"/wasm-rt.h || true
          python3 "$PORT/tools/gen_stubs.py" "$O/wl4.h" "$O/stubs.c"
          python3 "$PORT/tools/gen_psp_layout.py" "$B/wl4.wasm" "$O/layout.h" "$(stat -c %s "$ROM")" "$WABT/bin/wasm-objdump"
          # runtime sources (skip files that wl4.c already includes, and the Windows one)
          RT=""
          for f in $(ls "$O"/wasm-rt-*.c 2>/dev/null | grep -v -- '-win\.c'); do
            b=$(basename "$f"); grep -qF "\"$b\"" "$O/wl4.c" "$O/wl4.h" 2>/dev/null || RT="$RT $b"
          done
          echo "RT_SRCS = $RT" > "$O/rt.mk"; cat "$O/rt.mk"
          WL4EOF
          cat > port/psp/Makefile <<'WL4EOF'
          # PSP build.  Run inside the pspdev toolchain after prepare.sh.  make [PSP_OPT=-O1] [LARGE=1]
          PORT = ..
          W2C  = $(PORT)/build/psp/w2c
          include $(W2C)/rt.mk

          TARGET = WL4
          PSP_OPT ?= -O2
          OBJS = psp_main.o core.o $(PORT)/hal/hal.o $(PORT)/hal/ppu.o $(PORT)/hal/bios.o $(PORT)/hal/memmap.o \
                 $(W2C)/wl4.o $(W2C)/stubs.o $(RT_SRCS:%.c=$(W2C)/%.o)

          INCDIR = $(W2C) $(PORT)/hal $(PORT)/psp
          CFLAGS = $(PSP_OPT) -G0 -w -D__STDC_NO_THREADS__=1 -fno-strict-aliasing -fwrapv -DWL4_MEMMAP -DWL4_PSP \
                   -DWASM_RT_USE_MMAP=0 -DWASM_RT_SKIP_SIGNAL_RECOVERY=1 -DWASM_RT_TRAP_HANDLER=wl4_trap
          CXXFLAGS = $(CFLAGS) -fno-exceptions -fno-rtti
          ASFLAGS = $(CFLAGS)
          LIBS = -lpspgu -lpspaudio -lpspctrl -lpspdisplay -lpspge -lpspdebug -lpsppower -lm

          EXTRA_TARGETS = EBOOT.PBP
          PSP_EBOOT_TITLE = Wario Land 4
          ifeq ($(LARGE),1)
          PSP_LARGE_MEMORY = 1
          endif
          PSPSDK = $(shell psp-config --pspsdk-path)
          include $(PSPSDK)/lib/build.mak
          WL4EOF
          cat > port/psp/core.h <<'WL4EOF'
          /* Platform-independent core of the PSP port (also used by the native x86 smoke test). */
          #ifndef WL4_CORE_H
          #define WL4_CORE_H
          #include <stdint.h>
          typedef struct {
              void     (*present)(const uint32_t *fb240x160, int rendered);   /* once per frame; must block until vsync */
              uint16_t (*poll_keys)(void);                                    /* GBA KEYINPUT order, active high */
              uint64_t (*now_us)(void);
              int      (*exit_requested)(void);
              void     (*audio_push)(const int8_t *right, const int8_t *left, int n, int rate);
              void     (*save_sram)(const uint8_t *sram64k);
              void     (*quit)(void);                                         /* never returns */
              void     (*fatal)(const char *msg);                             /* never returns */
          } Wl4Plat;
          int      wl4_core_init(void);              /* allocate the memory map; 0 = ok */
          uint8_t *wl4_core_rom_buffer(void);        /* read the ROM (WL4_ROM_SIZE bytes) here before wl4_core_run */
          void     wl4_core_run(const Wl4Plat *p, const uint8_t *save64k_or_null);   /* runs the game; exits via p->quit */
          #endif
          WL4EOF
          cat > port/psp/core.c <<'WL4EOF'
          #include "wl4.h"
          #include "../hal/hal.h"
          #include "layout.h"          /* generated: WL4_ROM_IMAGE_ADDR, WL4_STATIC_END, WL4_ROM_SIZE */
          #include "core.h"
          #include <string.h>
          #include <stdio.h>

          struct w2c_env { w2c_wl4 *inst; };
          static w2c_wl4 g_inst;
          static struct w2c_env g_env;
          static const Wl4Plat *P;
          static uint64_t g_tStart; static unsigned g_frames; static int g_skipMode;
          static uint8_t g_saved[GBA_SRAM_SIZE]; static int g_dirty;

          int wl4_core_init(void) { return wl4_memmap_init(WL4_STATIC_END - 0x0A000000u + 0x10000u, WL4_ROM_IMAGE_ADDR - 0x0A000000u); }
          uint8_t *wl4_core_rom_buffer(void) { return g_rg[8].base; }

          void wl4_trap(wasm_rt_trap_t code) {
              char m[64]; snprintf(m, sizeof m, "wasm trap %d", (int)code); P->fatal(m);
              for (;;) {}
          }

          /* ---- imports the wasm module expects (same set as host/host.c) ---- */
          void w2c_env_hal_dma_set(struct w2c_env *e, u32 ch, u32 src, u32 dst, u32 ctl) { (void)e; hal_dma_set((int)ch, src, dst, ctl); }
          void w2c_env_hal_audio_push(struct w2c_env *e, u32 right, u32 left, u32 n, u32 rate) {
              (void)e; if (n > 4096) return; P->audio_push((const int8_t *)wl4_ptr(right), (const int8_t *)wl4_ptr(left), (int)n, (int)rate);
          }
          void w2c_env_hal_trace_val(struct w2c_env *e, u32 tag, u32 val) { (void)e; (void)tag; (void)val; }
          void w2c_env_hal_unported_asm(struct w2c_env *e, u32 site) { (void)e; (void)site; }
          u32  w2c_env_hal_poll_vcount(struct w2c_env *e) { (void)e; return hal_poll_vcount(); }
          void w2c_env_LZ77UnCompVram(struct w2c_env *e, u32 s, u32 d) { (void)e; bios_LZ77UnComp(s, d); }
          void w2c_env_LZ77UnCompWram(struct w2c_env *e, u32 s, u32 d) { (void)e; bios_LZ77UnComp(s, d); }
          void w2c_env_RLUnCompWram(struct w2c_env *e, u32 s, u32 d) { (void)e; bios_RLUnComp(s, d); }
          void w2c_env_RLUnCompVram(struct w2c_env *e, u32 s, u32 d) { (void)e; bios_RLUnComp(s, d); }
          void w2c_env_CPUSet(struct w2c_env *e, u32 s, u32 d, u32 c) { (void)e; bios_CpuSet(s, d, c); }
          void w2c_env_CpuFastSet(struct w2c_env *e, u32 s, u32 d, u32 c) { (void)e; bios_CpuFastSet(s, d, c); }
          void w2c_env_BgAffineSet(struct w2c_env *e, u32 s, u32 d, u32 n) { (void)e; bios_BgAffineSet(s, d, (int32_t)n); }
          void w2c_env_ObjAffineSet(struct w2c_env *e, u32 s, u32 d, u32 n, u32 o) { (void)e; bios_ObjAffineSet(s, d, (int32_t)n, (int32_t)o); }
          void w2c_env_irq_handler(struct w2c_env *e) { (void)e; }
          void w2c_env_hal_syscall(struct w2c_env *e, u32 num) { (void)e; if (num == 2 || num == 5) hal_run_frame(); }

          static void cb_vblank(void) { w2c_wl4_InterruptCallbackCallVBlank(&g_inst); }
          static void cb_hblank(void) { w2c_wl4_InterruptCallbackCallHBlank(&g_inst); }
          static void cb_vcount(void) { w2c_wl4_InterruptCallbackCallVCount(&g_inst); }

          static void flush_save(int force) {
              const uint8_t *s = hal_sram();
              if (memcmp(s, g_saved, GBA_SRAM_SIZE) == 0) { if (force) g_dirty = 0; return; }
              if (!force && !g_dirty) { g_dirty = 1; return; }        /* write only after the data was stable for one check */
              memcpy(g_saved, s, GBA_SRAM_SIZE); g_dirty = 0; P->save_sram(g_saved);
          }

          static void cb_frame(void) {
              uint32_t work = (uint32_t)(P->now_us() - g_tStart);
              int rendered = !g_hal_skip_render;
              g_frames++;
              if (rendered) { if (!g_skipMode && work > 16000) g_skipMode = 1; else if (g_skipMode && work < 11000) g_skipMode = 0; }
              if (P->poll_keys) hal_set_keys(P->poll_keys());
              P->present(hal_framebuffer(), rendered);
              if ((g_frames & 63) == 0) flush_save(0);
              if (P->exit_requested()) { flush_save(1); P->quit(); }
              g_hal_skip_render = g_skipMode ? (int)(g_frames & 1) : 0;
              g_tStart = P->now_us();
          }

          void wl4_core_run(const Wl4Plat *p, const uint8_t *save) {
              P = p;
              wasm_rt_init();
              g_env.inst = &g_inst;
              wasm2c_wl4_instantiate(&g_inst, &g_env);
              hal_init(NULL, 0);
              HalCallbacks cb = { cb_vblank, cb_hblank, cb_vcount, cb_frame };
              hal_set_callbacks(&cb);
              if (save) memcpy(hal_sram(), save, GBA_SRAM_SIZE);
              memcpy(g_saved, hal_sram(), GBA_SRAM_SIZE);
              g_tStart = P->now_us();
              w2c_wl4_AgbMain(&g_inst);
              P->fatal("AgbMain returned");
          }
          WL4EOF
          cat > port/psp/psp_main.c <<'WL4EOF'
          /* PSP front end: video (GU), input, audio, save files, exit callback. */
          #include <pspkernel.h>
          #include <pspdebug.h>
          #include <pspdisplay.h>
          #include <pspctrl.h>
          #include <pspgu.h>
          #include <pspaudio.h>
          #include <psppower.h>
          #include <stdio.h>
          #include <string.h>
          #include <stdlib.h>
          #include "layout.h"
          #include "core.h"

          PSP_MODULE_INFO("WL4", PSP_MODULE_USER, 1, 0);
          PSP_MAIN_THREAD_ATTR(PSP_THREAD_ATTR_USER);
          PSP_HEAP_SIZE_KB(-512);
          #ifdef PSP_MAIN_THREAD_STACK_SIZE_KB
          PSP_MAIN_THREAD_STACK_SIZE_KB(512);
          #endif

          static char g_dir[256] = "ms0:/PSP/GAME/WL4/";
          static volatile int g_exit;
          static uint8_t g_sram_copy[0x10000];

          /* ---------- log ---------- */
          static void logf_(const char *m) { char p[300]; snprintf(p, sizeof p, "%swl4.log", g_dir); FILE *f = fopen(p, "a"); if (f) { fputs(m, f); fputc('\n', f); fclose(f); } }

          /* ---------- video ---------- */
          typedef struct { float u, v, x, y, z; } Vtx;
          static unsigned int __attribute__((aligned(16))) g_list[65536];
          static uint32_t __attribute__((aligned(64))) g_tex[256 * 256];
          static void video_init(void) {
              sceGuInit(); sceGuStart(GU_DIRECT, g_list);
              sceGuDrawBuffer(GU_PSM_8888, (void *)0, 512);
              sceGuDispBuffer(480, 272, (void *)0x88000, 512);
              sceGuOffset(2048 - 240, 2048 - 136); sceGuViewport(2048, 2048, 480, 272);
              sceGuScissor(0, 0, 480, 272); sceGuEnable(GU_SCISSOR_TEST);
              sceGuDisable(GU_DEPTH_TEST); sceGuDisable(GU_BLEND);
              sceGuFinish(); sceGuSync(0, 0); sceDisplayWaitVblankStart(); sceGuDisplay(GU_TRUE);
          }
          static void plat_present(const uint32_t *fb, int rendered) {
              if (rendered) {
                  for (int y = 0; y < 160; y++) {
                      uint32_t *d = g_tex + y * 256; const uint32_t *s = fb + y * 240;
                      for (int x = 0; x < 240; x++) { uint32_t c = s[x]; d[x] = (c & 0xFF00FF00u) | ((c >> 16) & 0xFF) | ((c & 0xFF) << 16); }
                  }
                  sceKernelDcacheWritebackRange(g_tex, 256 * 160 * 4);
                  sceGuStart(GU_DIRECT, g_list);
                  sceGuClearColor(0xFF000000); sceGuClear(GU_COLOR_BUFFER_BIT);
                  sceGuTexMode(GU_PSM_8888, 0, 0, 0); sceGuTexImage(0, 256, 256, 256, g_tex);
                  sceGuTexFunc(GU_TFX_REPLACE, GU_TCC_RGB); sceGuTexFilter(GU_LINEAR, GU_LINEAR); sceGuEnable(GU_TEXTURE_2D);
                  Vtx *v = (Vtx *)sceGuGetMemory(2 * sizeof(Vtx));
                  v[0].u = 0; v[0].v = 0; v[0].x = 36; v[0].y = 0; v[0].z = 0;               /* 240x160 -> 408x272 (x1.7) */
                  v[1].u = 240.0f / 256; v[1].v = 160.0f / 256; v[1].x = 444; v[1].y = 272; v[1].z = 0;
                  sceGuDrawArray(GU_SPRITES, GU_TEXTURE_32BITF | GU_VERTEX_32BITF | GU_TRANSFORM_2D, 2, 0, v);
                  sceGuFinish(); sceGuSync(0, 0);
                  sceDisplayWaitVblankStart(); sceGuSwapBuffers();
              } else sceDisplayWaitVblankStart();
          }

          /* ---------- input ---------- */
          static uint16_t plat_keys(void) {
              SceCtrlData pad; sceCtrlPeekBufferPositive(&pad, 1);
              uint16_t k = 0; unsigned b = pad.Buttons;
              if (b & (PSP_CTRL_CROSS | PSP_CTRL_CIRCLE)) k |= 1;        /* A */
              if (b & (PSP_CTRL_SQUARE | PSP_CTRL_TRIANGLE)) k |= 2;     /* B */
              if (b & PSP_CTRL_SELECT) k |= 4;
              if (b & PSP_CTRL_START) k |= 8;
              if ((b & PSP_CTRL_RIGHT) || pad.Lx > 192) k |= 0x10;
              if ((b & PSP_CTRL_LEFT) || pad.Lx < 64) k |= 0x20;
              if ((b & PSP_CTRL_UP) || pad.Ly < 64) k |= 0x40;
              if ((b & PSP_CTRL_DOWN) || pad.Ly > 192) k |= 0x80;
              if (b & PSP_CTRL_RTRIGGER) k |= 0x100;
              if (b & PSP_CTRL_LTRIGGER) k |= 0x200;
              return k;
          }

          /* ---------- audio: SPSC ring + fixed-point linear resampler to 44.1 kHz ---------- */
          #define RING 8192u
          static int16_t g_ring[RING][2];
          static volatile uint32_t g_w, g_r; static volatile int g_rate = 13379, g_arun = 1;
          static void plat_audio_push(const int8_t *right, const int8_t *left, int n, int rate) {
              g_rate = rate > 4000 ? rate : 13379;
              uint32_t w = g_w, used = w - g_r, cap = (uint32_t)g_rate / 8; if (cap > RING) cap = RING;
              uint32_t room = used < cap ? cap - used : 0; if ((uint32_t)n > room) n = (int)room;
              for (int i = 0; i < n; i++) { g_ring[(w + i) & (RING - 1)][0] = (int16_t)(left[i] * 256); g_ring[(w + i) & (RING - 1)][1] = (int16_t)(right[i] * 256); }
              g_w = w + n;
          }
          static void audio_render(int16_t *out, int frames) {
              static int primed; static uint32_t pos;
              uint32_t w = g_w, r = g_r; int src = g_rate; int32_t target = src / 25;
              if (!primed) { if ((int32_t)(w - r) >= target) primed = 1; else { memset(out, 0, (size_t)frames * 4); return; } }
              int32_t step = (int32_t)(((int64_t)src << 16) / 44100);
              int32_t adj = (int32_t)(((int64_t)step * ((int32_t)(w - r) - target)) / target / 50), lim = step / 100;
              if (adj > lim) adj = lim; if (adj < -lim) adj = -lim; step += adj;
              for (int i = 0; i < frames; i++) {
                  if ((int32_t)(w - r) < 2) { primed = 0; for (; i < frames; i++) out[2 * i] = out[2 * i + 1] = 0; break; }
                  const int16_t *a = g_ring[r & (RING - 1)], *b = g_ring[(r + 1) & (RING - 1)]; int32_t f = (int32_t)pos;
                  out[2 * i] = (int16_t)(a[0] + (((int32_t)b[0] - a[0]) * f >> 16)); out[2 * i + 1] = (int16_t)(a[1] + (((int32_t)b[1] - a[1]) * f >> 16));
                  pos += (uint32_t)step; r += pos >> 16; pos &= 0xFFFF;
              }
              g_r = r;
          }
          static int audio_thread(SceSize a, void *b) {
              (void)a; (void)b; static int16_t buf[1024 * 2] __attribute__((aligned(64)));
              int ch = sceAudioChReserve(PSP_AUDIO_NEXT_CHANNEL, 1024, PSP_AUDIO_FORMAT_STEREO);
              if (ch < 0) return 0;
              while (g_arun) { audio_render(buf, 1024); sceAudioOutputBlocking(ch, PSP_AUDIO_VOLUME_MAX, buf); }
              sceAudioChRelease(ch); return 0;
          }

          /* ---------- save / exit ---------- */
          static void plat_save(const uint8_t *s) {
              char p[300]; snprintf(p, sizeof p, "%swl4.sav", g_dir); FILE *f = fopen(p, "wb"); if (!f) { logf_("save: cannot open file"); return; }
              fwrite(s, 1, 0x10000, f); fclose(f);
          }
          static uint64_t plat_now(void) { return sceKernelGetSystemTimeWide(); }
          static int plat_exit_req(void) { return g_exit; }
          static void plat_quit(void) { g_arun = 0; sceKernelDelayThread(50000); sceKernelExitGame(); for (;;) sceKernelSleepThread(); }
          static void plat_fatal(const char *m) {
              logf_(m);
              for (int i = 0; i < 120; i++) { sceGuStart(GU_DIRECT, g_list); sceGuClearColor(0xFF0000AA); sceGuClear(GU_COLOR_BUFFER_BIT); sceGuFinish(); sceGuSync(0, 0); sceDisplayWaitVblankStart(); sceGuSwapBuffers(); }
              plat_quit();
          }
          static int exit_cb(int a1, int a2, void *c) { (void)a1; (void)a2; (void)c; g_exit = 1; return 0; }
          static int cb_thread(SceSize a, void *b) { (void)a; (void)b; int id = sceKernelCreateCallback("exit", exit_cb, NULL); sceKernelRegisterExitCallback(id); sceKernelSleepThreadCB(); return 0; }

          static void die(const char *m) { pspDebugScreenInit(); pspDebugScreenPrintf("%s\n", m); sceKernelDelayThread(6000000); sceKernelExitGame(); for (;;) {} }

          int main(int argc, char **argv) {
              if (argc > 0 && argv[0]) { strncpy(g_dir, argv[0], sizeof g_dir - 1); char *s = strrchr(g_dir, '/'); if (s) s[1] = 0; }
              { int t = sceKernelCreateThread("cb", cb_thread, 0x11, 0xFA0, 0, NULL); if (t >= 0) sceKernelStartThread(t, 0, NULL); }
              scePowerSetClockFrequency(333, 333, 166);
              if (wl4_core_init()) die("Out of memory (needs ~12 MB free; close plugins or use a PSP-2000+).");

              static const char *names[] = { "baserom.gba", "baserom_us.gba", "wl4.gba", "warioland4.gba", 0 };
              FILE *f = 0; char p[300];
              for (int i = 0; names[i] && !f; i++) { snprintf(p, sizeof p, "%s%s", g_dir, names[i]); f = fopen(p, "rb"); }
              if (!f) die("ROM not found. Put your Wario Land 4 (US) ROM next to EBOOT.PBP as baserom.gba");
              fseek(f, 0, SEEK_END); long sz = ftell(f); fseek(f, 0, SEEK_SET);
              if (sz != (long)WL4_ROM_SIZE) { fclose(f); die("Wrong ROM size: this build needs the exact US ROM it was built from."); }
              if (fread(wl4_core_rom_buffer(), 1, (size_t)sz, f) != (size_t)sz) { fclose(f); die("ROM read error"); }
              fclose(f);

              const uint8_t *save = 0;
              snprintf(p, sizeof p, "%swl4.sav", g_dir); f = fopen(p, "rb");
              if (f) { if (fread(g_sram_copy, 1, 0x10000, f) == 0x10000) save = g_sram_copy; fclose(f); }

              sceCtrlSetSamplingCycle(0); sceCtrlSetSamplingMode(PSP_CTRL_MODE_ANALOG);
              video_init();
              { int t = sceKernelCreateThread("audio", audio_thread, 0x12, 0x4000, 0, NULL); if (t >= 0) sceKernelStartThread(t, 0, NULL); }
              logf_("start");
              static const Wl4Plat plat = { plat_present, plat_keys, plat_now, plat_exit_req, plat_audio_push, plat_save, plat_quit, plat_fatal };
              wl4_core_run(&plat, save);
              return 0;
          }
          WL4EOF
          cat > port/psp/native_test.c <<'WL4EOF'
          /* Native x86 smoke test of the PSP memory map: runs the real wasm2c game through core.c with the region table.
           *   native_test <rom> <frames> [out.ppm]            (built by the CI workflow, no PSP needed) */
          #include "core.h"
          #include "layout.h"
          #include <stdio.h>
          #include <stdlib.h>
          #include <time.h>
          static int g_frames, g_want; static uint32_t g_fb[240 * 160]; static const char *g_out;
          static uint64_t now(void) { struct timespec t; clock_gettime(CLOCK_MONOTONIC, &t); return t.tv_sec * 1000000ull + t.tv_nsec / 1000; }
          static void present(const uint32_t *fb, int r) { (void)r; for (int i = 0; i < 240 * 160; i++) g_fb[i] = fb[i]; g_frames++; }
          static uint16_t keys(void) { return 0; }
          static int want_exit(void) { return g_frames >= g_want; }
          static void apush(const int8_t *r, const int8_t *l, int n, int rate) { (void)r; (void)l; (void)n; (void)rate; }
          static void save(const uint8_t *s) { (void)s; }
          static void quit(void) {
              unsigned nz = 0; for (int i = 0; i < 240 * 160; i++) if (g_fb[i] & 0xFFFFFF) nz++;
              printf("frames=%d non-black pixels=%u/%d\n", g_frames, nz, 240 * 160);
              if (g_out) { FILE *o = fopen(g_out, "wb"); fprintf(o, "P6\n240 160\n255\n"); for (int i = 0; i < 240 * 160; i++) { fputc(g_fb[i] >> 16, o); fputc(g_fb[i] >> 8, o); fputc(g_fb[i], o); } fclose(o); }
              exit(nz > 0 ? 0 : 3);
          }
          static void fatal(const char *m) { printf("FATAL: %s (frame %d)\n", m, g_frames); exit(1); }
          int main(int argc, char **argv) {
              if (argc < 3) return 2; g_want = atoi(argv[2]); g_out = argc > 3 ? argv[3] : NULL;
              if (wl4_core_init()) return 2;
              FILE *f = fopen(argv[1], "rb"); if (!f) return 2;
              if (fread(wl4_core_rom_buffer(), 1, WL4_ROM_SIZE, f) != WL4_ROM_SIZE) return 2; fclose(f);
              static const Wl4Plat p = { present, keys, now, want_exit, apush, save, quit, fatal };
              wl4_core_run(&p, NULL); return 0;
          }
          WL4EOF
          chmod +x port/psp/prepare.sh port/tools/*.py
          cat >> README.md <<'WL4EOF'

          ## PSP port
          Built by .github/workflows/wl4-psp.yml (all sources are embedded in that workflow).
          WL4EOF

      # Resolve effective tool versions once so cache keys and install steps agree.
      - name: Resolve tool versions
        run: |
          WABT_EFF="${{ inputs.wabt_version }}"
          case "$WABT_EFF" in [0-9]*.[0-9]*.[0-9]*) ;; *) WABT_EFF="" ;; esac
          echo "WABT_EFF=${WABT_EFF:-${{ env.WABT_VERSION }}}" >> "$GITHUB_ENV"
          OPT="${{ inputs.opt_level }}"
          echo "OPT_LEVEL=${OPT:-2}" >> "$GITHUB_ENV"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 python3-venv python3-pip \
            gcc-multilib curl ca-certificates git unzip

      - name: Get ROM
        env:
          ROM_ID: ${{ secrets.WL4_ROM_ID }}
        run: |
          if [ ! -f baserom_us.gba ]; then
            if [ -z "$ROM_ID" ]; then
              echo "::error::Secret WL4_ROM_ID not set. Add your Google Drive file ID as a repo secret."
              exit 1
            fi
            pip install --quiet gdown
            gdown "$ROM_ID" -O baserom_us.gba
          fi
          ls -l baserom_us.gba
          echo "${ROM_MD5_US}  baserom_us.gba" | md5sum -c - \
            || { echo "::error::baserom_us.gba MD5 mismatch — wrong ROM version or corrupted download"; exit 1; }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract assets from ROM (make extract)
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --quiet pyyaml
          make extract VERSION=us
          echo "Extracted $(find include/data -type f | wc -l) asset files"

      # ── wasi-sdk ────────────────────────────────────────────────────────────
      - name: Cache wasi-sdk
        id: cache-wasi
        uses: actions/cache@v4
        with:
          path: ~/wasi-sdk
          key: wasi-sdk-${{ env.WASI_SDK_VERSION }}

      - name: Install wasi-sdk
        if: steps.cache-wasi.outputs.cache-hit != 'true'
        run: |
          ARCH=$(uname -m)   # x86_64 on standard runners; aarch64 on arm runners
          VER="${{ env.WASI_SDK_VERSION }}"
          # GitHub release assets have used two naming conventions across versions:
          #   <v>.0-<arch>-linux.tar.gz   (current)
          #   <v>.0+m-<arch>-linux.tar.gz (older patch releases)
          BASE="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${VER}"
          PRIMARY="${BASE}/wasi-sdk-${VER}.0-${ARCH}-linux.tar.gz"
          FALLBACK="${BASE}/wasi-sdk-${VER}.0+m-${ARCH}-linux.tar.gz"
          if ! curl -fsSL -o /tmp/wasi.tgz "$PRIMARY"; then
            echo "::warning::Primary wasi-sdk URL failed; trying fallback naming."
            curl -fsSL -o /tmp/wasi.tgz "$FALLBACK"
          fi
          mkdir -p ~/wasi-sdk
          tar -xzf /tmp/wasi.tgz -C ~/wasi-sdk --strip-components=1
          ~/wasi-sdk/bin/clang --version

      # ── wabt (wasm2c) ────────────────────────────────────────────────────────
      - name: Cache wabt
        id: cache-wabt
        uses: actions/cache@v4
        with:
          path: |
            ~/wabt-install
            ~/wabt-src
          # Cache key includes the effective version so an input override busts the cache.
          key: wabt-${{ env.WABT_EFF }}

      - name: Build wabt (wasm2c) from source
        if: steps.cache-wabt.outputs.cache-hit != 'true'
        run: |
          VER="${{ env.WABT_EFF }}"
          # Try the exact tag first; fall back to the branch name without "v" prefix.
          if ! git clone --recursive --depth 1 --branch "${VER}" \
                https://github.com/WebAssembly/wabt ~/wabt-src 2>/dev/null; then
            echo "::warning::Tag ${VER} not found; trying v${VER}"
            git clone --recursive --depth 1 --branch "v${VER}" \
              https://github.com/WebAssembly/wabt ~/wabt-src
          fi
          cmake -S ~/wabt-src -B ~/wabt-src/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$HOME/wabt-install"
          cmake --build ~/wabt-src/build -j"$(nproc)"
          cmake --install ~/wabt-src/build
          ~/wabt-install/bin/wasm2c --version

      # ── portify → wasm32 → wasm2c ───────────────────────────────────────────
      - name: portify -> wasm32 -> wasm2c
        env:
          WASI_SDK: /home/runner/wasi-sdk
          WABT: /home/runner/wabt-install
          WABT_SRC: /home/runner/wabt-src
          OPT_LEVEL: ${{ env.OPT_LEVEL }}
        run: |
          set -o pipefail
          chmod +x port/build_wasm.sh
          ./port/build_wasm.sh us 2>&1 | tee port-build.log
          echo "--- failed C files (expected: none)"
          cat port/build/FAILED.txt
          echo "--- unported asm sites (expected: none)"
          cat port/build/ASM_SITES.txt
          echo "--- audit (expected: empty)"
          cat port/build/p/AUDIT.txt
          test -s port/build/wasm2c/wl4.c
          ls -l port/build/wl4.wasm port/build/wasm2c/wl4.c

      # ── native test of the PSP memory map (no PSP needed) ───────────────────
      - name: Prepare PSP sources (patch wasm2c output for the region-table memory)
        env:
          WABT: /home/runner/wabt-install
        run: |
          set -o pipefail
          chmod +x port/psp/prepare.sh
          ./port/psp/prepare.sh baserom_us.gba 2>&1 | tee psp-prepare.log

      - name: Native smoke test (x86, PSP memory map)
        if: ${{ inputs.run_host_smoke_test }}
        continue-on-error: true
        run: |
          set -x
          O=port/build/psp/w2c; P=port
          RT=$(sed 's/RT_SRCS = //' $O/rt.mk)
          for f in $RT; do RTC="$RTC $O/$f"; done
          gcc -O1 -w -fno-strict-aliasing -m64 \
            -DWL4_MEMMAP -DWASM_RT_USE_MMAP=0 -DWASM_RT_SKIP_SIGNAL_RECOVERY=1 -DWASM_RT_TRAP_HANDLER=wl4_trap \
            -I$O -I$P/hal -I$P/psp \
            $P/psp/native_test.c $P/psp/core.c $P/hal/hal.c $P/hal/ppu.c $P/hal/bios.c $P/hal/memmap.c \
            $O/stubs.c $O/wl4.c $RTC -o /tmp/psp_native -lm
          timeout 300 /tmp/psp_native baserom_us.gba 600 /tmp/frame.ppm

      # ── PSP build (pspdev toolchain in docker) ───────────────────────────────
      - name: Build EBOOT.PBP
        run: |
          docker run --rm -v "$PWD":/src -w /src/port/psp \
            ghcr.io/pspdev/pspdev:latest \
            make -j2 PSP_OPT="${{ inputs.psp_opt }}" 2>&1 | tee psp-make.log
          sudo chown -R "$(id -u):$(id -g)" port
          ls -l port/psp/EBOOT.PBP

      - name: Package
        run: |
          mkdir -p dist/PSP/GAME/WL4
          cp port/psp/EBOOT.PBP dist/PSP/GAME/WL4/
          echo "Copy your own Wario Land 4 (US, md5 ${ROM_MD5_US}) ROM here as baserom.gba" > dist/PSP/GAME/WL4/PUT_ROM_HERE.txt

      - name: Upload PSP build
        uses: actions/upload-artifact@v4
        with:
          name: wl4-psp
          path: dist/
          retention-days: 14

      - name: Upload build diagnostics (no ROM data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wl4-psp-diagnostics
          path: |
            port-build.log
            psp-prepare.log
            psp-make.log
            port/build/FAILED.txt
            port/build/errors.log
            port/build/ASM_SITES.txt
          if-no-files-found: ignore
          retention-days: 14
