          }

          static const uint8_t OW[3][4] = {{8,16,32,64},{16,32,32,64},{8,8,16,32}};
          static const uint8_t OH[3][4] = {{8,16,32,64},{8,8,16,32},{16,32,32,64}};
          typedef struct { int ox, oy, w, h, bpp8, tile, p, pb4, hf, vf; } Sp;
          /* returns 0 = skip sprite, 1 = ok, -1 = unsupported (affine / semi-transparent / OBJ window) */
          static int sprite_decode(int i, Sp *s) {
              const uint16_t *o = (const uint16_t *)(g_oam + i * 8); const uint16_t a0 = o[0], a1 = o[1], a2 = o[2];
              const int affine = (a0 >> 8) & 1;
              if (!affine && ((a0 >> 9) & 1)) return 0;
              const int mode = (a0 >> 10) & 3; if (mode == 3) return 0;
              const int shape = a0 >> 14, sz = a1 >> 14; if (shape == 3) return 0;
              const int dbl = affine && ((a0 >> 9) & 1);
              const int w = OW[shape][sz], h = OH[shape][sz], bw = dbl ? w * 2 : w, bh = dbl ? h * 2 : h;
