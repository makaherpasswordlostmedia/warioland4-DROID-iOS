          static void bg_layer(int n) {
              const uint16_t cnt = rd16(IO_BG0CNT + n * 2);
              const uint32_t cbase = ((cnt >> 2) & 3) * 0x4000, sbase = ((cnt >> 8) & 0x1F) * 0x800;
