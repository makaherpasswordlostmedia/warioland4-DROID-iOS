              if (objOn) for (int i = 0; i < 128; i++) {
                  int r = sprite_decode(i, &sp[nsp]); if (r < 0) { g_gpuStat[6]++; return 0; }
                  if (r) nsp++;
              }
              track();
              if (!build_pass(disp, layers, sp, nsp, oneD)) {
                  if (cacheFull) { flush_cache(); g_gpuDirtyY0 = 0; g_gpuDirtyY1 = 512; if (build_pass(disp, layers, sp, nsp, oneD)) goto ok; }
                  g_gpuStat[7]++; return 0;
              }
