              q->x0 = (int16_t)cx0; q->y0 = (int16_t)cy0; q->x1 = (int16_t)cx1; q->y1 = (int16_t)cy1;
              if (!hf) { q->u0 = (int16_t)(u + a); q->u1 = (int16_t)(u + b); } else { q->u0 = (int16_t)(u + 8 - a); q->u1 = (int16_t)(u + 8 - b); }
              if (!vf) { q->v0 = (int16_t)(v + c); q->v1 = (int16_t)(v + d); } else { q->v0 = (int16_t)(v + 8 - c); q->v1 = (int16_t)(v + 8 - d); }
