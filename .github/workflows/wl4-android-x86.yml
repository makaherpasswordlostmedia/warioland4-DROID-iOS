name: Build Wario Land 4 Android x86 port

# Android on x86: x86_64 (Android-x86 / Bliss OS PCs, Chromebooks, Intel tablets, Android Studio emulator) and
# x86 (32-bit images).  Same pipeline as wl4-android.yml (decomp -> wasm32 -> wasm2c -> NDK); only the ABIs,
# the extra 32-bit host test and the x86 checks differ.
#
# Single-file port: drop this .yml into .github/workflows/ - nothing else to copy.
# Targets Android 4.4.4 (API 19) and newer.
#
# ROM: the build needs YOUR OWN US ROM (md5 5fe47355a33e3fabec2a1607af88a404).  Either
#   - commit baserom_us.gba to a PRIVATE repo, or
#   - add the repo secret WL4_ROM_ID (Google Drive file ID that only you can reach).
# `make extract` turns ROM data into C includes that get compiled into the APK, so the artifact is
# ROM-derived: this workflow refuses to run in a public repo unless you explicitly override that.

on:
  workflow_dispatch:
    inputs:
      abis:
        description: "Android ABIs (comma separated). x86_64 = 64-bit Android-x86 / emulator, x86 = 32-bit images."
        default: "x86_64,x86"
      allow_public_repo:
        description: "I understand the APK embeds ROM-derived data and the artifact is downloadable from a public repo"
        type: boolean
        default: false
      run_host_smoke_test:
        description: "Run the ROM headless on the runner for a few seconds before building the APK"
        type: boolean
        default: true
      run_emulator_test:
        description: "Boot an x86 emulator on the runner, install the APK, run the game for ~30 s (slow, needs KVM)"
        type: boolean
        default: false
      emulator_arch:
        description: "Emulator image for the test above (must be one of the ABIs you build)"
        type: choice
        options: ["x86_64", "x86"]
        default: "x86_64"
      wabt_version:
        description: "Override wabt version (leave blank to use the default below)"
        default: ""
      opt_level:
        description: "Clang -O level for the wasm32 compile (0/1/2). Lower values use less RAM but produce larger .wasm."
        default: "2"

env:
  WASI_SDK_VERSION: "24"
  WABT_VERSION: "1.0.36"
  ROM_MD5_US: "5fe47355a33e3fabec2a1607af88a404"
  NDK_VERSION: "25.2.9519653"   # r25 = last NDK that supports minSdk 19 (Android 4.4.4)

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Refuse public repos unless overridden
        if: ${{ github.event.repository.private == false && inputs.allow_public_repo != true }}
        run: |
          echo "::error::This repo is public. The APK embeds data extracted from your ROM; rerun with allow_public_repo=true only if you accept that."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      # Everything the port needs is applied here, so this .yml is the only file to add to the repo:
      # Android 4.4.4 (minSdk 19, NDK r25, OpenSL ES audio, no AndroidX, clock_nanosleep fallback) + x86 ABIs/keys.
      - name: Apply patches (Android 4.4 / API 19 support, x86 ABIs, keyboard keys)
        run: |
          python3 - <<'PY'
          import os

          def rd(p):
              with open(p, encoding="utf-8") as f: return f.read()
          def wr(p, s):
              with open(p, "w", encoding="utf-8", newline="\n") as f: f.write(s)

          def edit(path, old, new, marker=None):
              s = rd(path)
              if (marker or new) in s:
                  print("already patched:", path); return
              assert s.count(old) == 1, "pattern not found in " + path + ": " + old[:60]
              wr(path, s.replace(old, new)); print("patched:", path)

          # ---------- Gradle: Android 4.4.4 (API 19), NDK r25, no AndroidX, x86 ABIs ----------
          G = "android/app/build.gradle.kts"
          edit(G, 'ndkVersion = "26.3.11579264"', 'ndkVersion = "25.2.9519653"   // r25 = last NDK that can target API 19')
          edit(G, 'minSdk = 26;', 'minSdk = 19;')
          edit(G, '?: "arm64-v8a,x86_64").split(",")',
                  '?: "arm64-v8a,x86_64,x86").split(",").map { it.trim() }.filter { it.isNotEmpty() }')
          edit(G, 'dependencies { implementation("androidx.appcompat:appcompat:1.7.0") }',
                  '// no AndroidX: appcompat 1.7 needs minSdk 21')

          wr("android/app/src/main/res/values/themes.xml",
             '<resources><style name="Theme.WL4" parent="@android:style/Theme.Holo.NoActionBar">'
             '<item name="android:windowFullscreen">true</item></style></resources>\n')

          # ---------- CMake: OpenSL ES instead of AAudio, 32-bit x86 stack alignment ----------
          edit("android/app/src/main/cpp/CMakeLists.txt",
               "target_link_libraries(wl4 log m aaudio)",
               "if(ANDROID_ABI STREQUAL \"x86\")\n  target_compile_options(wl4 PRIVATE -mstackrealign)\nendif()\n"
               "target_link_libraries(wl4 log m OpenSLES)",
               marker="OpenSLES")

          # ---------- Kotlin: plain Activity, immersive mode, keyboard keys ----------
          K = "android/app/src/main/java/com/wl4/port/"
          for f in ("GameActivity.kt", "MainActivity.kt"):
              s = rd(K + f)
              if "AppCompatActivity" in s:
                  s = s.replace("import androidx.appcompat.app.AppCompatActivity\n", "import android.app.Activity\n").replace("AppCompatActivity()", "Activity()")
                  wr(K + f, s); print("patched:", K + f)
          edit(K + "GameActivity.kt", "import android.os.Bundle\n", "import android.os.Build\nimport android.os.Bundle\n")
          edit(K + "GameActivity.kt", "KeyEvent.KEYCODE_ENTER -> Key.START",
               "KeyEvent.KEYCODE_ENTER, KeyEvent.KEYCODE_NUMPAD_ENTER -> Key.START\n"
               "        KeyEvent.KEYCODE_A -> Key.L; KeyEvent.KEYCODE_S -> Key.R\n"
               "        KeyEvent.KEYCODE_DEL, KeyEvent.KEYCODE_SHIFT_RIGHT -> Key.SELECT",
               marker="KEYCODE_NUMPAD_ENTER")
          edit(K + "GameActivity.kt",
               "    override fun onResume() { super.onResume(); Native.pause(false); view.start() }",
               "    override fun onResume() { super.onResume(); Native.pause(false); view.start(); hideBars() }\n"
               "    override fun onWindowFocusChanged(f: Boolean) { super.onWindowFocusChanged(f); if (f) hideBars() }\n"
               "    @Suppress(\"DEPRECATION\")\n"
               "    private fun hideBars() {   // immersive sticky exists since API 19\n"
               "        if (Build.VERSION.SDK_INT >= 19) window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_LAYOUT_STABLE or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or\n"
               "            View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_FULLSCREEN or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY\n"
               "    }",
               marker="hideBars")

          # ---------- host.c: clock_nanosleep needs API 21 ----------
          H = "port/host/host.c"
          edit(H, "#include <unistd.h>\n", "#include <unistd.h>\n#include <errno.h>\n", marker="#include <errno.h>")
          edit(H, "static void cb_frame(void) {",
          """/* clock_nanosleep() exists in bionic only since API 21; Android 4.4 needs the relative nanosleep() form */
          static void sleep_until(const struct timespec *t) {
              struct timespec now, d; clock_gettime(CLOCK_MONOTONIC, &now);
              d.tv_sec = t->tv_sec - now.tv_sec; d.tv_nsec = t->tv_nsec - now.tv_nsec;
              if (d.tv_nsec < 0) { d.tv_nsec += 1000000000L; d.tv_sec--; }
              if (d.tv_sec < 0) return;
              while (nanosleep(&d, &d) == -1 && errno == EINTR) {}
          }
          static void cb_frame(void) {""", marker="sleep_until(const")
          edit(H, "    clock_nanosleep(CLOCK_MONOTONIC, TIMER_ABSTIME, &next, NULL);", "    sleep_until(&next);")

          # ---------- audio.c: AAudio (API 26) -> OpenSL ES (API 9) ----------
          A = "port/host/audio.c"
          s = rd(A)
          if "OpenSL ES buffer-queue" in s:
              print("already patched:", A)
          else:
              s = s.replace("#ifdef __ANDROID__\n#include <aaudio/AAudio.h>\n#endif\n", "", 1)
              a = s.index("#ifdef __ANDROID__\n#include <android/log.h>")
              b = s.index("#else\nvoid wl4_audio_start(void) {}")
              s = s[:a] + r'''#ifdef __ANDROID__
          /* OpenSL ES buffer-queue output (API 9+).  AAudio needs API 26 and would stop the lib from loading on Android 4.4. */
          #include <android/log.h>
          #include <SLES/OpenSLES.h>
          #include <SLES/OpenSLES_Android.h>

          #define OUT_RATE   44100                         /* the one rate every Android audio HAL must support */
          #define BUF_FRAMES 512                           /* ~11.6 ms per buffer */
          #define NBUF       4

          static SLObjectItf g_engineObj, g_mixObj, g_playerObj;
          static SLPlayItf g_play;
          static SLAndroidSimpleBufferQueueItf g_bq;
          static int16_t g_buf[NBUF][BUF_FRAMES * 2];
          static int g_cur;

          /* OpenSL audio thread: the oldest queued buffer has finished playing -> refill it and queue it again. */
          static void bq_cb(SLAndroidSimpleBufferQueueItf bq, void *ctx) {
              (void)ctx;
              int16_t *b = g_buf[g_cur]; g_cur = (g_cur + 1) % NBUF;
              render(b, BUF_FRAMES, OUT_RATE);
              (*bq)->Enqueue(bq, b, sizeof g_buf[0]);
          }
          static void close_stream(void) {
              if (g_play) (*g_play)->SetPlayState(g_play, SL_PLAYSTATE_STOPPED);
              if (g_bq) (*g_bq)->Clear(g_bq);
              if (g_playerObj) (*g_playerObj)->Destroy(g_playerObj);
              if (g_mixObj) (*g_mixObj)->Destroy(g_mixObj);
              if (g_engineObj) (*g_engineObj)->Destroy(g_engineObj);
              g_playerObj = g_mixObj = g_engineObj = NULL; g_play = NULL; g_bq = NULL;
          }
          #define SL_CHECK(call, what) do { SLresult r_ = (call); if (r_ != SL_RESULT_SUCCESS) { \
              fprintf(stderr, "wl4: audio: %s failed (0x%x)\n", what, (unsigned)r_); close_stream(); return; } } while (0)
          static void open_stream(void) {
              SLEngineItf eng;
              SL_CHECK(slCreateEngine(&g_engineObj, 0, NULL, 0, NULL, NULL), "slCreateEngine");
              SL_CHECK((*g_engineObj)->Realize(g_engineObj, SL_BOOLEAN_FALSE), "engine Realize");
              SL_CHECK((*g_engineObj)->GetInterface(g_engineObj, SL_IID_ENGINE, &eng), "engine GetInterface");
              SL_CHECK((*eng)->CreateOutputMix(eng, &g_mixObj, 0, NULL, NULL), "CreateOutputMix");
              SL_CHECK((*g_mixObj)->Realize(g_mixObj, SL_BOOLEAN_FALSE), "mix Realize");

              SLDataLocator_AndroidSimpleBufferQueue locBq = { SL_DATALOCATOR_ANDROIDSIMPLEBUFFERQUEUE, NBUF };
              SLDataFormat_PCM fmt = { SL_DATAFORMAT_PCM, 2, SL_SAMPLINGRATE_44_1, SL_PCMSAMPLEFORMAT_FIXED_16, SL_PCMSAMPLEFORMAT_FIXED_16,
                                       SL_SPEAKER_FRONT_LEFT | SL_SPEAKER_FRONT_RIGHT, SL_BYTEORDER_LITTLEENDIAN };
              SLDataSource src = { &locBq, &fmt };
              SLDataLocator_OutputMix locOm = { SL_DATALOCATOR_OUTPUTMIX, g_mixObj };
              SLDataSink snk = { &locOm, NULL };
              const SLInterfaceID ids[1] = { SL_IID_ANDROIDSIMPLEBUFFERQUEUE };
              const SLboolean req[1] = { SL_BOOLEAN_TRUE };
              SL_CHECK((*eng)->CreateAudioPlayer(eng, &g_playerObj, &src, &snk, 1, ids, req), "CreateAudioPlayer");
              SL_CHECK((*g_playerObj)->Realize(g_playerObj, SL_BOOLEAN_FALSE), "player Realize");
              SL_CHECK((*g_playerObj)->GetInterface(g_playerObj, SL_IID_PLAY, &g_play), "player GetInterface(PLAY)");
              SL_CHECK((*g_playerObj)->GetInterface(g_playerObj, SL_IID_ANDROIDSIMPLEBUFFERQUEUE, &g_bq), "player GetInterface(BQ)");
              SL_CHECK((*g_bq)->RegisterCallback(g_bq, bq_cb, NULL), "RegisterCallback");

              atomic_store(&g_flush, 1);
              memset(g_buf, 0, sizeof g_buf); g_cur = 0;
              for (int i = 0; i < NBUF; i++) SL_CHECK((*g_bq)->Enqueue(g_bq, g_buf[i], sizeof g_buf[0]), "initial Enqueue");
              SL_CHECK((*g_play)->SetPlayState(g_play, SL_PLAYSTATE_PLAYING), "SetPlayState(PLAYING)");
              fprintf(stderr, "wl4: audio: OpenSL ES %d Hz, %d frames/buffer x %d\n", OUT_RATE, BUF_FRAMES, NBUF);
          }
          void wl4_audio_start(void) { atomic_store(&g_w, 0); atomic_store(&g_r, 0); g_pos = 0; g_primed = 0; atomic_store(&g_paused, 0); open_stream(); }
          void wl4_audio_stop(void) { close_stream(); }
          void wl4_audio_poll(void) {}                     /* OpenSL ES has no route-change error callback */
          ''' + s[b:]
              wr(A, s); print("patched:", A)
          PY
          git diff --stat || true

      # Resolve effective tool versions once so cache keys and install steps agree.
      - name: Resolve tool versions
        run: |
          WABT_EFF="${{ inputs.wabt_version }}"
          echo "WABT_EFF=${WABT_EFF:-${{ env.WABT_VERSION }}}" >> "$GITHUB_ENV"
          OPT="${{ inputs.opt_level }}"
          echo "OPT_LEVEL=${OPT:-2}" >> "$GITHUB_ENV"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 python3-venv python3-pip \
            gcc-multilib curl ca-certificates git unzip

      - name: Get ROM
        env:
          ROM_ID: ${{ secrets.WL4_ROM_ID }}
        run: |
          if [ ! -f baserom_us.gba ]; then
            if [ -z "$ROM_ID" ]; then
              echo "::error::Secret WL4_ROM_ID not set. Add your Google Drive file ID as a repo secret."
              exit 1
            fi
            pip install --quiet gdown
            gdown "$ROM_ID" -O baserom_us.gba
          fi
          ls -l baserom_us.gba
          echo "${ROM_MD5_US}  baserom_us.gba" | md5sum -c - \
            || { echo "::error::baserom_us.gba MD5 mismatch — wrong ROM version or corrupted download"; exit 1; }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract assets from ROM (make extract)
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --quiet pyyaml
          make extract VERSION=us
          echo "Extracted $(find include/data -type f | wc -l) asset files"

      # ── wasi-sdk ────────────────────────────────────────────────────────────
      - name: Cache wasi-sdk
        id: cache-wasi
        uses: actions/cache@v4
        with:
          path: ~/wasi-sdk
          key: wasi-sdk-${{ env.WASI_SDK_VERSION }}

      - name: Install wasi-sdk
        if: steps.cache-wasi.outputs.cache-hit != 'true'
        run: |
          ARCH=$(uname -m)   # x86_64 on standard runners; aarch64 on arm runners
          VER="${{ env.WASI_SDK_VERSION }}"
          # GitHub release assets have used two naming conventions across versions:
          #   <v>.0-<arch>-linux.tar.gz   (current)
          #   <v>.0+m-<arch>-linux.tar.gz (older patch releases)
          BASE="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${VER}"
          PRIMARY="${BASE}/wasi-sdk-${VER}.0-${ARCH}-linux.tar.gz"
          FALLBACK="${BASE}/wasi-sdk-${VER}.0+m-${ARCH}-linux.tar.gz"
          if ! curl -fsSL -o /tmp/wasi.tgz "$PRIMARY"; then
            echo "::warning::Primary wasi-sdk URL failed; trying fallback naming."
            curl -fsSL -o /tmp/wasi.tgz "$FALLBACK"
          fi
          mkdir -p ~/wasi-sdk
          tar -xzf /tmp/wasi.tgz -C ~/wasi-sdk --strip-components=1
          ~/wasi-sdk/bin/clang --version

      # ── wabt (wasm2c) ────────────────────────────────────────────────────────
      - name: Cache wabt
        id: cache-wabt
        uses: actions/cache@v4
        with:
          path: |
            ~/wabt-install
            ~/wabt-src
          # Cache key includes the effective version so an input override busts the cache.
          key: wabt-${{ env.WABT_EFF }}

      - name: Build wabt (wasm2c) from source
        if: steps.cache-wabt.outputs.cache-hit != 'true'
        run: |
          VER="${{ env.WABT_EFF }}"
          # Try the exact tag first; fall back to the branch name without "v" prefix.
          if ! git clone --recursive --depth 1 --branch "${VER}" \
                https://github.com/WebAssembly/wabt ~/wabt-src 2>/dev/null; then
            echo "::warning::Tag ${VER} not found; trying v${VER}"
            git clone --recursive --depth 1 --branch "v${VER}" \
              https://github.com/WebAssembly/wabt ~/wabt-src
          fi
          cmake -S ~/wabt-src -B ~/wabt-src/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$HOME/wabt-install"
          cmake --build ~/wabt-src/build -j"$(nproc)"
          cmake --install ~/wabt-src/build
          ~/wabt-install/bin/wasm2c --version

      # ── portify → wasm32 → wasm2c ───────────────────────────────────────────
      - name: portify -> wasm32 -> wasm2c
        env:
          WASI_SDK: /home/runner/wasi-sdk
          WABT: /home/runner/wabt-install
          WABT_SRC: /home/runner/wabt-src
          OPT_LEVEL: ${{ env.OPT_LEVEL }}
        run: |
          set -o pipefail
          chmod +x port/build_wasm.sh
          ./port/build_wasm.sh us 2>&1 | tee port-build.log
          echo "--- failed C files (expected: none)"
          cat port/build/FAILED.txt
          echo "--- unported asm sites (expected: none)"
          cat port/build/ASM_SITES.txt
          echo "--- audit (expected: empty)"
          cat port/build/p/AUDIT.txt
          test -s port/build/wasm2c/wl4.c
          ls -l port/build/wl4.wasm port/build/wasm2c/wl4.c

      # ── host smoke test ──────────────────────────────────────────────────────
      # Builds the wasm2c output natively and runs the ROM headless, once as x86_64 and once as i386 (-m32).
      # The i386 run exercises the same code path as the Android x86 ABI: 32-bit host => no mmap guard pages,
      # explicit bounds checks in the wasm2c memory accessors.
      - name: Host smoke test (x86_64 + i386, ROM headless)
        if: ${{ inputs.run_host_smoke_test }}
        continue-on-error: true
        run: |
          set -x
          W=port/build/wasm2c

          python3 port/tools/gen_stubs.py "$W/wl4.h" /tmp/stubs.c

          # Newer wabt: wl4.c already includes some wasm-rt-*.c; compiling them again gives duplicate symbols.
          RT=""
          for f in $(ls "$W"/wasm-rt-*.c 2>/dev/null | grep -v -- '-win\.c'); do
            base=$(basename "$f")
            if grep -qF "\"$base\"" "$W/wl4.c" "$W/wl4.h" 2>/dev/null; then
              echo "smoke-test: skipping $base (already included by wl4.c)"
            else
              RT="$RT $f"
            fi
          done

          fail=0
          for M in 64 32; do
            rm -f /tmp/smoke$M.res
            if gcc -m$M -O1 -w \
                 -I "$W" -I port/host \
                 -DWASM_RT_TRAP_HANDLER=wl4_trap -DWL4_TRACE=1 \
                 port/tests/headless.c port/host/host.c port/hal/*.c \
                 /tmp/stubs.c "$W/wl4.c" $RT \
                 -o /tmp/headless$M -lm -lpthread; then
              timeout 120 /tmp/headless$M baserom_us.gba 300 2>&1 | tail -30 | tee smoke$M.log
              if grep -q 'frames=[1-9]' smoke$M.log; then echo ok > /tmp/smoke$M.res; else echo "NO FRAMES" > /tmp/smoke$M.res; fail=1; fi
            else
              echo "BUILD FAILED" > /tmp/smoke$M.res; fail=1
            fi
          done
          exit $fail

      # ── Android build ────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # default is "tools platform-tools"; the legacy `tools` package no longer
          # exists in the repo and makes sdkmanager exit 1 ("Failed to find package 'tools'")
          packages: ""

      - name: Install SDK / NDK / CMake components
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        env:
          ABIS: ${{ inputs.abis }}
        run: gradle -p android assembleDebug -Pwl4Abis="$ABIS" --no-daemon --stacktrace

      - name: Verify native libs in the APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          for abi in $(echo "${{ inputs.abis }}" | tr ',' ' '); do
            unzip -l "$APK" | grep -q "lib/$abi/libwl4.so" \
              || { echo "::error::lib/$abi/libwl4.so is missing from the APK"; exit 1; }
          done
          rm -rf /tmp/apk && mkdir -p /tmp/apk && unzip -q -o "$APK" 'lib/*' -d /tmp/apk
          file /tmp/apk/lib/*/libwl4.so

      # ── optional: run it on a real x86 emulator ─────────────────────────────
      - name: Enable KVM
        if: ${{ inputs.run_emulator_test }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write emulator test script
        if: ${{ inputs.run_emulator_test }}
        run: |
          cat > /tmp/wl4-emu-smoke.sh <<'EOS'
          #!/usr/bin/env bash
          set -u
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          PKG=com.wl4.port
          echo "emulator ABI: $(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
          adb install -r "$APK" || { echo "install failed"; exit 1; }
          adb push baserom_us.gba /data/local/tmp/wl4.gba
          adb shell "run-as $PKG sh -c 'mkdir -p files && cp /data/local/tmp/wl4.gba files/wl4.gba'" || { echo "could not place ROM"; exit 1; }
          adb shell rm -f /data/local/tmp/wl4.gba
          adb logcat -c
          adb shell am start -n $PKG/.GameActivity
          ok=0
          for i in $(seq 1 40); do
            sleep 3
            if adb logcat -d -s wl4:I | grep -qE 'frame 600,'; then ok=1; break; fi
            if adb logcat -d -s wl4:* | grep -qE 'FATAL|wasm trap'; then break; fi
          done
          adb logcat -d -s wl4:I wl4:F > emu-wl4.log
          tail -25 emu-wl4.log
          if [ $ok = 1 ] && ! grep -qE 'FATAL|wasm trap' emu-wl4.log; then echo "EMULATOR SMOKE: OK"; exit 0; fi
          echo "EMULATOR SMOKE: FAILED"; exit 1
          EOS

      - name: Emulator smoke test (${{ inputs.emulator_arch }})
        if: ${{ inputs.run_emulator_test }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: ${{ inputs.emulator_arch }}
          target: google_apis
          disable-animations: true
          script: bash /tmp/wl4-emu-smoke.sh

      # ── artifacts ────────────────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wl4-x86-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload build diagnostics (no ROM data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wl4-build-diagnostics
          path: |
            port-build.log
            port/build/FAILED.txt
            port/build/errors.log
            port/build/ASM_SITES.txt
            port/build/p/AUDIT.txt
            emu-wl4.log
            smoke64.log
            smoke32.log
          if-no-files-found: ignore
          retention-days: 14

      # ── job summary ──────────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## WL4 Android x86 build summary"
            echo ""
            echo "| Parameter | Value |"
            echo "|-----------|-------|"
            echo "| wabt | ${{ env.WABT_EFF }} |"
            echo "| wasi-sdk | ${{ env.WASI_SDK_VERSION }} |"
            echo "| -O level | ${{ env.OPT_LEVEL }} |"
            echo "| ABIs | ${{ inputs.abis }} |"
            echo "| host smoke x86_64 | $(cat /tmp/smoke64.res 2>/dev/null || echo skipped) |"
            echo "| host smoke i386 | $(cat /tmp/smoke32.res 2>/dev/null || echo skipped) |"
            echo ""

            if [ -f port/build/wl4.wasm ]; then
              WASM_SIZE=$(stat -c %s port/build/wl4.wasm)
              echo "| wl4.wasm | ${WASM_SIZE} bytes |"
            fi
            if [ -f port/build/wasm2c/wl4.c ]; then
              WL4C_SIZE=$(stat -c %s port/build/wasm2c/wl4.c)
              echo "| wl4.c (wasm2c output) | ${WL4C_SIZE} bytes |"
            fi

            echo ""
            echo "### C compilation"
            if [ -f port/build/FAILED.txt ]; then
              BAD=$(grep -c . port/build/FAILED.txt 2>/dev/null || echo 0)
              echo "- Failed files: **${BAD}** (see \`port/build/FAILED.txt\`)"
            fi
            if [ -f port/build/ASM_SITES.txt ]; then
              ASM=$(grep -c . port/build/ASM_SITES.txt 2>/dev/null || echo 0)
              echo "- Unported ASM sites: **${ASM}**"
            fi

            echo ""
            echo "### APK"
            APK=android/app/build/outputs/apk/debug/app-debug.apk
            if [ -f "$APK" ]; then
              APK_SIZE=$(stat -c %s "$APK")
              echo "- Built: ✅ (${APK_SIZE} bytes)"
            else
              echo "- Built: ❌"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
